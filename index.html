/* ---------- ambient + burst particles ---------- */
const FX = (()=>{
  const amb=document.getElementById('ambient'), top=document.getElementById('fxtop');
  const a=amb.getContext('2d'), b=top.getContext('2d');
  let W=0,H=0,dpr=1, mode=null, cols=['#888888'], P=[], B=[], raf=0, lastT=0;
  const R=(x,y)=>x+Math.random()*(y-x), pick=arr=>arr[Math.floor(Math.random()*arr.length)];
  const COUNT={leaves:14,storm:20,motes:26,wind:9,fireflies:18,clouds:6,ash:24,embers:22,autumn:14,sparks:26,stars:55};
  function size(){ dpr=Math.min(2,window.devicePixelRatio||1); W=window.innerWidth; H=window.innerHeight; [amb,top].forEach(c=>{ c.width=Math.round(W*dpr); c.height=Math.round(H*dpr); }); a.setTransform(dpr,0,0,dpr,0,0); b.setTransform(dpr,0,0,dpr,0,0); }
  function make(init){
    const c=pick(cols);
    switch(mode){
      case 'leaves': case 'autumn': return {k:'leaf', x:R(0,W), y:init?R(0,H):R(-40,-10), vx:R(-10,12), vy:R(14,28), r:R(0,6.3), vr:R(-1,1), s:R(5,9), c, sw:R(0,6.3), al:R(.35,.6)};
      case 'storm': return {k:'leaf', x:init?R(0,W):R(-80,W*.6), y:init?R(0,H):R(-40,-10), vx:R(40,80), vy:R(30,55), r:R(0,6.3), vr:R(-3,3), s:R(4,8), c, sw:0, al:R(.3,.55)};
      case 'motes': return {k:'dot', x:R(0,W), y:init?R(0,H):H+10, vx:R(-4,4), vy:R(-11,-4), s:R(1.2,2.8), c, al:R(.3,.65), tw:R(0,6.3)};
      case 'wind': return {k:'streak', x:init?R(0,W):R(-240,-60), y:R(0,H), vx:R(150,250), vy:R(-6,6), len:R(60,140), c, al:R(.14,.28), ph:R(0,6.3)};
      case 'fireflies': return {k:'glow', x:R(0,W), y:R(0,H), vx:R(-8,8), vy:R(-8,8), s:R(2,3.4), c, tw:R(0,6.3), al:.85};
      case 'clouds': return {k:'cloud', x:init?R(-100,W):-240, y:R(0,H), vx:R(4,10), vy:0, s:R(90,170), c, al:R(.3,.5)};
      case 'ash': return {k:'flake', x:R(0,W), y:init?R(0,H):-10, vx:R(-10,14), vy:R(10,24), r:R(0,6.3), vr:R(-2,2), s:R(1.5,3.2), c, al:R(.3,.55)};
      case 'embers': return {k:'ember', x:R(0,W), y:init?R(0,H):H+10, vx:R(-8,8), vy:R(-26,-12), s:R(1.4,2.8), c, al:R(.45,.85), tw:R(0,6.3)};
      case 'sparks': return {k:'ember', x:R(0,W), y:init?R(0,H):H+10, vx:R(-20,20), vy:R(-90,-45), s:R(1.2,2.4), c, al:R(.5,.9), tw:R(0,6.3)};
      case 'stars': return {k:'star', x:R(0,W), y:R(0,H), vx:0, vy:R(-2,-.5), s:R(.8,2.2), c, tw:R(0,6.3), al:R(.45,.95)};
    }
    return null;
  }
  function leafPath(ctx,s){ ctx.beginPath(); ctx.moveTo(-s,0); ctx.quadraticCurveTo(0,-s*.75,s,0); ctx.quadraticCurveTo(0,s*.75,-s,0); ctx.closePath(); }
  function draw(ctx,p,t){
    ctx.save(); ctx.translate(p.x,p.y);
    const tw = p.tw!=null ? (.5+.5*Math.sin(t/650+p.tw)) : 1;
    switch(p.k){
      case 'leaf': ctx.rotate(p.r); ctx.globalAlpha=p.al; ctx.fillStyle=p.c; leafPath(ctx,p.s); ctx.fill(); ctx.globalAlpha=p.al*.5; ctx.strokeStyle='rgba(0,0,0,.35)'; ctx.lineWidth=.7; ctx.beginPath(); ctx.moveTo(-p.s*.9,0); ctx.lineTo(p.s*.9,0); ctx.stroke(); break;
      case 'dot': ctx.globalAlpha=p.al*(.5+.5*tw); ctx.fillStyle=p.c; ctx.beginPath(); ctx.arc(0,0,p.s,0,6.283); ctx.fill(); break;
      case 'streak': { ctx.globalAlpha=p.al; ctx.strokeStyle=p.c; ctx.lineWidth=1.6; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(-p.len/2, Math.sin(t/500+p.ph)*10, -p.len, 0); ctx.stroke(); break; }
      case 'glow': { const al=.15+.75*tw; ctx.globalAlpha=al*.35; ctx.fillStyle=p.c; ctx.beginPath(); ctx.arc(0,0,p.s*3.2,0,6.283); ctx.fill(); ctx.globalAlpha=al; ctx.beginPath(); ctx.arc(0,0,p.s,0,6.283); ctx.fill(); break; }
      case 'cloud': { const g=ctx.createRadialGradient(0,0,0,0,0,p.s); g.addColorStop(0,rgbaHex(p.c,p.al)); g.addColorStop(1,rgbaHex(p.c,0)); ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(0,0,p.s*1.6,p.s*.7,0,0,6.283); ctx.fill(); break; }
      case 'flake': ctx.rotate(p.r); ctx.globalAlpha=p.al; ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6); break;
      case 'ember': { const al=p.al*(.55+.45*tw); ctx.globalAlpha=al*.3; ctx.fillStyle=p.c; ctx.beginPath(); ctx.arc(0,0,p.s*2.6,0,6.283); ctx.fill(); ctx.globalAlpha=al; ctx.beginPath(); ctx.arc(0,0,p.s,0,6.283); ctx.fill(); ctx.globalAlpha=al*.5; ctx.strokeStyle=p.c; ctx.lineWidth=p.s*.8; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-p.vx*.08,-p.vy*.08); ctx.stroke(); break; }
      case 'star': { const al=p.al*(.35+.65*tw); ctx.globalAlpha=al; ctx.fillStyle=p.c; ctx.strokeStyle=p.c; if(p.s>1.7){ ctx.lineWidth=.9; ctx.beginPath(); ctx.moveTo(-p.s*2.4,0); ctx.lineTo(p.s*2.4,0); ctx.moveTo(0,-p.s*2.4); ctx.lineTo(0,p.s*2.4); ctx.stroke(); } ctx.beginPath(); ctx.arc(0,0,p.s*.75,0,6.283); ctx.fill(); break; }
    }
    ctx.restore();
  }
  function frame(t){
    raf=0; const dt=Math.min(.05,(t-(lastT||t))/1000); lastT=t;
    const ambOn = mode && !reduceMotion() && prefs.ambient;
    a.clearRect(0,0,W,H);
    if(ambOn){
      for(let i=0;i<P.length;i++){
        const p=P[i]; p.x+=p.vx*dt; p.y+=p.vy*dt;
        if(p.sw!=null && p.k==='leaf') p.x+=Math.sin(t/1100+p.sw)*14*dt;
        if(p.vr) p.r+=p.vr*dt;
        if(p.k==='glow'){ if(p.x<0||p.x>W) p.vx*=-1; if(p.y<0||p.y>H) p.vy*=-1; p.vx+=R(-6,6)*dt; p.vy+=R(-6,6)*dt; }
        else if(p.k==='star'){ if(p.y<-5){ p.y=H+5; p.x=R(0,W); } }
        else if(p.x<-260||p.x>W+260||p.y<-70||p.y>H+70){ P[i]=make(false)||p; continue; }
        draw(a,p,t);
      }
    }
    if(B.length){
      b.clearRect(0,0,W,H);
      for(const p of B){ p.vy+=(p.g!=null?p.g:520)*dt; p.vx*=(1-.6*dt); p.x+=p.vx*dt; p.y+=p.vy*dt; p.r+=p.vr*dt; p.life-=dt; p.al=Math.max(0,Math.min(1,p.life/.8)); draw(b,p,t); }
      B=B.filter(p=>p.life>0 && p.y<H+40);
      if(!B.length) b.clearRect(0,0,W,H);
    }
    if(!document.hidden && (ambOn || B.length)) raf=requestAnimationFrame(frame);
  }
  function kick(){ if(!raf && !document.hidden) { lastT=0; raf=requestAnimationFrame(frame); } }
  size();
  window.addEventListener('resize', ()=>{ size(); kick(); });
  document.addEventListener('visibilitychange', kick);
  return {
    setMode(m, colors){ mode=m; cols=colors&&colors.length?colors:cols; P=[]; for(let i=0;i<(COUNT[m]||0);i++){ const p=make(true); if(p) P.push(p); } kick(); },
    refresh(){ kick(); },
    sparkBurst(x,y,color){
      if(fxSubtle()) return;
      for(let i=0;i<30;i++){ const a=R(0,6.283), sp=R(90,320); B.push({k:'ember', x:x+R(-30,30), y:y+R(-40,40), vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-140, g:180, s:R(1.4,3.2), c:color, al:1, life:R(.7,1.3), r:0, vr:0}); }
      kick();
    },
    leafBurst(){
      if(fxSubtle()) return;
      const cs=getComputedStyle(document.documentElement);
      const palette=['--primary','--leaf','--chakra-2','--chakra'].map(v=>cs.getPropertyValue(v).trim()).filter(Boolean);
      for(let i=0;i<54;i++) B.push({k:'leaf', x:W/2+R(-40,40), y:H*.62+R(-20,20), vx:R(-300,300), vy:R(-640,-280), r:R(0,6.3), vr:R(-9,9), s:R(6,12), c:pick(palette), al:1, life:R(1.6,2.6)});
      kick();
    },
    flash(){ if(fxSubtle()) return; const el=document.getElementById('flash'); el.classList.remove('go'); void el.offsetWidth; el.classList.add('go'); setTimeout(()=>el.classList.remove('go'),1100); },
    shake(){ if(fxSubtle()) return; const v=document.getElementById('view'); v.classList.remove('shake'); void v.offsetWidth; v.classList.add('shake'); setTimeout(()=>v.classList.remove('shake'),560); },
    stamp(text){ const el=document.getElementById('stamp'); el.textContent=text; el.hidden=false; el.classList.remove('go'); void el.offsetWidth; el.classList.add('go'); setTimeout(()=>FX.shake(),250); clearTimeout(el._t); el._t=setTimeout(()=>{ el.hidden=true; el.classList.remove('go'); },1750); }
  };
})();

  {id:'scroll',   label:'Opening the scroll', synth:'paper', name:'Paper slide', len:2}
];
const slotDef = id => SOUND_SLOTS.find(x=>x.id===id);
const SFX = (()=>{
  let ctx=null, out=null, nb=null, voice=null;
  const customs={};
  const isOn = () => prefs.sfxOn!==false;
  const lenOf = slot => { const v=(prefs.soundLen||{})[slot]; return (v!=null && !isNaN(+v)) ? +v : (slotDef(slot)||{len:4}).len; };
  function ac(){
    try{
      if(!ctx){ const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; ctx=new C(); out=ctx.createGain(); out.gain.value=.55*prefs.fxVol; const comp=ctx.createDynamicsCompressor(); out.connect(comp); comp.connect(ctx.destination); }
      if(ctx.state==='suspended') ctx.resume();
      return ctx;
    }catch(e){ return null; }
  }

/* ---------- permanent file storage (artifact assets, pointers in the media doc) ---------- */
let assetsP=null;
function getAssets(){ if(!assetsP) assetsP=(async()=>{ try{ return (window.claude && typeof window.claude.use==='function') ? await window.claude.use('assets') : null; }catch(e){ return null; } })(); return assetsP; }
async function uploadAsset(blob, type){
  const a=await getAssets(); if(!a) throw {code:'unavailable'};
  let last;
  for(let i=0;i<2;i++){ try{ return await a.upload(blob, type?{type}:undefined); }catch(e){ last=e; if(!(e && e.code==='store_unavailable') || i) break; await sleep(900); } }
  throw last;
}
function deleteAsset(id){ if(!id) return; getAssets().then(a=>{ if(a) return a.delete(id); }).catch(()=>{}); }
function uploadErrorText(e){
  const c=e && e.code;
  if(c==='too_large') return 'That file is over 20 MB. Pick a shorter or smaller one.';
  if(c==='unsupported_type') return "That file type can't be stored. Use M4A, MP4 or WebM audio, or a JPEG or PNG photo.";
  if(c==='quota_or_state') return 'This phone\'s storage for the app is full. Remove a track or photo first.';
  if(c==='unavailable' || c==='not_granted' || c==='capability_disabled' || c==='capability_removed') return 'This phone couldn\'t save that file. Free up some storage and try again.';
  if(c==='rate_limited') return 'Too many uploads at once. Wait a moment and try again.';

}
/* Storage accepts MP4 but refuses files labelled "M4A". The audio is identical; only the

function normalizeMp4(buf){
  const u=new Uint8Array(buf); if(u.length<16) return buf;
  const size=((u[0]<<24)|(u[1]<<16)|(u[2]<<8)|u[3])>>>0;
  if(String.fromCharCode(u[4],u[5],u[6],u[7])!=='ftyp' || size<16 || size>u.length) return buf;
  const out=u.slice(0);
  const fix=(o,to)=>{ const b=String.fromCharCode(out[o],out[o+1],out[o+2],out[o+3]); if(/^M4[ABPV] $/.test(b)) for(let i=0;i<4;i++) out[o+i]=to.charCodeAt(i); };
  fix(8,'isom'); for(let o=16;o+4<=size;o+=4) fix(o,'mp41');
  return out.buffer;
}
const isMp4Buf = buf => { try{ const b=new Uint8Array(buf, 4, 4); return String.fromCharCode(b[0],b[1],b[2],b[3])==='ftyp'; }catch(e){ return false; } };
async function audioUploadType(file){
  const n=(file.name||'').toLowerCase(), t=(file.type||'').toLowerCase();
  if(/\.(webm|weba)$/.test(n) || t==='audio/webm' || t==='video/webm') return 'video/webm';
  const head=await file.slice(0,12).arrayBuffer();
  if(isMp4Buf(head)) return 'video/mp4';
  return null;
}
const baseName = f => (f.name||'File').replace(/\.[^.]+$/,'');
function saveMedia(fn){ const m=clone(media()); fn(m); save('media', null, m); }
let syncedMediaKey=null;
function syncMedia(){
  const m=media(), key=JSON.stringify(m); if(key===syncedMediaKey) return; syncedMediaKey=key;
  SOUND_SLOTS.forEach(d=>SFX.setSource(d.id, (m.sounds[d.id]||{}).id || null));

/* one-time move of files that older versions kept only on this device */
const localFiles = (()=>{
  let dbp=null;
  function open(){ if(dbp) return dbp; dbp=new Promise((res,rej)=>{ try{ const r=indexedDB.open('leaf-village-device',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }catch(e){ rej(e); } }); return dbp; }
  const run=(mode,fn)=>open().then(d=>new Promise((res,rej)=>{ const tx=d.transaction('kv',mode); const rq=fn(tx.objectStore('kv')); rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error); }));

function dataUrlToBlob(u){ const [h,b64]=u.split(','); const bin=atob(b64); const a=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i); return new Blob([a],{type:(h.match(/data:([^;]+)/)||[])[1]||'image/jpeg'}); }
let migrationDone=false;
async function migrateDeviceFiles(){
  if(migrationDone || state.mode!=='db' || state.readOnly) return; migrationDone=true;
  if(!(await getAssets())) return;
  const m=media(), add={bg:{}, sounds:{}, music:[]};
  for(const d of [BG_ALL].concat(BG_SLOTS)){ if(m.bg[d.id]) continue; try{ const r=await localFiles.get('bg-'+d.id); if(r && r.url){ const res=await uploadAsset(dataUrlToBlob(r.url),'image/jpeg'); add.bg[d.id]={id:res.id, name:r.name||d.label}; await localFiles.del('bg-'+d.id); } }catch(e){} }
  for(const d of SOUND_SLOTS){ if(m.sounds[d.id]) continue; const k=d.id==='set'?'set-sound':'sound-'+d.id; try{ const r=await localFiles.get(k); if(r && r.data && isMp4Buf(r.data)){ const res=await uploadAsset(new Blob([normalizeMp4(r.data)],{type:'video/mp4'}),'video/mp4'); add.sounds[d.id]={id:res.id, name:r.name||'Your sound'}; await localFiles.del(k); } }catch(e){} }
  try{ const l=await localFiles.get('music-list'); if(Array.isArray(l)){ for(const t of l){ try{ const r=await localFiles.get('music-'+t.id); if(r && r.data && isMp4Buf(r.data)){ const res=await uploadAsset(new Blob([normalizeMp4(r.data)],{type:'video/mp4'}),'video/mp4'); add.music.push({id:res.id, name:t.name||'Track'}); await localFiles.del('music-'+t.id); } }catch(e){} } } }catch(e){}

/* ---------- background music ---------- */
const MUSIC_BUILTIN = {id:'builtin', name:'Training Grounds', builtin:true};
const Music = (()=>{
  let gain=null, duck=null, el=null, connected=false, playing=false, active=false, idx=0, bt=null, loaded=false, autoDone=false, errShown=false;

  const changed=()=>render();

  function current(){ const l=list(); return l.length ? l[Math.min(idx,l.length-1)] : null; }
  function chain(){ const c=SFX.audio(); if(!c) return null; if(!gain){ gain=c.createGain(); gain.gain.value=prefs.musicVol; duck=c.createGain(); gain.connect(duck); duck.connect(c.destination); } return c; }

    const nodes=[];

function canvasBlob(img,max,q){
  return new Promise((res,rej)=>{
    const sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)); const w=Math.max(1,Math.round(img.naturalWidth*sc)), h=Math.max(1,Math.round(img.naturalHeight*sc));

  });
}

}

/* when a streak broke, and when a broken streak was rebuilt to 7 */
function streakStory(C){
  const out={broke:null, comeback:null, ever:false};
  const scan=(list, kind, isBreak)=>{
    let pending=null;
    list.forEach((rec,i)=>{
      if(isBreak(rec,i)){ pending=rec.date; if(!out.broke || rec.date>=out.broke.date) out.broke={date:rec.date, kind}; }
      if(pending && rec.streak>=7){ out.ever=true; if(!out.comeback || rec.date>=out.comeback.date) out.comeback={date:rec.date, kind, since:pending}; pending=null; }
    });
  };
  scan(C.days, 'workout', (rec,i)=>rec.status==='missed' && i>0 && (C.days[i-1].streak||0)>0);
  let st=0; const sl=C.study.list.map(r=>{ if(r.status==='done') st++; else if(r.status==='missed') st=0; return {date:r.date, status:r.status, broke:r.broke, streak:st}; });
  scan(sl, 'study', rec=>rec.broke);
  return out;
}

function logSet(ex, key){

  const d=C.today, day=clone(getDay(d)) || {date:d, sets:[]};
  day.date=d; day.sets=(day.sets||[]).concat([{ex, reps, t:new Date().toISOString()}]);
  const prevPR=C.prs.length, prevStatus=C.todayRec.status, prevXp=C.todayRec.xp, prevAwards=(C.awards||[]).length, prevCombo=C.todayRec.info.combo||0;
  save('days', d, day);
  const A=lastC; if(!A||!A.todayRec) return;
  const gained=A.todayRec.xp-prevXp;
  const pr=A.prs.length>prevPR, done=A.todayRec.status==='done' && prevStatus!=='done';

  if(done){
    const wait = pr ? Math.max(1.2, SFX.hasCustom('max') ? .22+(SFX.clipLen('max')||2.5) : 0) : (customDone ? 0 : .1);

}

    shrinkPhoto(file, 1000).then(blob=>uploadAsset(blob,'image/jpeg')).then(res=>{
      const old=media().senseis[id];
      saveMedia(m=>{ m.senseis=Object.assign({}, m.senseis, {[id]:{id:res.id, name:baseName(file)}}); });
      if(old && old.id!==res.id) deleteAsset(old.id);
      toast(`${sd.name}'s picture saved`);
    }).catch(e=>toast(e && e.code ? uploadErrorText(e) : "That picture couldn't be opened. Try a JPEG or PNG."))
    .finally(()=>{ delete ui.uploading['sen-'+id]; render(); });
    return;
  }
  if(el.dataset.act==='bg-file'){
    const sl=el.dataset.slot, d=(sl==='all'?BG_ALL:BG_SLOTS.find(x=>x.id===sl)); const file=el.files && el.files[0]; el.value=''; if(!file || !d) return;
    if(state.mode!=='db'){ toast('This phone couldn\'t open its storage. Close the app fully and open it again.'); return; }
    if(file.size>60*1024*1024){ toast('That photo is too large. Pick a smaller one.'); return; }
    ui.uploading['bg-'+sl]=true; render(); toast('Saving photo…');
    shrinkPhoto(file).then(blob=>uploadAsset(blob,'image/jpeg')).then(res=>{
      const old=media().bg[sl];
      saveMedia(m=>{ m.bg[sl]={id:res.id, name:baseName(file)}; });
      if(old && old.id!==res.id) deleteAsset(old.id);
      toast(`${d.label} background saved`);
    }).catch(e=>toast(e && e.code ? uploadErrorText(e) : "That photo couldn't be opened. Try a JPEG or PNG."))
    .finally(()=>{ delete ui.uploading['bg-'+sl]; render(); });
    return;
  }
  if(el.dataset.act==='music-files'){
    const fl=el.files; if(!fl || !fl.length) return;
    const arr=Array.from(fl); el.value='';
    Music.add(arr).then(n=>{ if(n) toast(n===1?'Track added':`${n} tracks added`); }).catch(()=>toast("Those files couldn't be added."));
    return;
  }
  if(el.dataset.act==='snd-file'){
    const sl=el.dataset.slot, def=slotDef(sl); if(!def) return;
    const file=el.files && el.files[0]; el.value=''; if(!file) return;
    if(state.mode!=='db'){ toast('This phone couldn\'t open its storage. Close the app fully and open it again.'); return; }
    if(file.size>20*1024*1024){ toast('That file is over 20 MB. Pick a shorter clip.'); return; }
    (async()=>{
      const type=await audioUploadType(file);
      if(!type){ toast("That file type can't be saved. Use an M4A or MP4 file."); return; }
      const buf=await file.arrayBuffer();
      if(!(await SFX.canDecode(buf))){ toast("That file couldn't be played. Try another M4A file."); return; }
      ui.uploading['snd-'+sl]=true; render(); toast('Saving sound…');
      try{
        const res=await uploadAsset(new Blob([type==='video/mp4'?normalizeMp4(buf):buf],{type}), type);
        const old=media().sounds[sl];
        SFX.setBuffer(sl, res.id, buf);
        saveMedia(m=>{ m.sounds[sl]={id:res.id, name:baseName(file)}; });
        if(old && old.id!==res.id) deleteAsset(old.id);
        toast(`${def.label}: sound saved`); SFX.play(sl);
      }catch(e){ toast(uploadErrorText(e)); }
      finally{ delete ui.uploading['snd-'+sl]; render(); }
    })().catch(()=>toast("That file couldn't be read."));
    return;
  }
  if(el.dataset.act==='plan-day'){
    const k=Number(el.dataset.k), v=el.value;
    ui.draft.plan[k] = v.startsWith('gtg:') ? {type:'gtg', ex:v.slice(4)} : v.startsWith('combo:') ? {type:'combo', exs:v.slice(6).split(',')} : {type:v};
    render();
  } else if(el.dataset.act==='test-ex'){
    const id=el.dataset.ex, list=ui.draft.test.ex;
    ui.draft.test.ex = el.checked ? Array.from(new Set(list.concat([id]))) : list.filter(x=>x!==id);
    render();
  }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && ui.viewRank!=null){ ui.viewRank=null; if(lastC) renderOverlay(lastC); } });
document.addEventListener('input', e=>{
  const el=e.target; if(!el || !el.dataset) return;
  if(el.id==='exam-start'){ ui.examStart=el.value||todayStr(); render(); return; }
  if(el.dataset.bind){ setPath(el.dataset.bind, el.value); return; }
  if(el.dataset.act==='vol'){ const v=clamp(Number(el.value)/100,0,1); if(el.dataset.k==='musicVol') Music.setVolume(v); else if(el.dataset.k==='bgStrength'){ prefs.bgStrength=v; applyBg(); } else { SFX.setVolume(v); } savePrefs(); }
});

function readHash(){ const h=(location.hash||'').replace('#',''); ui.tab=['mission','stats','plan','ninja','settings'].includes(h)?h:'mission'; }
window.addEventListener('hashchange', ()=>{ readHash(); window.scrollTo(0,0); render(); });
let lastDay=todayStr();
function checkDay(){ const t=todayStr(); if(t!==lastDay){ lastDay=t; ui.reps={}; ui.weigh=null; render(); } }
setInterval(checkDay, 60000);
/* ---------- study timer + combo actions ---------- */
function confirmTap(key){
  if(ui.confirm!==key){ ui.confirm=key; clearTimeout(ui.confirmTimer); ui.confirmTimer=setTimeout(()=>{ ui.confirm=null; render(); },4000); render(); return false; }
  ui.confirm=null; clearTimeout(ui.confirmTimer); return true;
}
function addStudyEntry(date, entry){
  const doc=clone(getStudy(date)) || {date, entries:[]};
  doc.date=date; doc.entries=(doc.entries||[]).concat([entry]); save('study', date, doc);
}
function commitSpan(a, b){
  let total=0;
  splitByDay(a, b).forEach(p=>{ const min=Math.round((p.end-p.start)/60000); if(min>=1){ total+=min; addStudyEntry(p.date, {start:new Date(p.start).toISOString(), end:new Date(p.end).toISOString(), min, src:'timer'}); } });
  return total;
}
function studyFeedback(before, label){
  const A=lastC; if(!A) return;
  const b=(before||{}), a=A.study.days[A.today]||{};
  const gained=(a.xp||0)-(b.xp||0);
  const hitMin = a.status==='done' && b.status!=='done';
  const hitFull = a.tgt && a.mins>=a.tgt.full && !(b.mins>=a.tgt.full);
  if(gained>0) stagePowerUp(gained);
  if(hitMin || hitFull){ SFX.play('complete'); FX.leafBurst(); toast(`${hitFull?'Study scroll full':'Study minimum reached'} · ${signed(gained)} XP`); }
  else { SFX.play('scroll'); toast(`${label} · ${signed(gained)} XP`); }
}
function studyAction(act, el){
  if(state.readOnly) return;
  const C=lastC; if(!C || !C.study.start) return;
  const T=timerDoc(), now=Date.now(), before=clone(C.study.days[C.today]||{}), prevAwards=(C.awards||[]).length;
  const cap=STUDY.capMs;
  if(act==='st-start'){ if(T.state==='running') return; save('timer', null, {state:'running', segStart:now, checkAt:now+cap, sessionMs:0}); SFX.play('tick'); toast('Study timer started'); return; }
  if(act==='st-resume'){ if(T.state!=='paused') return; save('timer', null, {state:'running', segStart:now, checkAt:now+cap, sessionMs:T.sessionMs||0}); SFX.play('tick'); toast('Timer resumed'); return; }
  if(act==='st-yes'){ if(T.state!=='running') return; save('timer', null, Object.assign({}, T, {checkAt:now+cap})); toast('Keep going. The next check is in 3 hours.'); return; }
  if(act==='st-pause' || act==='st-finish' || act==='st-stopcheck'){
    let seg=0;
    if(T.state==='running'){ const end = act==='st-stopcheck' ? T.checkAt : Math.min(now, T.checkAt||now); seg=Math.max(0,end-T.segStart);
      save('timer', null, act==='st-pause' ? {state:'paused', sessionMs:(T.sessionMs||0)+seg} : {state:'idle'});
      commitSpan(T.segStart, T.segStart+seg);
    } else if(act==='st-finish'){ save('timer', null, {state:'idle'}); }
    const session=(T.sessionMs||0)+seg;
    studyFeedback(before, act==='st-pause' ? `Paused · ${fmtH(seg/60000)} logged` : `Session done · ${fmtH(session/60000)} studied`);
    announceAwards(lastC, prevAwards); return;
  }
  if(act==='st-add'){
    const min=Number(el.dataset.min)||30;
    addStudyEntry(C.today, {start:new Date(now-min*60000).toISOString(), end:new Date(now).toISOString(), min, src:'manual'});
    studyFeedback(before, `${fmtH(min)} logged`); announceAwards(lastC, prevAwards); return;
  }
  if(act==='st-undo'){
    if(!confirmTap('sundo')) return;
    const doc=clone(getStudy(C.today)); if(!doc || !(doc.entries||[]).length) return;
    const gone=doc.entries.pop(); save('study', C.today, doc); SFX.play('undo'); toast(`${fmtH(gone.min)} removed`); return;
  }
  if(act==='st-offday'){
    if(parse(C.today).getDay()!==4) return;
    const doc=clone(getStudy(C.today)) || {date:C.today, entries:[]}; doc.offday=true; doc.date=C.today; save('study', C.today, doc);
    toast('Off-day study open. 8 hours fills the scroll.'); return;
  }
  if(act==='st-shield'){
    if(!canShield(C)) return;
    if(!confirmTap('shield')) return;
    const doc=clone(getStudy(C.today)) || {date:C.today, entries:[]}; doc.shield=true; doc.date=C.today; save('study', C.today, doc);
    SFX.play('complete'); toast('Study streak protected for today'); return;
  }
}
function examAction(act){
  if(state.readOnly) return;
  const s=clone(S()), today=todayStr(), list=(s.examWeeks||[]).slice();
  if(act==='exam-start'){
    const start=/^\d{4}-\d{2}-\d{2}$/.test(ui.examStart||'') ? ui.examStart : today;
    if(start<today){ toast("An exam week can't start in the past."); return; }
    if(list.some(e=>e.start.slice(0,7)===start.slice(0,7))){ toast("You've already used the pass for that month."); return; }
    const end=addDays(start,6);
    if(list.some(e=>!(end<e.start || start>e.end))){ toast('That overlaps another exam week.'); return; }
    if(!confirmTap('exam-start')) return;
    list.push({start, end, created:new Date().toISOString()}); s.examWeeks=list; save('settings', null, s);
    SFX.play('promo'); toast(start===today?'Exam week started. Streaks are frozen for 7 days.':`Exam week scheduled from ${shortDate(start)}`); return;
  }
  if(act==='exam-end'){
    const i=list.findIndex(e=>e.start<=today && today<=e.end); if(i<0) return;
    if(!confirmTap('exam-end')) return;
    list[i]=Object.assign({}, list[i], {end:today}); s.examWeeks=list; save('settings', null, s); toast('Exam week ends tonight. Normal missions return tomorrow.'); return;
  }
  if(act==='exam-cancel'){
    const i=list.findIndex(e=>e.start>today); if(i<0) return;
    if(!confirmTap('exam-cancel')) return;
    list.splice(i,1); s.examWeeks=list; save('settings', null, s); toast('Scheduled exam week cancelled'); return;
  }
}
let tickBucket=null, readyShown=0;
setInterval(()=>{
  const C=lastC; if(!C || !C.study) return;
  const T=timerDoc(), now=Date.now();
  if(C.readyUntil && now>C.readyUntil && readyShown!==C.readyUntil){ readyShown=C.readyUntil; render(); return; }
  if(T.state!=='running') return;
  if(T.checkAt && now>=T.checkAt && tickBucket!=='check'){ tickBucket='check'; render(); return; }
  document.querySelectorAll('[data-timer]').forEach(n=>{ n.textContent=timerText(); });
  const rec=C.study.days[C.today]; if(!rec) return;
  const live=provisionalPieces().filter(p=>p.date===C.today).reduce((m,p)=>m+p.min,0), mins=rec.committed+live;
  document.querySelectorAll('.mscroll.study [data-col]').forEach(n=>{ const i=+n.dataset.col; n.style.setProperty('--f', clamp((mins-i*60)/60,0,1).toFixed(3)); });
  const bucket=Math.floor(mins/30);
  if(tickBucket===null) tickBucket=bucket;
  if(bucket!==tickBucket){ tickBucket=bucket; const before=clone(rec); render(); if(lastC){ const a=lastC.study.days[lastC.today]||{}; if(a.status==='done' && before.status!=='done'){ SFX.play('complete'); FX.leafBurst(); toast('Study minimum reached'); } } }
}, 1000);

document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) checkDay(); });

document.addEventListener('pointerdown', ()=>SFX.unlock(), {capture:true, passive:true});
const firstTouch = ()=>{ SFX.unlock(); Music.autoStart(); };
document.addEventListener('touchend', firstTouch, {capture:true, passive:true});
document.addEventListener('click', firstTouch, {capture:true, passive:true});

try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{ if(appliedTheme!=null){ applyTheme(appliedTheme,true); lastHtml=''; render(); } }); }catch(e){}
try{ new MutationObserver(()=>{ if(appliedTheme!=null){ applyTheme(appliedTheme,true); lastHtml=''; render(); } }).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']}); }catch(e){}

readHash();
initStore();
try{ if(sessionStorage.getItem('leaf-imported')){ sessionStorage.removeItem('leaf-imported'); setTimeout(()=>toast('Backup imported. Welcome back to the village.'), 1200); } }catch(e){}
})();
</script>
