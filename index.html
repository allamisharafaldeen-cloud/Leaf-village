.player{position:fixed; left:0; right:0; bottom:calc(70px + env(safe-area-inset-bottom,0px)); z-index:19; padding:0 max(12px, env(safe-area-inset-right,0px)) 6px max(12px, env(safe-area-inset-left,0px)); pointer-events:none}
.player-inner{pointer-events:auto; max-width:560px; margin:0 auto; display:flex; align-items:center; gap:10px; padding:7px 8px 7px 10px; border-radius:14px; background:var(--card); border:2px solid var(--panel); box-shadow:3px 3px 0 var(--panel)}
.mp-btn{flex:none; width:38px; height:38px; border-radius:50%; border:2px solid var(--panel); background:var(--chakra); color:var(--on-chakra); display:grid; place-items:center}
.mp-btn.plain{background:transparent; color:var(--ink); border-color:transparent; width:34px}
.mp-title{flex:1; min-width:0}
.mp-title b{display:block; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.mp-title span{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--muted)}
.eq{display:inline-flex; gap:2px; align-items:flex-end; height:11px}
.eq i{width:3px; height:100%; border-radius:1px; background:var(--chakra); transform-origin:bottom; animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.3s} .eq i:nth-child(3){animation-delay:-.6s}
.eq.paused i{animation:none; transform:scaleY(.3)}
@keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
body.has-player .wrap{padding-bottom:178px}

/* tabs */
.tabs{position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--card); border-top:2px solid var(--panel);
  padding:6px max(16px, env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px))}
.tabs-inner{max-width:560px; margin:0 auto; display:grid; grid-template-columns:repeat(5,1fr)}
.tabs a{display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 0; text-decoration:none; color:var(--muted); font-size:11.5px; font-weight:700; letter-spacing:.04em; border-radius:10px}
.tabs a svg{width:24px; height:24px}
.tabs a[aria-current="page"]{color:var(--chakra-ink)}
.tabs[hidden]{display:none!important}

/* overlay */
.overlay{position:fixed; inset:0; z-index:40; background:var(--scrim); display:grid; place-items:center;
  padding:calc(20px + env(safe-area-inset-top,0px)) max(20px, env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px, env(safe-area-inset-left,0px))}
.promo{position:relative; width:min(420px,100%); max-height:100%; overflow-y:auto; background:var(--card); border-radius:22px; text-align:center; display:flex; flex-direction:column; overflow-x:hidden; animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.promo-scene{display:block; width:100%; aspect-ratio:16/9; object-fit:cover; border-bottom:3px solid var(--rk)}
.promo-scene.locked{filter:grayscale(1) brightness(.75)}
/* rank-up cinematic: a dark gate (the tap lets the scene play with sound), then the scene full screen */
.cine-gate,.cine{position:fixed; inset:0; z-index:2; background:#050507; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; padding:24px}
.cine-gate .eyebrow{color:var(--rk); letter-spacing:.3em}
.cine-gate h2{margin:0; color:#f2efe9; font-size:clamp(28px,5vw,44px); letter-spacing:.02em; animation:cineIn 1.2s ease both}
.cine-gate p{margin:0; color:#9b958c; font-size:14px}
.cine-gate .btn{margin-top:10px; min-width:220px; background:var(--rk); border-color:var(--rk); color:#0b0d0c; box-shadow:0 0 0 1px var(--rk), 0 0 34px color-mix(in srgb, var(--rk) 55%, transparent); animation:cinePulse 2.2s ease-in-out infinite}
.cine{padding:0}
.cine video{width:100%; height:100%; object-fit:contain; background:#000}
.cine-skip{position:absolute; right:max(16px, env(safe-area-inset-right,0px)); bottom:calc(16px + env(safe-area-inset-bottom,0px)); background:rgba(0,0,0,.45); color:#f2efe9; border:1px solid rgba(255,255,255,.35); border-radius:999px; padding:8px 16px; font:600 14px var(--f-data); letter-spacing:.06em}
.cine-skip[hidden]{display:none}
@keyframes cineIn{from{opacity:0; transform:translateY(8px); letter-spacing:.2em} to{opacity:1; transform:none}}
@keyframes cinePulse{50%{box-shadow:0 0 0 1px var(--rk), 0 0 54px color-mix(in srgb, var(--rk) 80%, transparent)}}
.promo-body{display:flex; flex-direction:column; align-items:center; gap:10px; padding:18px 22px 22px}
.viewer::before{display:none}
.promo::before{content:""; position:absolute; inset:-40%; background:repeating-conic-gradient(from 0deg, var(--chakra-soft) 0 10deg, transparent 10deg 20deg); animation:spin 18s linear infinite; z-index:0}
.promo > *{position:relative; z-index:1}
.promo .eyebrow{color:var(--chakra-ink)}
.promo h2{font-size:30px}
@keyframes pop{from{transform:scale(.7); opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); z-index:30; background:var(--ink); color:var(--paper); padding:10px 16px; border-radius:12px; font-size:14px; font-weight:500; max-width:calc(100% - 32px); box-shadow:0 8px 24px rgba(0,0,0,.25)}
body.has-player .toast{bottom:calc(142px + env(safe-area-inset-bottom,0px))}
.loading{padding:60px 0; text-align:center; color:var(--muted)}
.loading b{display:block; font-family:var(--f-display); font-size:22px; color:var(--ink); font-weight:400; margin-bottom:6px}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important; transition:none!important}
}
@media (max-width:380px){
  .mission-title{font-size:23px}
  .stepper .val b{font-size:38px}
  .scrolls{grid-template-columns:1fr}
}
.alarm-list{list-style:none; margin:4px 0 0; padding:0; display:grid; gap:8px}
.alarm-list li{display:flex; gap:12px; align-items:baseline; font-size:14px}
.alarm-list b{font-family:var(--f-data); min-width:74px}
.alarm-list span{color:var(--muted)}
.import-panel{display:grid; gap:10px; margin-top:12px; padding:12px; border:1px solid var(--line); border-radius:12px; background:var(--paper-glass)}
.import-panel p{margin:0; font-size:14px}
/* mini ninja bar: shows the character and XP when the big stage is scrolled away */
.minibar{position:fixed; left:50%; top:calc(8px + env(safe-area-inset-top,0px)); z-index:25; width:min(720px,calc(100% - 24px)); display:flex; align-items:center; gap:12px; padding:7px 14px 7px 7px; border-radius:18px; background:var(--card-glass); -webkit-backdrop-filter:blur(12px) saturate(1.2); backdrop-filter:blur(12px) saturate(1.2); border:2px solid var(--panel); box-shadow:3px 3px 0 var(--panel); transform:translate(-50%,-140%); opacity:0; transition:transform .35s cubic-bezier(.2,1.2,.4,1),opacity .25s; pointer-events:none}
.minibar.show{transform:translate(-50%,0); opacity:1; pointer-events:auto}
.mb-face{position:relative; flex:none; width:52px; height:52px; border-radius:14px; overflow:hidden; background:var(--ink)}
.mb-face img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.mb-face::after{content:""; position:absolute; inset:0; border-radius:14px; box-shadow:inset 0 0 0 2px var(--aura,#ffd27a); opacity:.7}
.mb-mid{flex:1; min-width:0; display:grid; gap:5px}
.mb-top{display:flex; justify-content:space-between; gap:8px; font-size:13px; white-space:nowrap}
.mb-top b{font-family:var(--f-display); font-size:15px; overflow:hidden; text-overflow:ellipsis}
.mb-top span{font-family:var(--f-data); color:var(--muted)}
.mb-track{height:9px; border-radius:99px; background:var(--paper); border:1.5px solid var(--panel); overflow:hidden}
.mb-fill{height:100%; background:linear-gradient(90deg,var(--primary),var(--chakra)); transition:width .8s cubic-bezier(.2,1,.3,1)}
.mb-streaks{flex:none; display:flex; gap:6px; font-family:var(--f-data); font-weight:700; font-size:14px}
.mb-streaks span{display:inline-flex; align-items:center; gap:3px; padding:3px 8px; border-radius:99px; background:var(--paper-glass)}
.mb-streaks svg{width:14px; height:14px}
.minibar.pulse{animation:mbpulse .9s ease-out}
@keyframes mbpulse{0%{box-shadow:3px 3px 0 var(--panel),0 0 0 0 var(--aura,#ffd27a)}30%{box-shadow:3px 3px 0 var(--panel),0 0 26px 6px var(--aura,#ffd27a)}100%{box-shadow:3px 3px 0 var(--panel),0 0 0 0 transparent}}
.minibar.pulse .mb-face img{animation:flexface .7s cubic-bezier(.2,1.5,.4,1)}
@keyframes flexface{0%{transform:scale(1); filter:none}35%{transform:scale(1.15); filter:brightness(1.4)}100%{transform:scale(1)}}
.tap-xp{position:fixed; z-index:45; transform:translate(-50%,-50%); font-family:var(--f-display); font-size:22px; line-height:1; color:var(--chakra-ink); text-shadow:0 0 12px var(--glow),0 1px 0 var(--card); pointer-events:none; white-space:nowrap; animation:tapxp 1.15s ease-out forwards}
@keyframes tapxp{0%{opacity:0; transform:translate(-50%,-30%) scale(.7)}18%{opacity:1; transform:translate(-50%,-80%) scale(1.12)}100%{opacity:0; transform:translate(-50%,-260%) scale(1)}}
.mb-xp{position:absolute; left:70px; top:-6px; font-family:var(--f-display); font-size:20px; color:var(--chakra-ink); text-shadow:0 0 10px var(--glow); pointer-events:none; animation:tapxp 1.15s ease-out forwards}
/* sensei suggestion cards (auto-progression, exam countdown, shadow clone) */
.say{display:flex; flex-direction:column; gap:10px; border-left:5px solid var(--sc)}
.say-head{display:flex; align-items:center; gap:12px; min-width:0}
.say-head b{display:block; font-size:16px}
.say-head span{display:block; font-size:12.5px; color:var(--muted)}
.say p{margin:0; font-size:14.5px; line-height:1.45}
.say .rules{font-size:14px}
.was{color:var(--muted); font-weight:400}
.count{display:grid; grid-template-columns:auto 1fr; gap:4px 14px; align-items:center}
.count .big{grid-row:span 2; font-family:var(--f-data); font-weight:700; font-size:34px; line-height:1; color:var(--exam); text-align:center; min-width:74px}
.count .big small{display:block; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-top:3px}

.count span{font-size:13px; color:var(--muted); align-self:start}
/* jutsu scrolls */
.jutsu{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px}
.jutsu li{display:flex; flex-direction:column; gap:8px; padding:10px 12px; border-radius:12px; background:var(--paper)}
body.has-bg .jutsu li{background:var(--paper-glass)}
.jutsu li.locked{opacity:.55}
.jutsu-top{display:flex; justify-content:space-between; align-items:baseline; gap:10px}
.jutsu-top b{font-size:14.5px}
.jutsu-top span{font-family:var(--f-data); font-weight:700; font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; white-space:nowrap; color:var(--muted)}
.jutsu li.learned .jutsu-top span{color:var(--leaf)}
.jutsu li.open .jutsu-top span{color:var(--chakra-ink)}

/* achievements wall + the moment one is earned */
.ach-cat{display:flex; flex-direction:column; gap:8px}
.ach-date{color:var(--leaf)!important; font-family:var(--f-data); font-weight:700; margin-top:2px}
.sc.secret{border:1.5px dashed var(--line); background:transparent}
.ach-latest{display:flex; flex-wrap:wrap; gap:6px; list-style:none; margin:0; padding:0}
.ach-latest li{font-size:12.5px; padding:4px 10px; border-radius:999px; background:var(--chakra-soft); font-weight:700}
.achpop{position:fixed; left:50%; top:calc(78px + env(safe-area-inset-top,0px)); z-index:44; width:min(380px,calc(100% - 28px)); transform:translate(-50%,-30px); opacity:0; pointer-events:none; display:flex; gap:12px; align-items:center; padding:11px 14px; border-radius:14px; background:var(--card); border:2px solid var(--chakra); box-shadow:0 10px 34px rgba(0,0,0,.28),0 0 22px var(--glow)}
.achpop svg{flex:none; width:40px; height:40px}
.achpop b{display:block; font-family:var(--f-display); font-weight:400; font-size:17px; line-height:1.15}
.achpop span{display:block; font-size:12.5px; color:var(--muted)}
.achpop .eyebrow{color:var(--chakra-ink)}
.achpop.go{animation:achpop 3.6s cubic-bezier(.2,1,.3,1) forwards}
@keyframes achpop{0%{opacity:0; transform:translate(-50%,-30px) scale(.94)}8%{opacity:1; transform:translate(-50%,0) scale(1.03)}13%{transform:translate(-50%,0) scale(1)}86%{opacity:1; transform:translate(-50%,0)}100%{opacity:0; transform:translate(-50%,-18px)}}
.race{display:grid; grid-template-columns:auto 1fr; gap:6px 12px; align-items:center; font-size:13px}
.race > span{font-family:var(--f-data); font-weight:700; letter-spacing:.06em; text-transform:uppercase; font-size:11.5px; color:var(--muted)}
.race-bars{display:grid; gap:3px; min-width:0}
.race-bars div{display:flex; align-items:center; gap:8px; min-width:0}
.race-bars i{display:block; height:9px; border-radius:5px; background:var(--primary); min-width:3px; transition:width .5s ease}
.race-bars .them i{background:var(--muted); opacity:.55}
.race-bars b{font-family:var(--f-data); font-size:13px; white-space:nowrap}
.race-bars .them b{font-weight:500; color:var(--muted)}
/* monthly mission report */
.report{position:relative; width:min(640px,100%); max-height:100%; overflow-y:auto; -webkit-overflow-scrolling:touch; background:var(--card); border-radius:18px; border:3px solid var(--rk); display:flex; flex-direction:column; animation:pop .4s cubic-bezier(.2,1.3,.4,1)}
.report.book .report-head{padding-right:112px}
.book-art{width:100%; max-height:260px; object-fit:cover; object-position:50% 20%; border-radius:12px}
.book-row{display:flex; align-items:center; gap:12px; padding:8px 4px; opacity:.6}
.book-seal{width:46px; height:46px; flex:none; display:grid; place-items:center; border-radius:50%; background:#5a1f1a; color:#f3d9a4; font-size:22px; font-weight:800; box-shadow:inset 0 0 0 2px #c79b4a}
.report-head{padding:18px 20px 14px; background:var(--rk); color:#fff}
.report-head .eyebrow{color:rgba(255,255,255,.82)}
.report-head h2{font-size:27px; color:#fff; margin-top:2px}
.report-head p{margin:5px 0 0; font-size:14.5px; font-weight:700}
.report-body{padding:14px 16px 16px; display:flex; flex-direction:column; gap:12px}
.rgrid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px}
.rbox{padding:10px 12px; border-radius:12px; background:var(--paper); display:flex; flex-direction:column; gap:2px; min-width:0}
.rbox.wide{grid-column:1/-1}
.rbox .big{font-family:var(--f-data); font-weight:700; font-size:25px; line-height:1.15}
.rbox span{font-size:12.5px; color:var(--muted)}
.rbox b{font-size:14px}
.rbox ul{margin:2px 0 0; padding:0; list-style:none; display:flex; flex-wrap:wrap; gap:6px}
.rbox li{font-size:12.5px; padding:3px 9px; border-radius:999px; background:var(--chakra-soft); font-weight:700}
.hokage-words{display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border-radius:12px; border:1.5px solid var(--line)}
.hokage-words p{margin:0 0 6px; font-size:14px; line-height:1.45}
.hokage-words p:last-child{margin:0}
.report .month-nav{position:absolute; top:14px; right:14px}
.report .month-nav .chip{background:rgba(255,255,255,.92); color:#1d1a16; border-color:transparent}
/* story scenes: streak broken, comeback */
.scene{position:relative; width:min(560px,100%); border-radius:22px; overflow:hidden; background:#0d0d10; color:#f2efe9; box-shadow:0 30px 80px rgba(0,0,0,.6)}
.scene img{display:block; width:100%; aspect-ratio:16/9; object-fit:cover}
.scene .scene-body{padding:18px 20px 20px; display:grid; gap:10px; text-align:center}
.scene .eyebrow{color:#c9c3b8}
.scene h2{margin:0; font-size:28px; color:#fff}
.scene p{margin:0; font-size:14.5px; line-height:1.5; color:#ddd6cb}
.scene.funeral img{filter:saturate(.7)}
.scene.recap{box-shadow:0 0 0 2px var(--rk),0 30px 80px rgba(0,0,0,.6)}
.scene.recap img{animation:recapin 2.2s ease-out}
@keyframes recapin{0%{transform:scale(1.12); filter:brightness(.5)}100%{transform:scale(1); filter:none}}
.scene .btn.plain{background:transparent; color:#f2efe9; border:1.5px solid rgba(255,255,255,.35)}
.scene.comeback{box-shadow:0 0 0 2px #8fd0ff,0 0 60px rgba(120,190,255,.55),0 30px 80px rgba(0,0,0,.6)}
.scene.comeback img{animation:revive 2.4s ease-out}
@keyframes revive{0%{filter:grayscale(1) brightness(.4) blur(3px); transform:scale(1.08)}60%{filter:grayscale(.3) brightness(1.1)}100%{filter:none; transform:scale(1)}}
/* drawn aura: grows through the rank, flickers harder as today's mission fills, flares on every log */
.aura-box{position:absolute; bottom:0; left:50%; height:94%; aspect-ratio:var(--ar); transform:translateX(-50%); pointer-events:none}
.aura-art{position:absolute; max-width:none;
  --glow:calc((3px + 5px*var(--rankp,0)) * (3.6*var(--power,0)));
  opacity:min(1, calc(1.05*var(--power,0))); filter:saturate(1.6) brightness(calc(1.1 + .7*var(--power,0))) drop-shadow(0 0 var(--glow) var(--aura));
  animation:auraflick calc(4.2s - 2.8s*var(--power,0)) ease-in-out infinite}
/* the aura never moves or resizes, so it stays locked to the body: it only breathes in light */
@keyframes auraflick{0%,100%{filter:saturate(1.6) brightness(calc(1.05 + .6*var(--power,0))) drop-shadow(0 0 var(--glow) var(--aura))}50%{filter:saturate(1.9) brightness(calc(1.3 + .9*var(--power,0))) drop-shadow(0 0 calc(var(--glow) * 1.7) var(--aura)) drop-shadow(0 0 calc(var(--glow) * .6) var(--aura))}}
.stage.has-art .char-glow-wrap{opacity:calc(.95*var(--power,0)*var(--power,0))}
.stage.powerup .aura-art{animation:auraflare 1.2s cubic-bezier(.2,.9,.3,1)}
.stage.powerup .aura-box{animation:flexbox .7s cubic-bezier(.2,1.5,.4,1)}
@keyframes flexbox{0%{transform:translateX(-50%) scale(1)}35%{transform:translateX(-50%) scale(1.07)}100%{transform:translateX(-50%) scale(1)}}
@keyframes auraflare{0%{opacity:1; filter:saturate(2.2) brightness(2.4) drop-shadow(0 0 36px var(--aura))}35%{opacity:1; filter:saturate(1.9) brightness(1.8) drop-shadow(0 0 24px var(--aura))}100%{filter:saturate(1.6) brightness(1.25) drop-shadow(0 0 var(--glow) var(--aura))}}
@media (prefers-reduced-motion: reduce){.aura-art{animation:none}}

/* today's charge, from 0 to 1: every logged set and every study hour is one equal step
   (e.g. 5 sets + 6 study hours = 11 steps of about 9% each); resets to 0 at midnight */
function workoutUnits(t){
  if(t.plan.type==='gtg' || t.plan.type==='combo') return [Math.min(t.info.q, t.info.goal), Math.max(1,t.info.goal)];
  const tot=t.info.per.length*t.info.sets, got=t.info.per.reduce((m,p)=>m+Math.min(p.sets.length,t.info.sets),0);
  return [got, Math.max(1,tot)];
}
function todayPower(C){
  let done=0, need=0; const t=C.todayRec;
  if(t && t.plan.type!=='rest'){ const [d,n]=workoutUnits(t); done+=d; need+=n; }
  const sr=C.study && C.study.days && C.study.days[C.today];
  if(sr && sr.tgt){ const n=(sr.tgt.off ? sr.tgt.full : sr.tgt.min)/60; need+=n; done+=Math.min(sr.mins/60, n); }
  /* a good night's sleep starts the day with a little charge already in the aura */
  const sl=C.sleep && C.sleep.days[C.today], head=(sl && sl.status==='good') ? E.SLEEP.aura : 0;
  return need ? head+(1-head)*clamp(done/need,0,1) : head;
}

    ${on ? `<div class="rest-top"><span>Rest</span><b class="num" data-rest>${mmss(left)}</b><button type="button" class="btn small ghost" data-act="rest-add">+30 s</button><button type="button" class="btn small ghost" data-act="rest-skip">Skip</button></div>
      <span class="rest-bar"><i data-rest-bar style="width:${Math.round(left/total*100)}%"></i></span>`
    : `<div class="rest-top"><span>Rest between sets</span>${REST_CHOICES.map(s=>`<button type="button" class="chip" data-act="rest-len" data-v="${s}" aria-pressed="${restSec()===s}">${s/60} min</button>`).join('')}</div>`}
  </div>`;
}
function restTick(){
  if(!ui.rest) return;
  const left=restLeft();
  document.querySelectorAll('[data-rest]').forEach(n=>{ n.textContent=mmss(left); });
  document.querySelectorAll('[data-rest-bar]').forEach(n=>{ n.style.width=Math.round(left/ui.rest.total*100)+'%'; });
  if(left<=0){ ui.rest=null; SFX.play('bell'); toast('Rest done. Next set when you are ready.'); render(); }
}
setInterval(restTick, 1000);
function testNote(C, ex){
  const t=C.todayRec, p=t.info.per.find(x=>x.ex===ex); if(!p || p.sets.length) return '';
  const load=(C.load||{})[ex]||0, sug=E.suggestKg(C, ex), nm=exName(ex).toLowerCase();
  if(load>0 && sug===0) return `<p class="kgnote">Monthly bodyweight check: test ${esc(nm)} with no weight today. Your working weight stays ${kgTxt(load)}.</p>`;
  if(load>0 && sug>load) return `<p class="kgnote">You hit ${E.LOAD.upAt} at ${kgTxt(load)}. Go up to ${kgTxt(sug)}.</p>`;
  if(load===0 && sug>0) return `<p class="kgnote">Your bodyweight ${esc(nm)} max has outgrown bodyweight. Test with ${kgTxt(sug)} today.</p>`;

/* weighted sets: the weight that goes on the next set of an exercise, picked with − and + in 2.5 kg steps */
const kgTxt = kg => kg>0 ? `+${+kg.toFixed(2)} kg` : 'Bodyweight';
function kgNow(C, ex){ const k=C.today+'|'+ex; ui.kg=ui.kg||{}; if(ui.kg[k]==null) ui.kg[k]=E.suggestKg(C, ex); return ui.kg[k]; }
function kgPicker(C, ex){

    <button type="button" data-act="kg" data-ex="${ex}" data-d="-1" aria-label="Less weight"${kg<=0?' disabled':''}>−</button>
    <span class="num"><b>${kgTxt(kg)}</b></span>

const kgTag = x => x && x.kg>0 ? ` <em class="kgtag">+${+x.kg} kg</em>` : '';
/* does this logged set count as a groove set? (the engine's own rule, so a lighter set on a weighted day shows as under) */
const setOk = (C, part, x) => E.meets(E.bwAt(C.body||[], C.today), x, part.kg||0, part.target);

/* one-time swap: today trades its workout mission with tomorrow's, for this week only */
const DAY_KIND = {rest:'rest day', test:'test day', gtg:'groove day', combo:'mixed day'};
function weekdayOf(d){ return weekdayName(d); }
/* Plan and Settings: every card folds down to its title bar; tap the bar to open it (closed when the app opens) */
function foldCards(html){
  ui.fold=ui.fold||{};
  return html.replace(/<section class="card([^"]*)"([^>]*)>((?:(?!<section|<h2)[\s\S]){0,400}?)<h2([^>]*)>([\s\S]*?)<\/h2>/g, (all, cls, rest, before, h2a, title) => {
    if(/xp-card|foldable|nofold/.test(cls) || /id="rescue"/.test(rest) || /<button/.test(before)) return all;
    /* the id comes from the title text alone: a badge in the title (e.g. side quests to claim) must not change it */
    const id='f'+hashStr(title.replace(/<span class="nbadge"[\s\S]*?<\/span>/g,'').replace(/<[^>]*>/g,'').trim()), open=!!ui.fold[id];
    return `<section class="card foldable${open?'':' folded'}${cls}"${rest}>${before}<button type="button" class="fold-head" data-act="fold" data-id="${id}" aria-expanded="${open}"><h2${h2a}>${title}</h2><span class="xp-chev" aria-hidden="true"></span></button>`;
  });
}
function swapLine(C){
  const t=C.todayRec, s=S(); if(!t || state.readOnly) return '';
  const today=C.today, tom=E.addDays(today,1), partner=E.swapOf(s, today);
  const noSets = !(t.sets && t.sets.length);
  if(partner){
    const canUndo = noSets && partner>today;
    return `<div class="swap-line"><span>↔ Swapped with ${esc(weekdayOf(partner))} for this week only. Next week follows your normal plan.</span>${canUndo?`<button type="button" class="btn small ghost" data-act="swap-undo">Undo swap</button>`:''}</div>`;
  }
  if(!noSets || t.status==='exam' || E.isExam(s, tom) || E.swapOf(s, tom)) return '';
  const tp=E.planFor(s, tom);
  if(tp.type===t.plan.type) return '';
  const tw=weekdayOf(tom), now=DAY_KIND[t.plan.type]||'mission', then=DAY_KIND[tp.type]||'mission';
  if(ui.swapAsk) return `<div class="swap-line ask" role="group" aria-label="Swap today with tomorrow">
    <span><b>Swap just this once?</b> Today becomes your ${esc(then)} and ${esc(tw)} becomes your ${esc(now)}. Next week goes back to your normal plan.</span>
    <div class="btnrow"><button type="button" class="btn small chakra-btn" data-act="swap-yes">Swap today and ${esc(tw)}</button><button type="button" class="btn small ghost" data-act="swap-cancel">Cancel</button></div></div>`;
  return `<div class="swap-line"><button type="button" class="btn small ghost" data-act="swap-ask">↔ Swap today with ${esc(tw)} (${esc(then)}) · this week only</button></div>`;
}
/* on call at the hospital today: the day counts like an exam day, so a missed mission costs nothing. 2 a week. */
function onCallLine(C){
  const s=S(); if(!C.todayRec || state.readOnly || !s) return '';
  const today=C.today, on=E.onCallDay(s, today), wk=E.weekStart(today);
  if(on) return `<div class="swap-line oncall"><span>🏥 On call today: anything you manage still earns, nothing missed costs XP or breaks a streak.</span><button type="button" class="btn small ghost" data-act="oncall-off">Not on call</button></div>`;
  if(E.examFor(s, today)) return '';
  const used=(s.oncall||[]).filter(d=>d>=wk && d<=E.addDays(wk,6)).length;
  if(used>=2) return '';
  return `<div class="swap-line"><button type="button" class="btn small ghost" data-act="oncall-on">🏥 On call today (${2-used} left this week)</button></div>`;
}
function onCallAction(act){
  if(state.readOnly || !lastC) return;
  const s=clone(S()), today=lastC.today; s.oncall=Array.isArray(s.oncall)?s.oncall.filter(d=>d!==today):[];
  if(act==='oncall-on') s.oncall.push(today);
  save('settings', null, s); SFX.play('tick'); toast(act==='oncall-on'?'On call: your streaks are safe today. Good luck on the ward.':'Back to a normal day.');

/* ---------- one card for the week: the senseis' challenges (bonus XP, added by itself) and side quests (Ryō, tap to claim) ---------- */

      : old.length?`<ul class="quests"><li class="ready" id="quest-old"><div class="q-top"><b>From earlier weeks</b><span>${ryo(old.reduce((t,q)=>t+q.ryo,0))}</span></div><small>${old.length} finished side quests waiting to be claimed</small>${state.readOnly?'':`<button type="button" class="btn small claim-btn" data-act="quest-claim-all">Claim all ${old.length}</button>`}</li></ul>`:''}

function questClaimAll(){
  if(state.readOnly || !lastC) return;
  const Q=E.sideQuests(lastC), cur=Q.now ? Q.now.quests.map(q=>q.key) : [];
  const list=Q.unclaimed.filter(q=>!cur.includes(q.key)); if(!list.length) return;
  const s=clone(S()); s.quests=(s.quests && typeof s.quests==='object')?s.quests:{}; s.quests.claimed=Object.assign({}, s.quests.claimed);
  list.forEach(q=>{ s.quests.claimed[q.key]=lastC.today; });
  save('settings', null, s); SFX.play('complete'); FX.leafBurst(); toast(`+${list.reduce((t,q)=>t+q.ryo,0)} Ryō · ${list.length} side quests`);
}
function questNews(C){
  if(state.readOnly || !settled()) return;
  let seen; try{ seen=JSON.parse(localStorage.getItem('leaf-quests-seen')||'null'); }catch(e){ seen=null; }
  const done=[]; E.sideQuests(C).weeks.forEach(w=>w.quests.forEach(q=>{ if(q.done) done.push(w.start+'|'+q.id); }));
  if(!seen){ try{ localStorage.setItem('leaf-quests-seen', JSON.stringify(done)); }catch(e){} return; }
  const fresh=done.filter(k=>!seen.includes(k)); if(!fresh.length) return;
  try{ localStorage.setItem('leaf-quests-seen', JSON.stringify(seen.concat(fresh))); }catch(e){}
  fresh.forEach((k,i)=>{ const q=E.QUESTS.find(x=>x.id===k.split('|')[1]); setTimeout(()=>{ toast(`Side quest done: ${q.name}. Claim your ${q.ryo} Ryō in Weekly quests on the Ninja tab`, 4000); SFX.play('complete'); }, 900+i*4200); });
}

function swapAction(act){
  if(state.readOnly || !lastC) return;
  const today=lastC.today, tom=E.addDays(today,1), s=clone(S());
  if(act==='swap-ask'){ ui.swapAsk=true; render(); return; }
  if(act==='swap-cancel'){ ui.swapAsk=false; render(); return; }
  if(act==='swap-yes'){
    const t=lastC.todayRec; ui.swapAsk=false;
    if(!t || (t.sets && t.sets.length) || E.swapOf(s, today) || E.swapOf(s, tom)){ render(); return; }
    const keep=(Array.isArray(s.swaps)?s.swaps:[]).filter(x=>x && x.b>=E.addDays(today,-60));
    s.swaps=keep.concat({a:today, b:tom, created:new Date().toISOString()}); save('settings', null, s);
    SFX.play('tick'); toast(`Swapped: today and ${weekdayOf(tom)} traded missions, this week only`); return;
  }
  if(act==='swap-undo'){
    const t=lastC.todayRec, partner=E.swapOf(s, today);
    if(!partner || partner<=today || (t && t.sets && t.sets.length)) return;
    s.swaps=(s.swaps||[]).filter(x=>!(x && (x.a===today || x.b===today))); save('settings', null, s); toast('Swap undone. Back to your normal plan.'); return;
  }
}
function undoLine(C){

function applyScrollState(animate, only){

const hashStr = str => { let h=2166136261; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; };
function fillLine(t, v){ return t.replace(/\{(\w+)\}/g,(m,k)=>v[k]!=null?v[k]:m); }
function senseiLine(C){
  const s=S(), t=C.todayRec; if(!t) return null;

    const any=t.info.per.some(p=>p.sets.length);

    key = t.status==='done' ? 'done' : (hour>=20 ? 'late' : i.q===0 ? 'fresh' : (v.left===1 ? 'close' : 'progress'));
  }
  if(yesterday && yesterday.status==='missed' && (key==='fresh' || key==='rest') && L.lost) key='lost';

}

/* --- charts --- */
function niceStep(x){ if(x<=0) return 1; const p=Math.pow(10,Math.floor(Math.log10(x))); const n=x/p; return (n<=1?1:n<=2?2:n<=5?5:10)*p; }
function lineChart(series, o){
  o=o||{}; const W=340, H=o.h||170, L=34, R=30, T=14, B=24;
  const pts=series.flatMap(s=>s.points); if(!pts.length) return '';
  const dates=pts.map(p=>p.date).sort(); const first=dates[0];
  let x0=dnum(first), x1=dnum(dates[dates.length-1]); if(x1-x0<6) x1=x0+6;
  const vals=pts.map(p=>p.v); let ymin=Math.min(...vals), ymax=Math.max(...vals);
  let lo, hi;
  if(o.tight){ lo=ymin-1; hi=ymax+1; } else { lo=0; hi=ymax*1.2||1; }
  const step=niceStep((hi-lo)/4); lo=Math.floor(lo/step)*step; hi=Math.ceil(hi/step)*step; if(hi<=lo) hi=lo+step;
  const X=d=>L+(dnum(d)-x0)/(x1-x0)*(W-L-R), Y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
  let g='';
  for(let v=lo; v<=hi+1e-9; v+=step){ const y=Y(v).toFixed(1); g+=`<line class="gridline" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text class="ax" x="${L-6}" y="${(+y+3.5).toFixed(1)}" text-anchor="end">${+v.toFixed(1)}</text>`; }
  g+=`<text class="ax" x="${L}" y="${H-6}">${esc(shortDate(first))}</text><text class="ax" x="${W-R}" y="${H-6}" text-anchor="end">${esc(shortDate(addDays(first,x1-x0)))}</text>`;
  const lines = series.map(s=>{
    const ps=s.points.slice().sort((a,b)=>a.date<b.date?-1:1); if(!ps.length) return '';
    const d=ps.map((p,i)=>`${i?'L':'M'}${X(p.date).toFixed(1)} ${Y(p.v).toFixed(1)}`).join(' ');
    const area = series.length===1 && ps.length>1 ? `<path d="${d} L${X(ps[ps.length-1].date).toFixed(1)} ${Y(lo).toFixed(1)} L${X(ps[0].date).toFixed(1)} ${Y(lo).toFixed(1)}Z" style="fill:${s.color}" fill-opacity=".12"/>` : '';
    const dots = ps.map((p,i)=>`<circle cx="${X(p.date).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="${i===ps.length-1?4.5:3}" style="fill:${i===ps.length-1?s.color:'var(--card)'};stroke:${s.color}" stroke-width="2"/>`).join('');
    const lp=ps[ps.length-1];
    return `${area}<path d="${d}" style="fill:none;stroke:${s.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}<text class="ax" x="${(X(lp.date)+7).toFixed(1)}" y="${(Y(lp.v)+3.5).toFixed(1)}" style="fill:${s.color};font-weight:700">${+lp.v.toFixed(1)}</text>`;
  }).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'Chart')}">${g}${lines}</svg></div>`;
}
function barChart(weeks, exIds){
  const W=340, H=180, L=34, R=8, T=12, B=24;
  const vals=weeks.flatMap(w=>exIds.map(id=>w.reps[id]||0)); const mx=Math.max(1,...vals);
  const step=niceStep(mx/4); const hi=Math.ceil(mx*1.1/step)*step||step;
  const Y=v=>T+(1-v/hi)*(H-T-B);
  let g='';
  for(let v=0; v<=hi+1e-9; v+=step){ const y=Y(v).toFixed(1); g+=`<line class="gridline" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text class="ax" x="${L-6}" y="${(+y+3.5).toFixed(1)}" text-anchor="end">${fmt(v)}</text>`; }
  const n=Math.max(weeks.length,1), slot=(W-L-R)/Math.max(n,4), gw=Math.min(slot*0.7, 44), bw=gw/exIds.length;
  const bars=weeks.map((w,i)=>{
    const gx=L+slot*i+(slot-gw)/2;
    const rects=exIds.map((id,k)=>{ const v=w.reps[id]||0; const y=Y(v); return `<rect x="${(gx+k*bw+1).toFixed(1)}" y="${y.toFixed(1)}" width="${Math.max(bw-2,2).toFixed(1)}" height="${Math.max(Y(0)-y,0).toFixed(1)}" rx="3" style="fill:${exColor(id)}"><title>${esc(exName(id))}: ${v}</title></rect>`; }).join('');
    return rects+`<text class="ax" x="${(gx+gw/2).toFixed(1)}" y="${H-7}" text-anchor="middle">${esc(shortDate(w.start))}</text>`;
  }).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weekly reps by exercise">${g}${bars}</svg></div>`;
}
function heatmap(C){
  const s=S(), byDate={}; C.days.forEach(d=>byDate[d.date]=d);
  const start=addDays(weekStart(C.today), -7*11), cs=24, gap=4, L=30, W=L+12*(cs+gap), H=7*(cs+gap)+18;
  let cells='';
  for(let w=0; w<12; w++) for(let k=0; k<7; k++){
    const d=addDays(start, w*7+k), rec=byDate[d];
    let fill='var(--paper)', stroke='var(--line)', op=1;
    if(rec){ if(rec.status==='done'){fill='var(--leaf)';stroke='var(--leaf)';} else if(rec.status==='missed'){fill='var(--danger)';stroke='var(--danger)';} else if(rec.status==='rest'){fill='var(--rest-soft)';stroke='var(--rest)';} else if(rec.status==='exam'){fill='var(--exam)';stroke='var(--exam)';} else if(rec.status==='scroll'){fill='#f3dc9b';stroke='#c48d1e';} else {fill='var(--chakra-soft)';stroke='var(--chakra)';} }
    else if(d<s.startDate || d>C.today){ op=.45; }
    cells+=`<rect x="${L+w*(cs+gap)}" y="${k*(cs+gap)}" width="${cs}" height="${cs}" rx="5" style="fill:${fill};stroke:${stroke}" stroke-width="1.2" opacity="${op}"><title>${esc(shortDate(d))}${rec?': '+rec.status:''}</title></rect>`;
  }
  const labels=['S','M','T','W','T','F','S'].map((l,k)=>`<text class="ax" x="${L-10}" y="${k*(cs+gap)+cs/2+3.5}" text-anchor="middle">${l}</text>`).join('');
  const months=[0,4,8,11].map(w=>`<text class="ax" x="${L+w*(cs+gap)}" y="${H-3}">${esc(shortDate(addDays(start,w*7)))}</text>`).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Last 12 weeks of training">${labels}${cells}${months}</svg></div>`;
}

async function photoSave(blob, pose, date){

let camStream=null;
function camClose(){ if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; } const l=document.getElementById('cam-layer'); if(l) l.remove(); clearInterval(camClose.cd); }
async function camOpen(pose){
  camClose();
  if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)){ toast('The camera is not available here, so pick a photo instead.'); const f=document.getElementById('ph-file'); if(f) f.click(); return; }
  const cam={pose, facing:ui.camFacing||'user', timer:ui.camTimer!=null?ui.camTimer:5};
  const layer=document.createElement('div'); layer.id='cam-layer'; layer.className='cam-layer'; document.body.appendChild(layer);
  const draw=()=>{
    const last=photosOf(cam.pose).slice(-1)[0], lbl=POSES.find(x=>x[0]===cam.pose)[1];
    layer.innerHTML=`<video playsinline autoplay muted class="${cam.facing==='user'?'mirror':''}"></video>

      <div class="cam-count" aria-live="assertive"></div>

        <button type="button" class="cam-shutter" data-cam="shoot" aria-label="Take the photo"></button>
        <div class="cam-chips">${POSES.map(([k,l])=>`<button type="button" class="chip" data-cam="pose" data-v="${k}" aria-pressed="${cam.pose===k}">${l}</button>`).join('')}</div></div>`;
    const v=layer.querySelector('video'); if(camStream) v.srcObject=camStream;
  };
  const start=async()=>{
    if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; }
    try{ camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:cam.facing, width:{ideal:1440}, height:{ideal:1920}}, audio:false}); }
    catch(e){ camClose(); toast('The camera could not open, so pick a photo instead.'); const f=document.getElementById('ph-file'); if(f) f.click(); return false; }
    draw(); return true;
  };
  const shoot=async()=>{
    const v=layer.querySelector('video'); if(!v || !v.videoWidth) return;
    const W=v.videoWidth, H=v.videoHeight, sc=Math.min(1, 1600/Math.max(W,H)), c=document.createElement('canvas'); c.width=Math.round(W*sc); c.height=Math.round(H*sc);
    const g=c.getContext('2d'); if(cam.facing==='user'){ g.translate(c.width,0); g.scale(-1,1); } g.drawImage(v,0,0,c.width,c.height);

    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.86)); if(!blob){ toast('The photo could not be saved.'); return; }
    try{ await photoSave(blob, cam.pose, lastC?lastC.today:todayStr()); }catch(e){ toast(e && e.code ? uploadErrorText(e) : 'The photo could not be saved.'); return; }
    const i=POSES.findIndex(x=>x[0]===cam.pose), next=POSES[i+1];
    toast(`${POSES[i][1]} photo saved${next?`. Next: ${next[1].toLowerCase()}`:'. All three done'}`);
    ui.photoPose=cam.pose; render();
    if(next){ cam.pose=next[0]; layer.classList.remove('flash'); draw(); } else camClose();
  };
  layer.addEventListener('click', e=>{
    const b=e.target.closest('[data-cam]'); if(!b) return; const k=b.dataset.cam;
    if(k==='close'){ camClose(); return; }
    if(k==='flip'){ cam.facing=cam.facing==='user'?'environment':'user'; ui.camFacing=cam.facing; start(); return; }
    if(k==='timer'){ cam.timer=+b.dataset.v; ui.camTimer=cam.timer; draw(); return; }
    if(k==='pose'){ cam.pose=b.dataset.v; draw(); return; }

      if(!cam.timer){ shoot(); return; }
      let n=cam.timer; const out=layer.querySelector('.cam-count'); out.textContent=n; SFX.play('tick'); clearInterval(camClose.cd);
      camClose.cd=setInterval(()=>{ n--; if(n<=0){ clearInterval(camClose.cd); out.textContent=''; shoot(); } else { out.textContent=n; SFX.play('tick'); } },1000);
    }
  });
  await start();
}

function goalAdd(){

/* a scroll earned just now gets a small moment and a chime. The list of scrolls already seen is kept on this device;
   the first time (and on a device that just received its history) everything already earned is taken as seen. */
let achReady=false, achTimer=null, achRev=-1, achShowing=false;
const achQueue=[];
function achSeen(){ try{ const v=JSON.parse(localStorage.getItem('leaf-ach-seen')||'null'); return Array.isArray(v) ? v : null; }catch(e){ return null; } }
function checkAchievements(C){
  if(state.readOnly || !settled()) return;
  if(!achReady){
    if(achTimer && achRev===dataRev) return;
    clearTimeout(achTimer); achRev=dataRev;
    achTimer=setTimeout(()=>{ achTimer=null; if(achRev===dataRev && settled()) achReady=true; if(lastC) checkAchievements(lastC); }, 2000);
    return;
  }
  if(C._achChecked) return; C._achChecked=true;
  const earned=E.achievements(C).filter(a=>a.date), seen=achSeen();
  if(seen==null){ try{ localStorage.setItem('leaf-ach-seen', JSON.stringify(earned.map(a=>a.id))); }catch(e){} return; }
  const fresh=earned.filter(a=>seen.indexOf(a.id)<0); if(!fresh.length) return;
  try{ localStorage.setItem('leaf-ach-seen', JSON.stringify(seen.concat(fresh.map(a=>a.id)))); }catch(e){ return; }
  fresh.forEach(a=>achQueue.push(a)); pumpAch();
}
function pumpAch(){
  if(achShowing || !achQueue.length) return;
  const a=achQueue.shift(), el=document.getElementById('achpop'); achShowing=true;
  el.innerHTML=`${scrollIcon(true)}<div><span class="eyebrow">Scroll earned</span><b>${esc(a.name)}</b><span>${esc(a.need)}</span></div>`;
  el.hidden=false; el.classList.remove('go'); void el.offsetWidth; el.classList.add('go');
  SFX.play('chime', .15);
  const r=el.getBoundingClientRect(); FX.sparkBurst(r.left+r.width/2, r.top+r.height/2+24, getComputedStyle(document.documentElement).getPropertyValue('--chakra-2').trim()||'#ffd27a');
  setTimeout(()=>{ el.hidden=true; el.classList.remove('go'); achShowing=false; pumpAch(); }, reduceMotion() ? 3000 : 3700);
}

const FX = (()=>{
  const amb=document.getElementById('ambient'), top=document.getElementById('fxtop');

  let W=0,H=0,dpr=1, mode=null, cols=['#888888'], P=[], B=[], raf=0, lastT=0;
  const R=(x,y)=>x+Math.random()*(y-x), pick=arr=>arr[Math.floor(Math.random()*arr.length)];
  const COUNT={leaves:14,storm:20,motes:26,wind:9,fireflies:18,clouds:6,ash:24,embers:22,autumn:14,sparks:26,stars:55};
  function size(){ dpr=Math.min(2,window.devicePixelRatio||1); W=window.innerWidth; H=window.innerHeight; [amb,top].forEach(c=>{ c.width=Math.round(W*dpr); c.height=Math.round(H*dpr); }); a.setTransform(dpr,0,0,dpr,0,0); b.setTransform(dpr,0,0,dpr,0,0); }

      case 'storm': return {k:'leaf', x:init?R(0,W):R(-80,W*.6), y:init?R(0,H):R(-40,-10), vx:R(40,80), vy:R(30,55), r:R(0,6.3), vr:R(-3,3), s:R(4,8), c, sw:0, al:R(.3,.55)};
      case 'motes': return {k:'dot', x:R(0,W), y:init?R(0,H):H+10, vx:R(-4,4), vy:R(-11,-4), s:R(1.2,2.8), c, al:R(.3,.65), tw:R(0,6.3)};
      case 'wind': return {k:'streak', x:init?R(0,W):R(-240,-60), y:R(0,H), vx:R(150,250), vy:R(-6,6), len:R(60,140), c, al:R(.14,.28), ph:R(0,6.3)};
      case 'fireflies': return {k:'glow', x:R(0,W), y:R(0,H), vx:R(-8,8), vy:R(-8,8), s:R(2,3.4), c, tw:R(0,6.3), al:.85};
      case 'clouds': return {k:'cloud', x:init?R(-100,W):-240, y:R(0,H), vx:R(4,10), vy:0, s:R(90,170), c, al:R(.3,.5)};
      case 'ash': return {k:'flake', x:R(0,W), y:init?R(0,H):-10, vx:R(-10,14), vy:R(10,24), r:R(0,6.3), vr:R(-2,2), s:R(1.5,3.2), c, al:R(.3,.55)};

      case 'sparks': return {k:'ember', x:R(0,W), y:init?R(0,H):H+10, vx:R(-20,20), vy:R(-90,-45), s:R(1.2,2.4), c, al:R(.5,.9), tw:R(0,6.3)};
      case 'stars': return {k:'star', x:R(0,W), y:R(0,H), vx:0, vy:R(-2,-.5), s:R(.8,2.2), c, tw:R(0,6.3), al:R(.45,.95)};

  }
  function leafPath(ctx,s){ ctx.beginPath(); ctx.moveTo(-s,0); ctx.quadraticCurveTo(0,-s*.75,s,0); ctx.quadraticCurveTo(0,s*.75,-s,0); ctx.closePath(); }
  function draw(ctx,p,t){
    ctx.save(); ctx.translate(p.x,p.y);
    const tw = p.tw!=null ? (.5+.5*Math.sin(t/650+p.tw)) : 1;
    switch(p.k){
      case 'leaf': ctx.rotate(p.r); ctx.globalAlpha=p.al; ctx.fillStyle=p.c; leafPath(ctx,p.s); ctx.fill(); ctx.globalAlpha=p.al*.5; ctx.strokeStyle='rgba(0,0,0,.35)'; ctx.lineWidth=.7; ctx.beginPath(); ctx.moveTo(-p.s*.9,0); ctx.lineTo(p.s*.9,0); ctx.stroke(); break;

  function frame(t){
    raf=0; const dt=Math.min(.05,(t-(lastT||t))/1000); lastT=t;

      for(let i=0;i<P.length;i++){
        const p=P[i]; p.x+=p.vx*dt; p.y+=p.vy*dt;
        if(p.sw!=null && p.k==='leaf') p.x+=Math.sin(t/1100+p.sw)*14*dt;
        if(p.vr) p.r+=p.vr*dt;
        if(p.k==='glow'){ if(p.x<0||p.x>W) p.vx*=-1; if(p.y<0||p.y>H) p.vy*=-1; p.vx+=R(-6,6)*dt; p.vy+=R(-6,6)*dt; }
        else if(p.k==='star'){ if(p.y<-5){ p.y=H+5; p.x=R(0,W); } }
        else if(p.x<-260||p.x>W+260||p.y<-70||p.y>H+70){ P[i]=make(false)||p; continue; }

  document.addEventListener('visibilitychange', kick);

    setMode(m, colors){ mode=m; cols=colors&&colors.length?colors:cols; P=[]; for(let i=0;i<(COUNT[m]||0);i++){ const p=make(true); if(p) P.push(p); } kick(); },
    refresh(){ kick(); },
    sparkBurst(x,y,color){

    flash(){ if(fxSubtle()) return; const el=document.getElementById('flash'); el.classList.remove('go'); void el.offsetWidth; el.classList.add('go'); setTimeout(()=>el.classList.remove('go'),1100); },
    shake(){ if(fxSubtle()) return; const v=document.getElementById('view'); v.classList.remove('shake'); void v.offsetWidth; v.classList.add('shake'); setTimeout(()=>v.classList.remove('shake'),560); },
    stamp(text){ const el=document.getElementById('stamp'); el.textContent=text; el.hidden=false; el.classList.remove('go'); void el.offsetWidth; el.classList.add('go'); setTimeout(()=>FX.shake(),250); clearTimeout(el._t); el._t=setTimeout(()=>{ el.hidden=true; el.classList.remove('go'); },1750); }

/* ---------- sound effects, synthesized (original, no recordings) ---------- */
const SOUND_SLOTS = [
  {id:'set',      label:'Logging a set',    synth:'whoosh', name:'Kunai whoosh', len:4},
  {id:'undo',     label:'Undoing a set',    synth:'pop',    name:'Soft pop',     len:3},
  {id:'complete', label:'Mission complete', synth:'taiko',  name:'Taiko drum',   len:4},
  {id:'max',      label:'New max',          synth:'thud',   name:'Stamp thud',   len:4},
  {id:'promo',    label:'Promotion',        synth:'gong',   name:'Gong',         len:0},
  {id:'scroll',   label:'Opening the scroll', synth:'paper', name:'Paper slide', len:2}

const slotDef = id => SOUND_SLOTS.find(x=>x.id===id);
const SFX = (()=>{
  let ctx=null, out=null, nb=null, voice=null;
  const customs={};
  const isOn = () => prefs.sfxOn!==false;
  const lenOf = slot => { const v=(prefs.soundLen||{})[slot]; return (v!=null && !isNaN(+v)) ? +v : (slotDef(slot)||{len:4}).len; };
  function ac(){
    try{
      if(!ctx){ const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; ctx=new C(); out=ctx.createGain(); out.gain.value=.55*prefs.fxVol; const comp=ctx.createDynamicsCompressor(); out.connect(comp); comp.connect(ctx.destination); }

      return ctx;
    }catch(e){ return null; }
  }
  function noise(c){ if(nb) return nb; nb=c.createBuffer(1,c.sampleRate*2,c.sampleRate); const d=nb.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; return nb; }
  function env(c,t,att,peak,dec){ const g=c.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(peak,t+att); g.gain.exponentialRampToValueAtTime(.0001,t+att+dec); return g; }
  function hiss(c,t,dur,type,f0,f1,q,peak,att){ const s=c.createBufferSource(); s.buffer=noise(c); const f=c.createBiquadFilter(); f.type=type; f.Q.value=q; f.frequency.setValueAtTime(f0,t); if(f1) f.frequency.exponentialRampToValueAtTime(f1,t+dur); const g=env(c,t,att||.01,peak,dur); s.connect(f); f.connect(g); g.connect(out); s.start(t,Math.random()); s.stop(t+dur+.15); }
  function tone(c,t,type,f0,f1,dur,peak,att){ const o=c.createOscillator(); o.type=type; o.frequency.setValueAtTime(f0,t); if(f1) o.frequency.exponentialRampToValueAtTime(f1,t+dur); const g=env(c,t,att||.005,peak,dur); o.connect(g); g.connect(out); o.start(t); o.stop(t+dur+.15); }

    paper(c,t){ hiss(c,t,.5,'bandpass',900,2600,.9,.22,.06); hiss(c,t+.05,.45,'highpass',3000,0,.4,.05,.05); tone(c,t+.5,'triangle',320,180,.07,.1); },
    whoosh(c,t){ hiss(c,t,.28,'bandpass',3600,420,1.4,.6,.04); tone(c,t+.2,'triangle',2600,2300,.16,.05); },
    tick(c,t){ tone(c,t,'sine',1500,1150,.04,.06); },
    pop(c,t){ tone(c,t,'sine',720,280,.12,.16); },
    drum(c,t,p){ tone(c,t,'sine',150,48,.55,.9*p); tone(c,t,'triangle',92,40,.4,.3*p); hiss(c,t,.08,'lowpass',900,300,.7,.45*p,.002); },
    taiko(c,t){ S.drum(c,t,1); S.drum(c,t+.16,.6); hiss(c,t+.3,.6,'highpass',5200,0,.5,.05,.01); },
    bell(c,t){ tone(c,t,'sine',528,524,1.8,.1,.03); tone(c,t,'sine',792,790,1.3,.045,.03); tone(c,t+.02,'sine',1056,1054,.8,.02,.03); },
    chime(c,t){ tone(c,t,'sine',880,880,.55,.11,.01); tone(c,t+.13,'sine',1318.5,1318.5,.7,.09,.01); tone(c,t+.26,'sine',1760,1760,.95,.06,.01); },
    thud(c,t){ tone(c,t,'sine',120,32,.38,1); hiss(c,t,.12,'lowpass',620,120,.8,.75,.002); tone(c,t,'square',220,90,.06,.07); },

  };

    return new Promise(res=>{
      const c=ac(); if(!c || !raw) return res(null);
      try{ const pr=c.decodeAudioData(raw.slice(0), b=>res(b), ()=>res(null)); if(pr && pr.catch) pr.catch(()=>res(null)); }catch(e){ res(null); }

  }

  }
  function decode(slot){

  const SYN_DUR={whoosh:.35, pop:.2, taiko:.8, thud:.6, gong:2.5, tick:0, paper:.5, chime:1.1, bell:1.6};
  return {
    get on(){ return isOn(); },
    audio(){ return ac(); },
    setVolume(v){ prefs.fxVol=v; if(out) out.gain.value=.55*v; },
    hasCustom: slot => !!customs[slot],
    len: lenOf,
    clipLen,
    setLen(slot,n){ prefs.soundLen=Object.assign({}, prefs.soundLen, {[slot]:n}); savePrefs(); },
    setSource(slot,id){ if(!id){ delete customs[slot]; return; } if(customs[slot] && customs[slot].id===id) return; customs[slot]={id, url:blobUrl(id), raw:null, buf:null, start:0}; },
    setBuffer(slot,id,raw){ customs[slot]={id, url:blobUrl(id), raw, buf:null, start:0}; },
    canDecode(raw){ return decodeRaw(raw).then(b=>!!b); },
    prefetch(){ Object.keys(customs).forEach(k=>{ const cu=customs[k]; if(!cu.raw) fetchRaw(cu); }); },
    decode,
    unlock(){ if(!isOn()) return; ac(); Object.keys(customs).forEach(k=>{ if(!customs[k].buf) decode(k); }); },
    toggle(){ prefs.sfxOn=!isOn(); savePrefs(); if(isOn()){ const c=ac(); if(c) S.tick(c,c.currentTime+.01); } else { try{ if(voice) voice.stop(); }catch(e){} } return isOn(); },
    play(name, delay){
      if(!isOn()) return; const c=ac(); if(!c) return;
      const t=c.currentTime+.02+(delay||0);
      try{ if(slotDef(name)) playSlot(name,c,t); else if(S[name] && name!=='drum') S[name](c,t); }catch(e){}
      const def=slotDef(name); const dur = def ? (customs[name] ? (clipLen(name)||2) : SYN_DUR[def.synth]) : (SYN_DUR[name]||0);
      if(dur && duckHook) duckHook(dur+(delay||0));
    }
  };
})();

/* ---------- permanent file storage (artifact assets, pointers in the media doc) ---------- */
let assetsP=null;
function getAssets(){ if(!assetsP) assetsP=(async()=>{ try{ return (window.claude && typeof window.claude.use==='function') ? await window.claude.use('assets') : null; }catch(e){ return null; } })(); return assetsP; }
async function uploadAsset(blob, type){
  const a=await getAssets(); if(!a) throw {code:'unavailable'};
  let last;
  for(let i=0;i<2;i++){ try{ return await a.upload(blob, type?{type}:undefined); }catch(e){ last=e; if(!(e && e.code==='store_unavailable') || i) break; await sleep(900); } }
  throw last;
}
function deleteAsset(id){ if(!id) return; getAssets().then(a=>{ if(a) return a.delete(id); }).catch(()=>{}); }
function uploadErrorText(e){
  const c=e && e.code;
  if(c==='too_large') return 'That file is over 20 MB. Pick a shorter or smaller one.';
  if(c==='unsupported_type') return "That file type can't be stored. Use M4A, MP4 or WebM audio, or a JPEG or PNG photo.";
  if(c==='quota_or_state') return 'This phone\'s storage for the app is full. Remove a track or photo first.';
  if(c==='unavailable' || c==='not_granted' || c==='capability_disabled' || c==='capability_removed') return 'This phone couldn\'t save that file. Free up some storage and try again.';
  if(c==='rate_limited') return 'Too many uploads at once. Wait a moment and try again.';
  return "That file couldn't be saved. Check your connection and try again.";
}
/* Storage accepts MP4 but refuses files labelled "M4A". The audio is identical; only the
   label in the file's header changes from the Apple M4A brand to the standard MP4 brand. */
function normalizeMp4(buf){
  const u=new Uint8Array(buf); if(u.length<16) return buf;
  const size=((u[0]<<24)|(u[1]<<16)|(u[2]<<8)|u[3])>>>0;
  if(String.fromCharCode(u[4],u[5],u[6],u[7])!=='ftyp' || size<16 || size>u.length) return buf;
  const out=u.slice(0);
  const fix=(o,to)=>{ const b=String.fromCharCode(out[o],out[o+1],out[o+2],out[o+3]); if(/^M4[ABPV] $/.test(b)) for(let i=0;i<4;i++) out[o+i]=to.charCodeAt(i); };
  fix(8,'isom'); for(let o=16;o+4<=size;o+=4) fix(o,'mp41');
  return out.buffer;
}
const isMp4Buf = buf => { try{ const b=new Uint8Array(buf, 4, 4); return String.fromCharCode(b[0],b[1],b[2],b[3])==='ftyp'; }catch(e){ return false; } };
async function audioUploadType(file){
  const n=(file.name||'').toLowerCase(), t=(file.type||'').toLowerCase();
  if(/\.(webm|weba)$/.test(n) || t==='audio/webm' || t==='video/webm') return 'video/webm';
  const head=await file.slice(0,12).arrayBuffer();
  if(isMp4Buf(head)) return 'video/mp4';
  return null;
}
const baseName = f => (f.name||'File').replace(/\.[^.]+$/,'');
function saveMedia(fn){ const m=clone(media()); fn(m); save('media', null, m); }
let syncedMediaKey=null;
function syncMedia(){
  const m=media(), key=JSON.stringify(m); if(key===syncedMediaKey) return; syncedMediaKey=key;
  SOUND_SLOTS.forEach(d=>SFX.setSource(d.id, (m.sounds[d.id]||{}).id || null));

/* one-time move of files that older versions kept only on this device */
const localFiles = (()=>{
  let dbp=null;
  function open(){ if(dbp) return dbp; dbp=new Promise((res,rej)=>{ try{ const r=indexedDB.open(OPEN?'leaf-village-open-device':'leaf-village-device',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }catch(e){ rej(e); } }); return dbp; }
  const run=(mode,fn)=>open().then(d=>new Promise((res,rej)=>{ const tx=d.transaction('kv',mode); const rq=fn(tx.objectStore('kv')); rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error); }));
  return { get:k=>run('readonly',st=>st.get(k)), del:k=>run('readwrite',st=>st.delete(k)) };
})();
function dataUrlToBlob(u){ const [h,b64]=u.split(','); const bin=atob(b64); const a=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i); return new Blob([a],{type:(h.match(/data:([^;]+)/)||[])[1]||'image/jpeg'}); }
let migrationDone=false;
async function migrateDeviceFiles(){
  if(migrationDone || state.mode!=='db' || state.readOnly) return; migrationDone=true;
  if(!(await getAssets())) return;
  const m=media(), add={bg:{}, sounds:{}, music:[]};
  for(const d of [BG_ALL].concat(BG_SLOTS)){ if(m.bg[d.id]) continue; try{ const r=await localFiles.get('bg-'+d.id); if(r && r.url){ const res=await uploadAsset(dataUrlToBlob(r.url),'image/jpeg'); add.bg[d.id]={id:res.id, name:r.name||d.label}; await localFiles.del('bg-'+d.id); } }catch(e){} }
  for(const d of SOUND_SLOTS){ if(m.sounds[d.id]) continue; const k=d.id==='set'?'set-sound':'sound-'+d.id; try{ const r=await localFiles.get(k); if(r && r.data && isMp4Buf(r.data)){ const res=await uploadAsset(new Blob([normalizeMp4(r.data)],{type:'video/mp4'}),'video/mp4'); add.sounds[d.id]={id:res.id, name:r.name||'Your sound'}; await localFiles.del(k); } }catch(e){} }
  try{ const l=await localFiles.get('music-list'); if(Array.isArray(l)){ for(const t of l){ try{ const r=await localFiles.get('music-'+t.id); if(r && r.data && isMp4Buf(r.data)){ const res=await uploadAsset(new Blob([normalizeMp4(r.data)],{type:'video/mp4'}),'video/mp4'); add.music.push({id:res.id, name:t.name||'Track'}); await localFiles.del('music-'+t.id); } }catch(e){} } } }catch(e){}
  if(Object.keys(add.bg).length || Object.keys(add.sounds).length || add.music.length){
    saveMedia(mm=>{ Object.assign(mm.bg, add.bg); Object.assign(mm.sounds, add.sounds); mm.music=mm.music.concat(add.music); });
    toast('Files found on this device are now saved');
  }
}

/* ---------- background music ---------- */
const MUSIC_BUILTIN = {id:'builtin', name:'Training Grounds', builtin:true};
const Music = (()=>{
  let gain=null, duck=null, el=null, connected=false, playing=false, active=false, idx=0, bt=null, loaded=false, autoDone=false, errShown=false, selfPauseAt=0, resumeOnReturn=false;
  /* each track is loaded once into memory, so playback never waits on the disk or the network */
  const mem={}, loading={};
  function srcFor(id){ const u=blobUrl(id); if(mem[id]) return mem[id]; if(/^blob:/.test(u)) return u; return u; }
  function preload(id){
    const u=blobUrl(id); if(mem[id] || loading[id] || !u || /^blob:/.test(u)) return Promise.resolve();
    loading[id]=fetch(u).then(r=>r.ok?r.blob():null).then(b=>{ if(b && b.size) mem[id]=URL.createObjectURL(b); }).catch(()=>{}).finally(()=>{ delete loading[id]; });
    return loading[id];

  async function preloadAll(){ const l=files(); if(!l.length) return; const first=l[Math.min(idx,l.length-1)]; if(first) await preload(first.id); for(const t of l) await preload(t.id); }

    if(!('mediaSession' in navigator)) return;
    const t=current();
    try{ navigator.mediaSession.metadata = t ? new MediaMetadata({title:t.name, artist:'The Leaf Village', artwork:[{src:'icons/icon-512.png', sizes:'512x512', type:'image/png'}]}) : null; }catch(e){}
    try{ navigator.mediaSession.playbackState = playing ? 'playing' : (active ? 'paused' : 'none'); }catch(e){}
  }
  function wake(){ const c=chain(); if(c && c.state!=='running'){ try{ const pr=c.resume(); if(pr && pr.catch) pr.catch(()=>{}); }catch(e){} } return c; }
  const files = () => media().music.filter(m=>m && m.id).map(m=>({id:m.id, name:m.name||'Track'}));

/* settings remember two ranks: the last promotion accepted and the chosen theme. They are kept by rank id as well
   as by position, so adding or removing a rank in the ladder cannot silently point them at a different rank. */
const rankIdx = id => RANKS.findIndex(r=>r.id===id);
function seenRank(C){
  const s=S(), i=s.celebratedId ? rankIdx(s.celebratedId) : -1;
  if(i>=0) return i;
  return clamp(Math.round(+s.celebrated||0), 0, C.peak);
}
function themeChoice(s){
  if(s.themeRankId){ const i=rankIdx(s.themeRankId); return i>=0 ? i : null; }
  return (typeof s.themeRank==='number' && RANKS[s.themeRank]) ? s.themeRank : null;
}
function stampRankIds(s){
  if(!s || typeof s!=='object' || !lastC || !settled()) return;
  if(!s.celebratedId || rankIdx(s.celebratedId)<0){ const i=clamp(Math.round(+s.celebrated||0), 0, lastC.peak); s.celebrated=i; s.celebratedId=RANKS[i].id; }
  else s.celebrated=rankIdx(s.celebratedId);
  if(s.themeRankId){ const i=rankIdx(s.themeRankId); if(i>=0) s.themeRank=i; else { delete s.themeRank; delete s.themeRankId; } }
  else if(typeof s.themeRank==='number'){ if(RANKS[s.themeRank]) s.themeRankId=RANKS[s.themeRank].id; else delete s.themeRank; }
}
/* an old backup may remember a promotion from an earlier ladder that is above the rank it now computes to;
   left alone, the next real promotions would pass without their ceremony. The fix waits until the data has
   been still for a few seconds, because a village arriving through sync is briefly "all settings, no logs". */
const settled = () => allLoaded() && !(Sync && Sync.status().state==='syncing');
const rankStale = (s, C) => (!s.celebratedId || rankIdx(s.celebratedId)<0) && Math.round(+s.celebrated||0)>C.peak;
let rankFixTimer=null;
function fixRankRefs(C){
  if(state.readOnly || rankFixTimer || !rankStale(S(), C)) return;
  const rev=dataRev;
  rankFixTimer=setTimeout(()=>{
    rankFixTimer=null; const cur=S(), C2=lastC;
    if(!cur || !C2 || state.readOnly) return;
    if(dataRev!==rev || !settled()){ fixRankRefs(C2); return; }
    if(rankStale(cur, C2)) save('settings', null, clone(cur));
  }, 4000);
}
function themeIndex(C){
  const t=themeChoice(S());
  if(C.peak>seenRank(C)) return C.peak;
  return (t!=null && t>=0 && t<=C.peak) ? t : C.peak;
}

const canvasToBlob = (cv, type, q) => new Promise((res,rej)=>cv.toBlob(b=>b?res(b):rej(new Error('encode')), type, q));
/* a one-page PDF that holds the report picture */
async function pdfFromCanvas(cv){
  const jpg=new Uint8Array(await (await canvasToBlob(cv,'image/jpeg',.92)).arrayBuffer());
  const enc=new TextEncoder(), parts=[], offs=[]; let len=0;
  const add=x=>{ const b=typeof x==='string' ? enc.encode(x) : x; parts.push(b); len+=b.length; };
  const obj=(n,fn)=>{ offs[n]=len; add(`${n} 0 obj\n`); fn(); add('\nendobj\n'); };
  add('%PDF-1.4\n');
  obj(1,()=>add('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2,()=>add('<< /Type /Pages /Kids [3 0 R] /Count 1 >>'));
  obj(3,()=>add('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>'));
  obj(4,()=>{ add(`<< /Type /XObject /Subtype /Image /Width ${cv.width} /Height ${cv.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`); add(jpg); add('\nendstream'); });
  const content='q 595 0 0 842 0 0 cm /Im0 Do Q';
  obj(5,()=>add(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`));
  const xref=len; add('xref\n0 6\n0000000000 65535 f \n'); for(let i=1;i<=5;i++) add(String(offs[i]).padStart(10,'0')+' 00000 n \n');
  add(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(parts, {type:'application/pdf'});
}

/* ---------- patching the page ----------
   A render builds the whole view as text, but only the parts that differ are changed on the page. Everything else
   keeps its place: the open scroll stays open, the page does not jump, a typed-in field keeps its cursor, and
   pictures and running animations are not restarted. */
const KEEP_CLASSES=['powerup','zapped','no-anim','shake','pulse'];
const isKeep = n => n.nodeType===1 && n.getAttribute('data-morph')==='keep';
const nodeKey = n => n.nodeType!==1 ? '#'+n.nodeType : n.nodeName+'|'+(n.id || n.getAttribute('data-k') || n.getAttribute('data-sid') || (n.getAttribute('class')||'').split(' ')[0]);
const sameNode = (a,b) => a.nodeType===b.nodeType && (a.nodeType!==1 || nodeKey(a)===nodeKey(b));
function morphAttrs(o, n){
  const oa=o.attributes, na=n.attributes;
  for(let i=oa.length-1;i>=0;i--){
    const name=oa[i].name; if(n.hasAttribute(name)) continue;
    if(name==='class'){ const keep=KEEP_CLASSES.filter(c=>o.classList.contains(c)).join(' '); if(keep){ if(oa[i].value!==keep) o.setAttribute('class',keep); } else o.removeAttribute('class'); }
    else o.removeAttribute(name);
  }
  for(let i=0;i<na.length;i++){
    const name=na[i].name; let v=na[i].value;
    if(name==='class'){ const keep=KEEP_CLASSES.filter(c=>o.classList.contains(c) && (' '+v+' ').indexOf(' '+c+' ')<0); if(keep.length) v=(v+' '+keep.join(' ')).trim(); }
    if(o.getAttribute(name)!==v) o.setAttribute(name,v);
  }
  const tag=o.nodeName;
  if(tag==='INPUT'){
    if(o.type==='checkbox' || o.type==='radio') o.checked=n.hasAttribute('checked');
    else if(o.type!=='file' && o!==document.activeElement){ const v=n.getAttribute('value'); if(v!=null && o.value!==v) o.value=v; }
  } else if(tag==='OPTION'){ const sel=n.hasAttribute('selected'); if(o.selected!==sel) o.selected=sel; }
}
function morphNode(o, n){
  if(o.nodeType!==1){ if(o.nodeValue!==n.nodeValue) o.nodeValue=n.nodeValue; return; }
  morphAttrs(o, n);
  morphChildren(o, n);
}
function morphChildren(from, to){
  let o=from.firstChild, n=to.firstChild;
  while(n){
    const nNext=n.nextSibling;
    while(o && isKeep(o)) o=o.nextSibling;
    if(!o){ from.appendChild(n); n=nNext; continue; }
    if(sameNode(o,n)){ morphNode(o,n); o=o.nextSibling; n=nNext; continue; }
    /* not the same thing in the same place: was something added before it, or taken away? */
    let m=null, k=0; for(let x=o.nextSibling; x && k<12; x=x.nextSibling, k++){ if(!isKeep(x) && sameNode(x,n)){ m=x; break; } }
    let needed=false; k=0; for(let x=nNext; x && k<12; x=x.nextSibling, k++){ if(sameNode(o,x)){ needed=true; break; } }
    if(m && !needed){ while(o!==m){ const nx=o.nextSibling; if(!isKeep(o)) from.removeChild(o); o=nx; } morphNode(o,n); o=o.nextSibling; }
    else if(m){ from.insertBefore(m,o); morphNode(m,n); }
    else if(needed){ from.insertBefore(n,o); }
    else { const nx=o.nextSibling; from.replaceChild(n,o); o=nx; }
    n=nNext;
  }
  while(o){ const nx=o.nextSibling; if(!isKeep(o)) from.removeChild(o); o=nx; }
}
const morphTpl=document.createElement('template');
/* keep what the user is looking at where it is: the control just tapped, or else the first block on screen */
function anchorBefore(){
  let el = (lastTouch && lastTouch.el.isConnected && performance.now()-lastTouch.at<1500 && document.getElementById('view').contains(lastTouch.el)) ? lastTouch.el : null;
  if(!el){ const kids=document.getElementById('view').children; for(let i=0;i<kids.length;i++){ if(kids[i].getBoundingClientRect().bottom>70){ el=kids[i]; break; } } }
  return el ? {el, top:el.getBoundingClientRect().top} : null;
}
function anchorAfter(a){
  if(!a || !a.el.isConnected) return;
  const d=a.el.getBoundingClientRect().top-a.top;
  if(Math.abs(d)>=1) window.scrollBy(0, d);
}
function setView(html, id){
  id=id||'view';
  if(html===lastHtml && id===lastViewId) return;
  const view=document.getElementById('view');
  if(!lastHtml || id!==lastViewId){ const f=captureFocus(); view.innerHTML=html; restoreFocus(f); }
  else {
    const a=anchorBefore();
    try{ morphTpl.innerHTML=html; morphChildren(view, morphTpl.content); }catch(e){ view.innerHTML=html; }

function logSet(ex, key){
  const C=lastC; if(!C||!C.todayRec||state.readOnly) return;
  const reps=Math.round(ui.reps[key]||0); if(reps<1){ toast('Add at least one rep.'); return; }
  const d=C.today, day=clone(getDay(d)) || {date:d, sets:[]};
  const kg=kgNow(C, ex), rec={ex, reps, t:new Date().toISOString()}; if(kg>0) rec.kg=kg;

  const prevPR=C.prs.length, prevStatus=C.todayRec.status, prevXp=C.todayRec.xp, prevAwards=(C.awards||[]).length, prevCombo=C.todayRec.info.combo||0;
  save('days', d, day);

  const gained=A.todayRec.xp-prevXp;
  const pr=A.prs.length>prevPR, done=A.todayRec.status==='done' && prevStatus!=='done';

  else if(!customDone) SFX.play('set');
  if(done){
    const wait = pr ? Math.max(1.2, SFX.hasCustom('max') ? .22+(SFX.clipLen('max')||2.5) : 0) : (customDone ? 0 : .1);
    setTimeout(()=>FX.leafBurst(), pr?1200:80); SFX.play('complete', wait);
  }
  if(pr && done) toast(`New max and mission complete · ${signed(gained)} XP`);
  else if(pr) toast(`New max: ${reps} ${exName(ex).toLowerCase()}${kg>0?` at +${+kg} kg`:''} · ${signed(gained)} XP`);
  else if(done) toast(`Mission complete · ${signed(gained)} XP`);
  else toast(`${reps} ${exName(ex).toLowerCase()} logged · ${signed(gained)} XP${(A.todayRec.info.combo||0)>prevCombo?` · study combo +${STUDY.combo}`:''}`);
  /* a Friday test with sets still to go: the rest timer starts by itself */

  else if(ui.rest){ ui.rest=null; render(); }

}

document.addEventListener('change', e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  if(el.dataset.act==='import-file'){ const f=el.files && el.files[0]; el.value=''; if(f) readImport(f); return; }
  if(el.dataset.act==='sensei-file'){
    const id=el.dataset.id, sd=SENSEIS[id]; const file=el.files && el.files[0]; el.value=''; if(!file || !sd) return;
    if(state.mode!=='db'){ toast('This phone couldn\'t open its storage. Close the app fully and open it again.'); return; }
    ui.uploading['sen-'+id]=true; render(); toast('Saving picture…');
    shrinkPhoto(file, 1000).then(blob=>uploadAsset(blob,'image/jpeg')).then(res=>{
      const old=media().senseis[id];
      saveMedia(m=>{ m.senseis=Object.assign({}, m.senseis, {[id]:{id:res.id, name:baseName(file)}}); });
      if(old && old.id!==res.id) deleteAsset(old.id);
      toast(`${sd.name}'s picture saved`);
    }).catch(e=>toast(e && e.code ? uploadErrorText(e) : "That picture couldn't be opened. Try a JPEG or PNG."))
    .finally(()=>{ delete ui.uploading['sen-'+id]; render(); });
    return;
  }
  if(el.dataset.act==='ph-then' || el.dataset.act==='ph-now'){ if(el.dataset.act==='ph-then') ui.phThen=el.value; else ui.phNow=el.value; render(); return; }
  if(el.dataset.act==='ph-file'){
    const file=el.files && el.files[0]; el.value=''; if(!file) return;
    if(state.mode!=='db'){ toast('This phone couldn\'t open its storage. Close the app fully and open it again.'); return; }
    const pose=ui.photoPose||'front'; ui.uploading.photo=true; render();
    shrinkPhoto(file, 1600).then(b=>photoSave(b, pose, lastC?lastC.today:todayStr())).then(()=>toast(`${POSES.find(x=>x[0]===pose)[1]} photo saved`))
      .catch(e=>toast(e && e.code ? uploadErrorText(e) : "That photo couldn't be opened. Try a JPEG or PNG."))
      .finally(()=>{ delete ui.uploading.photo; render(); });
    return;
  }
  if(el.dataset.act==='rm-walls'){
    const k=el.dataset.rk, files=Array.from(el.files||[]); el.value=''; if(!files.length) return;
    if(state.mode!=='db'){ toast('This phone couldn\'t open its storage. Close the app fully and open it again.'); return; }
    const room=5-(rankMedia().walls[k]||[]).length, pick=files.slice(0, Math.max(0, room));
    if(!pick.length){ toast('This rank already has 5 wallpapers. Remove one first.'); return; }
    ui.uploading['rmw-'+k]=true; render(); toast(pick.length===1?'Saving wallpaper…':`Saving ${pick.length} wallpapers…`);
    (async()=>{ let n=0; for(const f of pick){ try{ const blob=await shrinkPhoto(f); const res=await uploadAsset(blob,'image/jpeg'); setRankMedia(m=>{ (m.walls[k]=m.walls[k]||[]).push({id:res.id, name:baseName(f)}); }); n++; }catch(e){ toast(e && e.code ? uploadErrorText(e) : "A photo couldn't be opened. Try a JPEG or PNG."); } }
      if(n) toast(n===1?'Wallpaper saved':`${n} wallpapers saved`); if(files.length>pick.length) toast(`Only ${pick.length} fit: a rank holds 5.`); })()
    .finally(()=>{ delete ui.uploading['rmw-'+k]; bgShown=null; render(); });
    return;
  }
  if(el.dataset.act==='rm-char'){
    const k=el.dataset.rk, file=el.files && el.files[0]; el.value=''; if(!file) return;
    if(state.mode!=='db'){ toast('This phone couldn\'t open its storage. Close the app fully and open it again.'); return; }
    ui.uploading['rmch-'+k]=true; render();
    charBlob(file).then(async ({blob, ar})=>{ const res=await uploadAsset(blob,'image/png'); const old=rankMedia().chars[k];
        setRankMedia(m=>{ m.chars[k]={id:res.id, ar, name:baseName(file)}; }); if(old) deleteAsset(old.id); toast('Character saved'); })
      .catch(e=>toast(e && e.code ? uploadErrorText(e) : "That picture couldn't be opened. Try a PNG or JPEG."))
      .finally(()=>{ delete ui.uploading['rmch-'+k]; render(); });
    return;
  }
  if(el.dataset.act==='rm-cine'){
    const k=el.dataset.rk, file=el.files && el.files[0]; el.value=''; if(!file) return;
    if(state.mode!=='db'){ toast('This phone couldn\'t open its storage. Close the app fully and open it again.'); return; }
    const type=(file.type && /^video\//.test(file.type)) ? file.type : (/\.mov$/i.test(file.name||'') ? 'video/quicktime' : 'video/mp4');
    ui.uploading['rmc-'+k]=true; render(); toast('Saving scene…');
    uploadAsset(file, type).then(res=>{ const old=rankMedia().cine[k]; setRankMedia(m=>{ m.cine[k]={id:res.id, name:baseName(file)}; }); if(old && old.id!==res.id) deleteAsset(old.id); toast('Scene saved'); })
    .catch(e=>toast(e && e.code==='too_large' ? 'That video is over 150 MB. Pick a shorter one.' : e && e.code ? uploadErrorText(e) : "That video couldn't be saved."))
    .finally(()=>{ delete ui.uploading['rmc-'+k]; render(); });
    return;
  }
  if(el.dataset.act==='bg-file'){
    const sl=el.dataset.slot, d=(sl==='all'?BG_ALL:BG_SLOTS.find(x=>x.id===sl)); const file=el.files && el.files[0]; el.value=''; if(!file || !d) return;
    if(state.mode!=='db'){ toast('This phone couldn\'t open its storage. Close the app fully and open it again.'); return; }
    if(file.size>60*1024*1024){ toast('That photo is too large. Pick a smaller one.'); return; }
    ui.uploading['bg-'+sl]=true; render(); toast('Saving photo…');
    shrinkPhoto(file).then(blob=>uploadAsset(blob,'image/jpeg')).then(res=>{
      const old=media().bg[sl];
      saveMedia(m=>{ m.bg[sl]={id:res.id, name:baseName(file)}; });
      if(old && old.id!==res.id) deleteAsset(old.id);
      toast(`${d.label} background saved`);
    }).catch(e=>toast(e && e.code ? uploadErrorText(e) : "That photo couldn't be opened. Try a JPEG or PNG."))
    .finally(()=>{ delete ui.uploading['bg-'+sl]; render(); });
    return;
  }
  if(el.dataset.act==='music-files'){
    const fl=el.files; if(!fl || !fl.length) return;
    const arr=Array.from(fl); el.value='';
    Music.add(arr).then(n=>{ if(n) toast(n===1?'Track added':`${n} tracks added`); }).catch(()=>toast("Those files couldn't be added."));
    return;
  }
  if(el.dataset.act==='snd-file'){
    const sl=el.dataset.slot, def=slotDef(sl); if(!def) return;
    const file=el.files && el.files[0]; el.value=''; if(!file) return;
    if(state.mode!=='db'){ toast('This phone couldn\'t open its storage. Close the app fully and open it again.'); return; }
    if(file.size>20*1024*1024){ toast('That file is over 20 MB. Pick a shorter clip.'); return; }
    (async()=>{
      const type=await audioUploadType(file);
      if(!type){ toast("That file type can't be saved. Use an M4A or MP4 file."); return; }
      const buf=await file.arrayBuffer();
      if(!(await SFX.canDecode(buf))){ toast("That file couldn't be played. Try another M4A file."); return; }
      ui.uploading['snd-'+sl]=true; render(); toast('Saving sound…');
      try{
        const res=await uploadAsset(new Blob([type==='video/mp4'?normalizeMp4(buf):buf],{type}), type);
        const old=media().sounds[sl];
        SFX.setBuffer(sl, res.id, buf);
        saveMedia(m=>{ m.sounds[sl]={id:res.id, name:baseName(file)}; });
        if(old && old.id!==res.id) deleteAsset(old.id);
        toast(`${def.label}: sound saved`); SFX.play(sl);
      }catch(e){ toast(uploadErrorText(e)); }
      finally{ delete ui.uploading['snd-'+sl]; render(); }
    })().catch(()=>toast("That file couldn't be read."));
    return;
  }
  if(el.dataset.act==='plan-day'){
    const k=Number(el.dataset.k), v=el.value;
    ui.draft.plan[k] = v.startsWith('gtg:') ? {type:'gtg', ex:v.slice(4)} : v.startsWith('combo:') ? {type:'combo', exs:v.slice(6).split(',')} : {type:v};
    render();
  } else if(el.dataset.act==='test-ex'){
    const id=el.dataset.ex, list=ui.draft.test.ex;
    ui.draft.test.ex = el.checked ? Array.from(new Set(list.concat([id]))) : list.filter(x=>x!==id);
    render();
  }
});

/* anything that writes to "today" must mean the real today. If midnight passed while the page sat open, the page still
   shows yesterday's mission: show the new day instead of writing into a day that is closed. */
const DAY_BOUND=/^(log|undo|weigh-save|plan-save|add-ex|setup-save|jutsu-learn|st-|exam-|examc-|prog-)/;
function dayRolled(){
