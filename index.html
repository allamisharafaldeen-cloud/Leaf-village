<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Leaf Village</title>
<meta name="description" content="Sharaf's training and study tracker.">
<meta name="theme-color" content="#e9eee1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c140f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Leaf Village">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: single-column phone app, mission scroll as the hero, fixed bottom tab bar */
:root{
  --paper:#e9eee1; --card:#f7f9f2; --ink:#17211a; --muted:#566659; --line:#cfd9c7;
  --leaf:#2b6a3c; --leaf-soft:#d6e6d0; --chakra:#d9510b; --chakra-2:#f08c00; --chakra-soft:#fae1cf; --glow:rgba(217,81,11,.28);
  --on-chakra:#ffffff; --seal:#c22f2b; --danger:#b3261e; --danger-soft:#f6dad6; --rest:#46658a; --rest-soft:#dbe4ef;
  --primary:#2b6a3c; --primary-soft:#d6e6d0; --chakra-ink:#b8440a; --bg-a:#dfeadb; --bg-b:#e9eee1; --panel:#2a352c;
  --scrim:rgba(14,22,16,.62); --rod:#3b2a1c;
  --on-image:#ffffff; --on-image-muted:rgba(255,255,255,.78); --glass:rgba(8,12,10,.58); --shade:rgba(6,10,8,.86); --shade-mid:rgba(6,10,8,.34);
  --card-glass:rgba(247,249,242,.74); --paper-glass:rgba(233,238,225,.6);
  --study:#2f6fb0; --study-soft-ink:#9bbbd9; --exam:#7b4bb3;
  --f-display:"Dela Gothic One","Arial Black","Hiragino Kaku Gothic StdN",sans-serif;
  --f-body:"Zen Kaku Gothic New",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-data:"Chakra Petch",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0c140f; --card:#141f18; --ink:#e5ede1; --muted:#93a597; --line:#253529;
    --leaf:#72c07a; --leaf-soft:#1b3121; --chakra:#ff8a3d; --chakra-2:#ffc247; --chakra-soft:#3a2315; --glow:rgba(255,138,61,.38);
    --on-chakra:#1c0e04; --seal:#ff6b5e; --danger:#ff7a6b; --danger-soft:#3a1c19; --rest:#8fb1d8; --rest-soft:#1a2737; --primary:#72c07a; --primary-soft:#1b3121; --chakra-ink:#ff8a3d; --card-glass:rgba(20,31,24,.68); --paper-glass:rgba(12,20,15,.55); --study:#7fb3ea; --study-soft-ink:#3d5f80; --exam:#9b6fd6; --bg-a:#13241a; --bg-b:#0c140f; --panel:#6d7f71;
    --scrim:rgba(0,0,0,.7); --rod:#c9a77c; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0c140f; --card:#141f18; --ink:#e5ede1; --muted:#93a597; --line:#253529;
  --leaf:#72c07a; --leaf-soft:#1b3121; --chakra:#ff8a3d; --chakra-2:#ffc247; --chakra-soft:#3a2315; --glow:rgba(255,138,61,.38);
  --on-chakra:#1c0e04; --seal:#ff6b5e; --danger:#ff7a6b; --danger-soft:#3a1c19; --rest:#8fb1d8; --rest-soft:#1a2737; --primary:#72c07a; --primary-soft:#1b3121; --chakra-ink:#ff8a3d; --card-glass:rgba(20,31,24,.68); --paper-glass:rgba(12,20,15,.55); --study:#7fb3ea; --study-soft-ink:#3d5f80; --exam:#9b6fd6; --bg-a:#13241a; --bg-b:#0c140f; --panel:#6d7f71;
  --scrim:rgba(0,0,0,.7); --rod:#c9a77c; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background:var(--paper); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px));
}
.bgfx{position:fixed; inset:0; z-index:0; pointer-events:none; background:linear-gradient(180deg,var(--bg-a) 0%,var(--paper) 52%,var(--bg-b) 100%)}
.bgfx canvas{position:absolute; inset:0; width:100%; height:100%; opacity:.85}
.bgphoto{position:absolute; inset:0; background-size:cover; background-position:center; background-repeat:no-repeat; opacity:0; transition:opacity .5s ease}
.bgphoto.on{opacity:1}
.bgveil{position:absolute; inset:0; background:var(--paper); opacity:0; transition:opacity .5s ease}
body.has-bg .topbar{background:var(--card); border:2px solid var(--panel); box-shadow:3px 3px 0 var(--panel); border-radius:12px; padding:8px 14px}
body.has-bg .xpbar{background:var(--card); border:2px solid var(--panel); box-shadow:3px 3px 0 var(--panel); border-radius:12px; padding:10px 12px}
body.has-bg .wrap > p{background:var(--card); border-radius:10px; padding:8px 12px; margin:0 !important}
body.has-bg .btn.ghost{background:var(--card)}
body.has-bg .loading{background:var(--card); border-radius:14px}
.fxtop{position:fixed; inset:0; width:100%; height:100%; z-index:41; pointer-events:none}
#banner{position:relative; z-index:1}
.theme-shift body,.theme-shift .card,.theme-shift .tile,.theme-shift .tabs,.theme-shift .scroll,.theme-shift .btn{transition:background-color .9s ease,color .9s ease,border-color .9s ease,box-shadow .9s ease}
button,input,select{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--chakra); outline-offset:2px; border-radius:8px}
.wrap{position:relative; z-index:1; max-width:560px; margin:0 auto; padding-block:14px 112px; display:flex; flex-direction:column; gap:18px}
h1,h2,h3{margin:0; text-wrap:balance}
h2{font-family:var(--f-display); font-weight:400; font-size:19px; letter-spacing:.01em}
.eyebrow{font-family:var(--f-data); font-weight:600; font-size:11.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
.muted{color:var(--muted)}
.num{font-family:var(--f-data); font-variant-numeric:tabular-nums}
.card{background:var(--card); border:2px solid var(--panel); border-radius:12px; box-shadow:3px 3px 0 var(--panel); padding:16px; display:flex; flex-direction:column; gap:12px; min-width:0}
.section-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px}
.banner{max-width:560px; margin:10px auto 0; padding:10px 14px; border-radius:12px; background:var(--chakra-soft); color:var(--ink); font-size:13.5px; border:1px solid var(--line)}
.banner.err{background:var(--danger-soft)}

/* ninja header */
.ninja{display:grid; grid-template-columns:auto 1fr auto; gap:14px; align-items:center}
.portrait{display:block; border-radius:50%; overflow:hidden; flex:none; background:var(--card); box-shadow:0 0 0 3px var(--card),0 0 0 5.5px var(--rk)}
.portrait svg,.portrait img{display:block; width:100%; height:100%; object-fit:cover}
.ninja-name{font-family:var(--f-display); font-size:24px; line-height:1.1}
.rankname{font-family:var(--f-data); font-weight:700; font-size:14px; letter-spacing:.06em; text-transform:uppercase; color:var(--rk)}
.streak{display:flex; flex-direction:column; align-items:center; min-width:58px; padding:6px 8px; border-radius:14px; background:var(--chakra-soft)}
.streak svg{width:22px; height:22px}
.streak b{font-family:var(--f-data); font-size:22px; line-height:1}
.streak span{font-size:10.5px; color:var(--muted); letter-spacing:.06em; text-transform:uppercase}
.streak.cold{background:var(--line)}
.xpbar{display:flex; flex-direction:column; gap:6px}
.xptrack{height:14px; border-radius:7px; background:var(--card); border:2px solid var(--panel); overflow:hidden}
.xpfill{height:100%; border-radius:6px; background:linear-gradient(90deg,var(--primary),var(--chakra)); transition:width .6s ease}
.xprow{display:flex; justify-content:space-between; gap:10px; font-size:13px; color:var(--muted)}
.xprow b{color:var(--ink); font-family:var(--f-data)}

/* hanging mission scroll */
.mscroll{position:relative; display:flex; flex-direction:column; margin-inline:14px}
.ms-rod,.ms-roll{all:unset; box-sizing:border-box; position:relative; display:block; cursor:pointer; -webkit-tap-highlight-color:transparent; z-index:2}
.ms-rod:focus-visible,.ms-roll:focus-visible{outline:3px solid var(--chakra); outline-offset:3px; border-radius:12px}
.ms-rod{height:22px; margin-inline:-8px; border-radius:11px; box-shadow:3px 4px 0 rgba(0,0,0,.2); background:linear-gradient(180deg,#8a5a34 0%,#c99464 32%,#9a6a40 60%,#5a361c 100%)}
.cap{position:absolute; top:50%; width:16px; height:30px; margin-top:-15px; border-radius:6px; background:linear-gradient(180deg,#2b1a0e 0%,#6b4426 38%,#3a2414 70%,#1d1108 100%)}
.cap.l{left:-13px} .cap.r{right:-13px}
.ms-paper-wrap{display:grid; grid-template-rows:0fr; margin-top:-3px; transition:grid-template-rows .8s cubic-bezier(.45,.05,.2,1)}
.mscroll.open .ms-paper-wrap{grid-template-rows:1fr}
.ms-paper-clip{min-height:0; overflow:hidden}
.ms-paper{--ink:#1f1b14; --muted:#5f574a; --line:#d8ccb0; --card:#fffaf0; --paper:#efe4c9; --paper-glass:#efe4c9; --leaf:#2b6a3c; --leaf-soft:#dbe7cf; --panel:#2a241a; --chakra-ink:#9a3b0d; --seal:#b8322c;
  position:relative; color:var(--ink); padding:0 16px;
  background:radial-gradient(120% 70% at 50% 40%, #fbf6e8 0%, #f4ead1 70%, #eadcb8 100%);
  box-shadow:inset 0 10px 12px -10px rgba(0,0,0,.35), inset 0 -10px 12px -10px rgba(0,0,0,.3), 4px 4px 0 rgba(0,0,0,.18)}
.ms-paper::before,.ms-paper::after{content:""; position:absolute; top:0; bottom:0; width:16px; background:repeating-linear-gradient(45deg,#2c5737 0 6px,#36683f 6px 12px); box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.ms-paper::before{left:0} .ms-paper::after{right:0}
.zig{height:20px; margin-inline:-16px; background-color:#b8322c; background-image:linear-gradient(135deg,#f2b33d 25%,transparent 25%),linear-gradient(225deg,#f2b33d 25%,transparent 25%); background-size:20px 20px; border-top:3px solid #7a1d17; border-bottom:3px solid #7a1d17; position:relative; z-index:1}
.zig.flip{transform:scaleY(-1)}
.ms-inner{position:relative; padding:20px 14px 18px; display:flex; flex-direction:column; gap:14px}
.ms-inner .seal{top:18px; right:12px}
.ms-roll{height:86px; margin-top:-4px; margin-inline:-4px; transition:height .8s cubic-bezier(.45,.05,.2,1)}
.mscroll.open .ms-roll{height:24px}
.roll-wood{position:absolute; inset:0; border-radius:12px; box-shadow:3px 4px 0 rgba(0,0,0,.2); background:linear-gradient(180deg,#8a5a34 0%,#c99464 32%,#9a6a40 60%,#5a361c 100%)}
.roll-paper{position:absolute; inset:0; border-radius:16px; overflow:hidden; box-shadow:3px 5px 0 rgba(0,0,0,.2); background:linear-gradient(180deg,#bcae8a 0%,#efe4c9 22%,#fbf6e8 48%,#eadcb8 76%,#a8987a 100%); transition:opacity .45s ease .25s}
.mscroll.open .roll-paper{opacity:0; transition-delay:0s}
.roll-band{position:absolute; top:0; bottom:0; width:12%; background:linear-gradient(180deg,#152c1b 0%,#3f7a4f 30%,#2c5a39 68%,#112417 100%)}
.roll-band.l{left:0} .roll-band.r{right:0}
.roll-cord{position:absolute; top:0; bottom:0; left:19%; width:9px; background:linear-gradient(90deg,#6e1510,#d4483c 50%,#6e1510); box-shadow:13px 0 0 -2px #a7281f}
.roll-label{position:absolute; top:0; bottom:0; left:calc(19% + 34px); right:14%; display:flex; align-items:center; gap:10px; color:#1f1b14; min-width:0}
.roll-label > span:last-child{min-width:0}
.roll-seal svg{width:18px; height:18px}
.roll-seal{flex:none; width:38px; height:38px; border:3px solid #b8322c; border-radius:7px; color:#b8322c; display:grid; place-items:center; font-family:var(--f-display); font-size:19px; line-height:1; transform:rotate(-8deg)}
.roll-label b{display:block; font-family:var(--f-display); font-weight:400; font-size:17px; line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.roll-label small{display:block; margin-top:3px; font-size:12px; color:#5f574a}
.mscroll.done .roll-label small{color:#2b6a3c; font-weight:700}
.mscroll.done .roll-seal{border-color:#2b6a3c; color:#2b6a3c}
.mscroll.no-anim *{transition:none !important}
.mscroll:not(.open) .ms-roll{animation:rollnudge 3.5s ease-in-out 1s 2}
@keyframes rollnudge{0%,100%{transform:translateY(0)}6%{transform:translateY(3px)}12%{transform:translateY(0)}}

/* senseis */
.sensei-card{display:flex; align-items:flex-end; gap:12px; min-width:0}
.sensei-talk{all:unset; flex:none; cursor:pointer; border-radius:50%}
.sensei-talk:focus-visible{outline:3px solid var(--chakra); outline-offset:3px}
.sensei-talk:active .sensei-av{transform:scale(.94)}
.sensei-av{flex:none; display:grid; place-items:center; border-radius:50%; border:3px solid var(--sc); background-color:var(--card); background-repeat:no-repeat; box-shadow:0 0 0 2px var(--card),3px 3px 0 var(--panel); font-family:var(--f-display); font-size:22px; color:var(--sc); transition:transform .15s}
.bubble{position:relative; flex:1; min-width:0; background:var(--card); border:2px solid var(--panel); border-radius:14px 14px 14px 4px; padding:10px 13px 11px; box-shadow:3px 3px 0 var(--panel); animation:bubblein .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes bubblein{from{opacity:0; transform:translateY(6px) scale(.96)}}
.bubble-name{display:flex; align-items:center; gap:6px; font-family:var(--f-data); font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.bubble-name i{width:9px; height:9px; border-radius:50%; background:var(--sc)}
.bubble p{margin:3px 0 0; font-size:14.5px; line-height:1.42}
body.has-bg .bubble{background:var(--card-glass); -webkit-backdrop-filter:blur(16px) saturate(1.3); backdrop-filter:blur(16px) saturate(1.3)}
.sensei-row{display:flex; flex-direction:column; gap:9px; padding-top:12px; border-top:1px dashed var(--line)}
.sensei-head{display:flex; align-items:center; gap:12px; min-width:0}
.sensei-head b{display:block; font-size:15.5px}
.sensei-head span{display:block; font-size:12.5px; color:var(--muted)}
.chal{display:flex; flex-direction:column; gap:5px; padding:10px 12px; border-radius:10px; background:var(--paper); border-left:4px solid var(--sc)}
body.has-bg .chal{background:var(--paper-glass)}
.chal-top{display:flex; justify-content:space-between; gap:8px; align-items:baseline}
.chal-top b{font-size:14px}
.chal-top span{font-weight:700; font-size:13px; color:var(--chakra-ink)}
.chal-desc{font-size:12.5px; color:var(--muted)}
.chal-bar{height:8px; border-radius:4px; background:var(--line); overflow:hidden}
.chal-bar i{display:block; height:100%; border-radius:4px; background:var(--sc); transition:width .5s ease}
.chal.won .chal-top span{color:var(--leaf)}

/* study scroll (blue library paper) */
.mscroll.study .ms-paper{--ink:#16202b; --muted:#4f5d6c; --line:#c9d5e1; --card:#f7fafd; --paper:#e3ecf4; --paper-glass:#e3ecf4; --chakra-ink:#24598f; --seal:#24598f;
  background:radial-gradient(120% 70% at 50% 40%, #f6f9fc 0%, #e8eff6 70%, #d6e2ee 100%)}
.mscroll.study .ms-paper::before,.mscroll.study .ms-paper::after{background:repeating-linear-gradient(45deg,#203a59 0 6px,#2b4b70 6px 12px)}
.mscroll.study .zig{background-color:#2b4b70; background-image:linear-gradient(135deg,#c9d6e3 25%,transparent 25%),linear-gradient(225deg,#c9d6e3 25%,transparent 25%); border-color:#16283e}
.mscroll.study .roll-paper{background:linear-gradient(180deg,#9fb0c2 0%,#e3ecf4 22%,#f6f9fc 48%,#d6e2ee 76%,#8fa1b4 100%)}
.mscroll.study .roll-band{background:linear-gradient(180deg,#0f1d2e 0%,#35587f 30%,#25466b 68%,#0c1828 100%)}
.mscroll.study .roll-cord{background:linear-gradient(90deg,#4c6a8a,#b9c9da 50%,#4c6a8a); box-shadow:13px 0 0 -2px #7f98b2}
.mscroll.study .roll-seal{border-color:#24598f; color:#24598f}
.mscroll.study.done .roll-seal{border-color:#2b6a3c; color:#2b6a3c}
.mscroll.study .btn.chakra-btn{background:#24598f; color:#fff; box-shadow:0 6px 18px rgba(36,89,143,.3)}
.mscroll.study .xp-chip.pos{color:#24598f}
.mscroll.study .complete-badge{background:#24598f}
.hokage-line{display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:12px; background:rgba(255,255,255,.55); border:1px solid var(--line)}
.hokage-line p{margin:0; font-size:14px; line-height:1.4}
.hokage-line .sensei-av{box-shadow:none; border-width:2px; font-size:16px}
.scols{display:grid; grid-template-columns:repeat(var(--n),minmax(0,1fr)); gap:6px; align-items:end}
.scol{position:relative; display:block; height:58px; border-radius:7px; background:#cfdbe7; overflow:hidden; border:1.5px solid #b3c4d6}
.scol::after{content:""; position:absolute; left:0; right:0; bottom:0; height:calc(var(--f)*100%); background:linear-gradient(0deg,#1f4e80,#4d8ccc); transition:height .5s ease}
.scol.need{box-shadow:4px 0 0 -1px var(--ink)}
.stimer{display:flex; flex-direction:column; gap:8px; align-items:flex-start; padding:12px; border-radius:12px; background:rgba(255,255,255,.6); border:1.5px solid var(--line)}
.stimer b[data-timer]{font-family:var(--f-data); font-size:40px; line-height:1; color:#1f4e80}
.stimer.run{border-color:#4d8ccc; box-shadow:0 0 0 3px rgba(77,140,204,.18)}
.stimer.check{border-color:var(--seal); background:#fdf3e8}
.stimer.check span{font-size:13px; color:var(--muted)}
.study-start{width:100%}
.btnrow.quick .btn{flex:1}
.shield-btn{display:inline-flex; align-items:center; gap:8px; align-self:flex-start}
.shield-btn svg,.deadline svg,.sc-cell svg{width:14px; height:14px; vertical-align:-2px}
.shield-btn.warn{border-color:var(--seal); color:var(--seal)}
/* combo: set ready */
.ready-pill{position:absolute; right:10px; top:-12px; z-index:3; display:inline-flex; align-items:center; gap:6px; padding:5px 11px; border-radius:999px; background:#24598f; color:#fff; font-family:var(--f-data); font-weight:700; font-size:12px; letter-spacing:.06em; text-transform:uppercase; box-shadow:0 0 0 2px var(--card),0 0 16px rgba(77,140,204,.8); animation:readyglow 1.8s ease-in-out infinite}
@keyframes readyglow{50%{box-shadow:0 0 0 2px var(--card),0 0 4px rgba(77,140,204,.4)}}
.mscroll.ready .ms-roll,.mscroll.ready .ms-top{box-shadow:0 0 18px rgba(77,140,204,.75)}
/* study streak badge + exam */
.sstreak{position:absolute; top:94px; right:14px; z-index:4; display:flex; align-items:center; gap:4px; padding:4px 8px; border-radius:10px; background:var(--glass); color:var(--on-image); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px)}
.sstreak svg{width:16px; height:16px}
.sstreak b{font-family:var(--f-data); font-size:16px; line-height:1}
.sstreak span{font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--on-image-muted)}
.sstreak.cold{opacity:.75}
.exam-banner{display:flex; flex-direction:column; gap:2px; padding:11px 14px; border-radius:12px; background:var(--exam); color:#fff; border:2px solid var(--panel); box-shadow:3px 3px 0 var(--panel)}
.exam-banner b{font-family:var(--f-display); font-weight:400; font-size:17px}
.exam-banner span{font-size:13px; opacity:.92}
.dot.exam{background:var(--exam); border-color:var(--exam); color:#fff}
/* study stats */
.stats-mode{display:flex; gap:8px}
.stats-mode .chip{flex:1; padding:9px 12px; font-size:14px}
.study-tile .big{color:var(--study)}
.month-nav{display:flex; gap:6px}
.month-nav .chip{padding:4px 12px; font-size:16px}
.month-nav .chip:disabled{opacity:.35}
.scal{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:5px}
.sc-h{text-align:center; font-family:var(--f-data); font-size:11px; color:var(--muted)}
.sc-cell{position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:46px; border-radius:9px; background:var(--paper); border:1.5px solid var(--line); overflow:hidden}
.sc-cell::before{content:""; position:absolute; left:0; right:0; bottom:0; height:calc(var(--f)*100%); background:var(--study); opacity:.28}
.sc-cell b{position:relative; font-family:var(--f-data); font-size:13px}
.sc-cell small{position:relative; font-family:var(--f-data); font-size:10.5px; color:var(--muted); min-height:12px}
.sc-cell em{position:absolute; top:1px; right:4px; font-style:normal; font-weight:700; color:var(--danger)}
.sc-cell svg{position:absolute; top:3px; right:3px; color:var(--study)}
.sc-cell.blank{background:transparent; border:0}
.sc-cell.done{border-color:var(--study)}
.sc-cell.done::before{opacity:.45}
.sc-cell.missed{border-color:var(--danger); background:var(--danger-soft)}
.sc-cell.rest{background:var(--rest-soft); border-color:var(--rest)}
.sc-cell.exam{background:var(--exam); border-color:var(--exam)}
.sc-cell.exam b,.sc-cell.exam small{color:#fff}
.sc-cell.shield{border-style:dashed; border-color:var(--study)}
.sc-cell.future,.sc-cell.before{opacity:.45}
.sc-cell.today{outline:2px solid var(--chakra); outline-offset:1px}
.lg-shield{border:1.5px dashed var(--study); background:transparent!important}
.yr{display:flex; flex-direction:column; gap:4px; overflow-x:auto}
.yr-row{display:grid; grid-template-columns:30px 1fr; gap:6px; align-items:center}
.yr-row span{font-family:var(--f-data); font-size:10.5px; color:var(--muted)}
.yr-row div{display:grid; grid-template-columns:repeat(31,minmax(0,1fr)); gap:2px}
.yr-row i{display:block; aspect-ratio:1; border-radius:2px; background:var(--line); min-width:0}
.yr-row i.done,.yr-row i.open,.yr-row i.shield{background:color-mix(in srgb, var(--study) calc(var(--f)*100%), var(--line))}
.yr-row i.missed{background:var(--danger)}
.yr-row i.rest{background:var(--rest-soft)}
.yr-row i.exam{background:var(--exam)}

/* glass over photos */
body.has-bg .card,body.has-bg .tile,body.has-bg .scroll,body.has-bg .topbar,body.has-bg .xpbar,body.has-bg .wrap > p,body.has-bg .player-inner,body.has-bg .tabs{background:var(--card-glass); -webkit-backdrop-filter:blur(16px) saturate(1.3); backdrop-filter:blur(16px) saturate(1.3)}
body.has-bg .test-ex,body.has-bg .mini,body.has-bg .sc,body.has-bg .snd-now,body.has-bg .track,body.has-bg .empty,body.has-bg .check,body.has-bg .theme-sw.locked,body.has-bg .slot{background:var(--paper-glass)}
body.has-bg .btn.ghost{background:var(--card-glass)}
.window{flex:none; height:clamp(120px,24vh,240px)}
.peek-btn{flex:none; width:40px; height:40px; border-radius:50%; border:2px solid var(--panel); background:var(--card); color:var(--ink); display:grid; place-items:center; box-shadow:2px 2px 0 var(--panel)}
.peek-btn svg{width:20px; height:20px}
.wrap,.tabs,.player,#banner{transition:opacity .35s ease}
body.peek .wrap,body.peek .tabs,body.peek .player,body.peek #banner{opacity:0; pointer-events:none}
body.peek{cursor:pointer}
.peekhint{position:fixed; left:50%; bottom:calc(26px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); z-index:30; background:var(--glass); color:var(--on-image); padding:9px 16px; border-radius:999px; font-size:13px; font-weight:700; opacity:0; pointer-events:none; transition:opacity .35s ease; -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); white-space:nowrap}
body.peek .peekhint{opacity:1}

/* living character stage */
.stage{position:relative; height:clamp(290px,50vh,460px); border-radius:16px; overflow:hidden; border:3px solid var(--panel); box-shadow:4px 4px 0 var(--panel); background:var(--ink); isolation:isolate; max-width:100%}
body.has-bg .stage{background:transparent; border-color:transparent; box-shadow:none}
.stage-back{position:absolute; inset:-24px; background-size:cover; background-position:center 25%; filter:blur(7px) saturate(1.1); opacity:.92}
.stage::after{content:""; position:absolute; inset:0; z-index:3; pointer-events:none; background:linear-gradient(to top,var(--shade) 0%,var(--shade-mid) 30%,transparent 56%)}
body.has-bg .stage::after{background:linear-gradient(to top,var(--shade-mid) 0%,transparent 42%)}
.aura{position:absolute; left:50%; bottom:-18%; width:118%; aspect-ratio:1; z-index:1; pointer-events:none; transform:translateX(-50%) scale(calc(.5 + .6*var(--power))); opacity:calc(.22 + .55*var(--power))}
.aura span{position:absolute; inset:0; border-radius:50%; background:radial-gradient(circle,var(--aura) 0%,transparent 62%); animation:aurapulse 3.2s ease-in-out infinite}
@keyframes aurapulse{0%,100%{opacity:1}50%{opacity:.6}}
.char-wrap{position:absolute; inset:0; z-index:2; transform-origin:50% 100%; animation:breathe 4.6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-5px) scale(1.012)}}
.char,.char-glow{position:absolute; bottom:0; left:50%; height:94%; max-width:100%; aspect-ratio:var(--ar)}
.char{transform:translateX(-50%); object-fit:contain; object-position:center bottom}
.char-glow-wrap{position:absolute; inset:0; opacity:calc(.3 + .65*var(--power))}
.char-glow{transform:translateX(-50%) scale(1.04); transform-origin:50% 100%; background:var(--aura); -webkit-mask-size:contain; mask-size:contain; -webkit-mask-position:center bottom; mask-position:center bottom; -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat; filter:blur(calc(5px + 9px*var(--power))); animation:aurapulse 2.6s ease-in-out infinite}
.spark{position:absolute; bottom:10%; left:var(--x); z-index:2; width:5px; height:5px; border-radius:50%; background:var(--aura); box-shadow:0 0 8px 2px var(--aura); opacity:0; animation:rise var(--t) ease-out infinite; animation-delay:var(--d); pointer-events:none}
@keyframes rise{0%{transform:translateY(0) scale(1); opacity:0}15%{opacity:.95}100%{transform:translateY(-190px) scale(.3); opacity:0}}
.ring{position:absolute; left:50%; top:55%; width:44px; height:44px; margin:-22px 0 0 -22px; border-radius:50%; border:3px solid var(--aura); opacity:0; z-index:3; pointer-events:none}
.stage.powerup .char{animation:flex .7s cubic-bezier(.2,1.5,.4,1)}
@keyframes flex{0%{transform:translateX(-50%) scale(1); filter:none}35%{transform:translateX(-50%) scale(1.07); filter:brightness(1.35)}100%{transform:translateX(-50%) scale(1); filter:none}}
.stage.powerup .char-glow-wrap{animation:glowflash .9s ease-out}
@keyframes glowflash{0%{opacity:1; filter:brightness(1.8)}100%{}}
.stage.powerup .ring{animation:ringout .85s ease-out}
@keyframes ringout{0%{opacity:.95; transform:scale(.4)}100%{opacity:0; transform:scale(7)}}
.xp-float{position:absolute; left:50%; top:36%; z-index:5; transform:translateX(-50%); font-family:var(--f-display); font-size:30px; line-height:1; color:var(--on-image); text-shadow:0 2px 14px var(--aura),0 0 3px rgba(0,0,0,.8); pointer-events:none; white-space:nowrap; animation:xpfloat 1.25s ease-out forwards}
@keyframes xpfloat{0%{opacity:0; transform:translate(-50%,12px) scale(.8)}20%{opacity:1; transform:translate(-50%,0) scale(1.06)}100%{opacity:0; transform:translate(-50%,-64px) scale(1)}}
.stage-text{position:absolute; left:16px; right:16px; bottom:14px; z-index:4; color:var(--on-image)}
.stage-text .eyebrow{color:var(--on-image-muted)}
.stage .ninja-name{color:var(--on-image); font-size:28px; text-shadow:0 2px 10px rgba(0,0,0,.5)}
.stage .streak{position:absolute; top:10px; right:10px; z-index:4; background:var(--glass); color:var(--on-image); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px)}
.stage .streak span{color:var(--on-image-muted)}
.charged-pill{display:inline-flex; align-items:center; margin:6px 0 0 6px; padding:4px 10px; border-radius:999px; background:var(--aura); color:#14110a; font-family:var(--f-data); font-weight:700; font-size:12px; letter-spacing:.08em; text-transform:uppercase; box-shadow:0 0 14px var(--aura)}

/* rank hero */
.hero{position:relative; display:block; border-radius:14px; overflow:hidden; aspect-ratio:16/10; max-width:100%; background:var(--ink); border:3px solid var(--panel); box-shadow:4px 4px 0 var(--panel)}
.hero img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.hero::after{content:""; position:absolute; inset:0; background:linear-gradient(to top, var(--shade) 0%, var(--shade-mid) 40%, transparent 66%); pointer-events:none}
.hero-text{position:absolute; left:16px; right:16px; bottom:14px; z-index:1; color:var(--on-image)}
.hero .eyebrow{color:var(--on-image-muted)}
.hero .ninja-name{color:var(--on-image); font-size:28px; text-shadow:0 2px 10px rgba(0,0,0,.45)}
.rank-pill{display:inline-flex; align-items:center; gap:7px; margin-top:6px; padding:4px 11px 4px 9px; border-radius:999px; background:var(--glass); color:var(--on-image); font-family:var(--f-data); font-weight:700; font-size:12.5px; letter-spacing:.08em; text-transform:uppercase; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px)}
.rank-pill i{width:9px; height:9px; border-radius:50%; background:var(--rk); box-shadow:0 0 0 2px var(--on-image-muted)}
.hero .streak{position:absolute; top:10px; right:10px; z-index:1; background:var(--glass); color:var(--on-image); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px)}
.hero .streak span{color:var(--on-image-muted)}

/* mission scroll */
.scroll{position:relative; background:var(--card); border-left:2px solid var(--panel); border-right:2px solid var(--panel); box-shadow:4px 4px 0 var(--panel); padding:26px 18px 22px; display:flex; flex-direction:column; gap:14px; margin-inline:6px; transform:rotate(-.5deg)}
.scroll::before,.scroll::after{content:""; position:absolute; left:-8px; right:-8px; height:12px; border-radius:6px; background:var(--rod)}
.scroll::before{top:-6px} .scroll::after{bottom:-6px}
.seal{position:absolute; top:22px; right:16px; width:56px; height:56px; border:3px solid var(--seal); border-radius:9px; color:var(--seal); display:grid; place-items:center; transform:rotate(-8deg); font-family:var(--f-display); font-size:30px; line-height:1}
.seal small{position:absolute; bottom:-18px; font-family:var(--f-data); font-size:9.5px; letter-spacing:.1em; font-weight:700}
.mission-title{font-family:var(--f-display); font-size:27px; line-height:1.1; padding-right:72px}
.mission-sub{color:var(--muted); font-size:14px; max-width:46ch; padding-right:60px}
.chakra{display:flex; gap:6px}
.chakra i{flex:1; height:14px; border-radius:7px; background:var(--line); position:relative}
.chakra i.need::after{content:""; position:absolute; right:-4px; top:-5px; bottom:-5px; width:2px; border-radius:1px; background:var(--ink); opacity:.5}
.chakra i.on{background:linear-gradient(90deg,var(--chakra),var(--chakra-2),var(--chakra)); background-size:200% 100%; box-shadow:0 0 12px var(--glow); animation:flow 2.4s linear infinite}
@keyframes flow{to{background-position:-200% 0}}
.chakra-note{display:flex; justify-content:space-between; font-size:13px; color:var(--muted); gap:8px}
.chakra-note b{color:var(--ink)}
.logger{display:flex; flex-direction:column; gap:12px; align-items:stretch}
.stepper{display:flex; align-items:center; justify-content:center; gap:18px}
.stepper button{width:52px; height:52px; border-radius:50%; border:1.5px solid var(--line); background:var(--paper); font-size:26px; line-height:1; display:grid; place-items:center}
.stepper button:active{transform:scale(.94)}
.stepper .val{min-width:96px; text-align:center}
.stepper .val b{display:block; font-family:var(--f-data); font-size:44px; line-height:1}
.stepper .val span{font-size:12px; color:var(--muted); letter-spacing:.08em; text-transform:uppercase}
.btn{border:0; border-radius:14px; padding:14px 18px; font-weight:700; font-size:16px; background:var(--ink); color:var(--paper)}
.btn.chakra-btn{background:var(--chakra); color:var(--on-chakra); box-shadow:0 6px 18px var(--glow)}
.btn.chakra-btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent; color:var(--ink); border:1.5px solid var(--line)}
.btn.small{padding:9px 14px; font-size:14px; border-radius:11px}
.btn:disabled{opacity:.45; cursor:not-allowed; box-shadow:none}
.sets{display:flex; flex-wrap:wrap; gap:8px; list-style:none; margin:0; padding:0}
.sets li{display:flex; align-items:baseline; gap:6px; padding:6px 11px; border-radius:999px; background:var(--leaf-soft); font-size:13px}
.sets li b{font-family:var(--f-data); font-size:15px}
.sets li.under{background:var(--line)}
.sets li time{color:var(--muted); font-family:var(--f-data); font-size:11.5px}
.today-line{display:flex; justify-content:space-between; align-items:center; gap:10px; padding-top:10px; border-top:1px dashed var(--line); flex-wrap:wrap}
.xp-chip{font-family:var(--f-data); font-weight:700; font-size:15px}
.xp-chip.pos{color:var(--leaf)} .xp-chip.neg{color:var(--danger)}
.linkbtn{background:none; border:0; padding:4px 0; color:var(--muted); text-decoration:underline; text-underline-offset:3px; font-size:13px}
.linkbtn.warn{color:var(--danger); font-weight:700}
.deadline{font-size:12.5px; color:var(--muted)}
.complete-badge{display:inline-flex; align-items:center; gap:6px; align-self:flex-start; padding:5px 12px; border-radius:999px; background:var(--leaf); color:var(--card); font-family:var(--f-data); font-weight:700; font-size:13px; letter-spacing:.06em; text-transform:uppercase}
.test-ex{display:flex; flex-direction:column; gap:10px; padding:12px; border-radius:12px; background:var(--paper)}
.test-ex header{display:flex; justify-content:space-between; align-items:baseline; gap:8px}
.test-ex header b{font-size:16px}
.combo-ex header{flex-wrap:wrap}
.combo-ex header b{white-space:nowrap}
.slots{display:grid; grid-template-columns:repeat(2,1fr); gap:8px}
.slot{border:1.5px dashed var(--line); border-radius:10px; padding:8px 10px; display:flex; justify-content:space-between; align-items:baseline; gap:6px; font-size:13px; color:var(--muted)}
.slot.filled{border-style:solid; border-color:var(--leaf); color:var(--ink); background:var(--card)}
.slot.filled b{font-family:var(--f-data); font-size:20px}
.pr{font-family:var(--f-data); font-size:10.5px; font-weight:700; padding:2px 6px; border-radius:5px; background:var(--chakra); color:var(--on-chakra); letter-spacing:.06em}

/* week strip */
.week{display:grid; grid-template-columns:repeat(7,1fr); gap:6px}
.wd{display:flex; flex-direction:column; align-items:center; gap:4px; padding:8px 0 10px; border-radius:12px; font-size:11px; color:var(--muted)}
.wd.is-today{background:var(--chakra-soft); color:var(--ink)}
.wd b{font-family:var(--f-data); font-size:15px; color:var(--ink)}
.dot{width:22px; height:22px; border-radius:50%; display:grid; place-items:center; border:2px solid var(--line)}
.dot svg{width:12px; height:12px}
.dot.done{background:var(--leaf); border-color:var(--leaf); color:var(--card)}
.dot.missed{background:var(--danger); border-color:var(--danger); color:var(--card)}
.dot.rest{background:var(--rest-soft); border-color:var(--rest); color:var(--rest)}
.dot.open{border-color:var(--chakra)}
.dot.future{border-style:dashed}
.wd small{font-family:var(--f-data); font-size:9.5px; letter-spacing:.05em}

/* stats */
.tiles{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px}
.tile{background:var(--card); border:2px solid var(--panel); border-radius:12px; box-shadow:3px 3px 0 var(--panel); padding:12px 14px; display:flex; flex-direction:column; gap:2px; min-width:0}
.tile .big{font-family:var(--f-data); font-weight:700; font-size:30px; line-height:1.1}
.tile .big small{font-size:14px; color:var(--muted); font-weight:600}
.tile .sub{font-size:12px; color:var(--muted)}
.tile.power{grid-column:1/-1; background:linear-gradient(120deg,var(--chakra-soft),var(--card) 70%)}
.tile.power .big{font-size:38px; color:var(--chakra-ink)}
.chart{overflow-x:auto}
.chart svg{display:block; width:100%; height:auto; min-width:300px}
.ax{fill:var(--muted); font-family:var(--f-data); font-size:10px}
.gridline{stroke:var(--line); stroke-width:1}
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:12.5px; color:var(--muted)}
.legend span{display:inline-flex; align-items:center; gap:6px}
.legend i{width:10px; height:10px; border-radius:3px; display:inline-block}
.empty{font-size:13.5px; color:var(--muted); padding:10px 12px; border-radius:10px; background:var(--paper)}
.statrow{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px}
.statrow div{display:flex; flex-direction:column}
.statrow b{font-family:var(--f-data); font-size:22px}
.statrow span{font-size:12px; color:var(--muted)}
.list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column}
.list li{display:flex; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); font-size:14px}
.list li:last-child{border-bottom:0}

/* plan */
.plan-row{display:grid; grid-template-columns:84px 1fr; gap:10px; align-items:center}
.plan-row label{font-weight:700; font-size:14px}
.plan-row label small{display:block; font-weight:400; color:var(--muted); font-size:11.5px}
select,input[type=number],input[type=text],input[type=date]{width:100%; min-width:0; padding:10px 12px; border-radius:10px; border:1.5px solid var(--line); background:var(--paper); font-size:15px}
.mini-steppers{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px}
.mini{display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px 6px; border-radius:12px; background:var(--paper); text-align:center}
.mini span{font-size:11.5px; color:var(--muted)}
.mini div{display:flex; align-items:center; gap:8px}
.mini button{width:30px; height:30px; border-radius:50%; border:1.5px solid var(--line); background:var(--card); line-height:1}
.mini b{font-family:var(--f-data); font-size:20px; min-width:2.2ch}
.checks{display:flex; flex-wrap:wrap; gap:8px}
.check{display:inline-flex; align-items:center; gap:8px; padding:8px 12px; border-radius:10px; background:var(--paper); font-size:14px}
.form-grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px}
.field{display:flex; flex-direction:column; gap:4px; min-width:0}
.field span{font-size:12.5px; color:var(--muted)}
.field.full{grid-column:1/-1}
.rules{display:grid; grid-template-columns:1fr auto; gap:6px 12px; font-size:14px}
.rules b{font-family:var(--f-data); text-align:right}
.rules .neg{color:var(--danger)}
.notice{font-size:13px; padding:9px 12px; border-radius:10px; background:var(--rest-soft)}

/* ninja tab */
.ladder{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:4px}
.ladder li{border-radius:12px}
.ladder .rank-btn{all:unset; box-sizing:border-box; width:100%; display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center; padding:8px 6px; border-radius:12px; cursor:pointer}
.ladder .rank-btn:focus-visible{outline:3px solid var(--chakra); outline-offset:1px}
.ladder .rank-btn > span{display:block; min-width:0}
.ladder li.current{background:var(--chakra-soft)}
.ladder li.locked{opacity:.6}
.ladder li.locked .portrait img{filter:grayscale(1)}
.ladder .rn{display:block; font-weight:700}
.ladder .rx{display:block; font-family:var(--f-data); font-size:12.5px; color:var(--muted)}
.ladder .tag{font-family:var(--f-data); font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase}
.ladder-break{font-family:var(--f-data); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--chakra-ink); padding:10px 6px 2px; font-weight:700}
.scrolls{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px}
.sc{display:flex; gap:10px; align-items:flex-start; padding:10px; border-radius:12px; background:var(--paper); min-width:0}
.sc svg{flex:none; width:30px; height:30px}
.sc b{display:block; font-size:13.5px; line-height:1.25}
.sc span{font-size:12px; color:var(--muted); line-height:1.3; display:block}
.sc.locked{opacity:.5}
.sc.locked svg{filter:grayscale(1)}

/* top bar, sound */
.topbar{display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:42px}
.brand{font-family:var(--f-display); font-size:15px; letter-spacing:.04em}
.brand small{display:block; font-family:var(--f-data); font-size:10.5px; letter-spacing:.14em; color:var(--muted); text-transform:uppercase}
.page-title{font-family:var(--f-display); font-weight:400; font-size:26px; line-height:1.1}
.sound-btn{flex:none; width:42px; height:42px; border-radius:50%; border:2px solid var(--panel); background:var(--card); color:var(--chakra-ink); display:grid; place-items:center; box-shadow:2px 2px 0 var(--panel)}
.sound-btn svg{width:20px; height:20px}
.sound-btn[aria-pressed="false"]{color:var(--muted)}
.sound-btn:active{transform:translate(1px,1px); box-shadow:1px 1px 0 var(--panel)}

/* themes */
.themes{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px}
.theme-sw{all:unset; box-sizing:border-box; position:relative; display:flex; flex-direction:column; justify-content:flex-end; gap:4px; min-height:78px; padding:8px; border-radius:10px; border:2px solid var(--panel); cursor:pointer; overflow:hidden}
.theme-sw:focus-visible{outline:3px solid var(--chakra); outline-offset:2px}
.theme-sw i{position:absolute; top:8px; width:14px; height:14px; border-radius:50%; border:1.5px solid rgba(0,0,0,.25)}
.theme-sw i:first-child{left:8px} .theme-sw i:nth-child(2){left:26px}
.theme-sw b{font-size:11.5px; line-height:1.2; font-weight:700}
.theme-sw.on{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--chakra)}
.theme-sw.on::after{content:"Active"; position:absolute; top:6px; right:6px; font-family:var(--f-data); font-size:9.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; padding:2px 6px; border-radius:5px; background:var(--chakra); color:var(--on-chakra)}
.theme-sw.locked{cursor:default; border-style:dashed; background:var(--paper); color:var(--muted); align-items:center; justify-content:center; text-align:center}
.theme-sw.locked span{font-family:var(--f-display); font-size:22px}

/* event effects */
.mscroll.flash .chakra i.on{animation:flow 2.4s linear infinite, zap .8s ease-out}
@keyframes zap{0%{filter:brightness(2.1) saturate(1.4); box-shadow:0 0 30px var(--chakra)}100%{filter:none}}
.mscroll.flash .sets li:last-child,.mscroll.flash .slot.filled{animation:chippop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes chippop{0%{transform:scale(.55)}100%{transform:scale(1)}}
.shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(4px,-2px)}30%,50%,70%{transform:translate(-8px,3px)}40%,60%{transform:translate(8px,-3px)}}
.stamp{position:fixed; left:50%; top:40%; z-index:42; transform:translate(-50%,-50%) rotate(-8deg); padding:12px 22px 14px; border:6px solid var(--seal); border-radius:14px; color:var(--seal); background:var(--card); font-family:var(--f-display); font-size:44px; line-height:1; letter-spacing:.03em; white-space:nowrap; pointer-events:none; box-shadow:0 10px 40px rgba(0,0,0,.25)}
.stamp.go{animation:stampin 1.7s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes stampin{0%{opacity:0; transform:translate(-50%,-50%) scale(2.8) rotate(-18deg)}15%{opacity:1; transform:translate(-50%,-50%) scale(.92) rotate(-8deg)}22%{transform:translate(-50%,-50%) scale(1.05) rotate(-8deg)}30%,80%{opacity:1; transform:translate(-50%,-50%) scale(1) rotate(-8deg)}100%{opacity:0; transform:translate(-50%,-50%) scale(1) rotate(-8deg)}}
.flash{position:fixed; inset:0; z-index:43; background:var(--on-image); pointer-events:none; opacity:0}
.flash.go{animation:flashgo 1s ease-out}
@keyframes flashgo{0%{opacity:0}12%{opacity:.92}100%{opacity:0}}

/* set sound */
.vh{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); border:0; opacity:0}
.snd-now{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; background:var(--paper); min-width:0}
.snd-now svg{flex:none; width:22px; height:22px; color:var(--chakra-ink)}
.snd-now b{display:block; font-size:14px; overflow-wrap:anywhere}
.snd-now span{display:block; font-size:12px; color:var(--muted)}
.btnrow{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.snd-slot{display:flex; flex-direction:column; gap:8px; padding-top:12px; border-top:1px dashed var(--line)}
.snd-now .eyebrow{display:block; font-size:10.5px}
label.btn{display:inline-block; cursor:pointer}
.chips{display:flex; gap:6px; flex-wrap:wrap; align-items:center; font-size:13px; color:var(--muted)}
.chip{border:2px solid var(--panel); background:var(--card); border-radius:999px; padding:4px 12px; font-family:var(--f-data); font-weight:700; font-size:13px}
.chip[aria-pressed="true"]{background:var(--chakra); color:var(--on-chakra); border-color:var(--chakra)}

/* settings controls */
p.small{margin:0; font-size:13px}
.switch{all:unset; box-sizing:border-box; display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; padding:6px 0; cursor:pointer; font-weight:700; font-size:14.5px}
.switch:focus-visible{outline:3px solid var(--chakra); outline-offset:2px; border-radius:8px}
.switch-track{flex:none; position:relative; width:50px; height:30px; border-radius:15px; background:var(--line); border:2px solid var(--panel); transition:background-color .2s}
.switch-track span{position:absolute; top:2px; left:2px; width:22px; height:22px; border-radius:50%; background:var(--card); box-shadow:0 1px 3px rgba(0,0,0,.3); transition:transform .2s}
.switch[aria-checked="true"] .switch-track{background:var(--chakra)}
.switch[aria-checked="true"] .switch-track span{transform:translateX(20px)}
.range{display:flex; flex-direction:column; gap:4px; font-size:13px; color:var(--muted)}
.sw-sub{display:block; font-weight:400; font-size:12px; color:var(--muted); margin-top:1px}
.switch[disabled]{opacity:.45; cursor:default}
.switch > span:first-child{min-width:0}
.range input{width:100%; accent-color:var(--chakra)}
.tracks{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px}
.track{display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:10px; background:var(--paper)}
.track.on{background:var(--chakra-soft)}
.track > span{flex:1; min-width:0}
.track b{display:block; font-size:14px; overflow-wrap:anywhere}
.track small{display:block; font-size:12px; color:var(--muted)}
.track-play{flex:none; width:36px; height:36px; border-radius:50%; border:2px solid var(--panel); background:var(--card); color:var(--chakra-ink); display:grid; place-items:center}
.track-play svg,.mp-btn svg{width:16px; height:16px}

/* tab backgrounds */
.bg-slot{display:flex; flex-direction:column; gap:8px; padding-top:12px; border-top:1px dashed var(--line)}
.bg-head{display:flex; align-items:center; gap:12px; min-width:0}
.bg-thumb{flex:none; width:64px; height:64px; border-radius:10px; border:2px solid var(--panel); background:var(--paper) center/cover no-repeat; display:grid; place-items:center; color:var(--muted); font-size:20px}
.bg-head b{display:block; font-size:14.5px}
.bg-head span{display:block; font-size:12.5px; color:var(--muted); overflow-wrap:anywhere}

/* mini player */
.player{position:fixed; left:0; right:0; bottom:calc(70px + env(safe-area-inset-bottom,0px)); z-index:19; padding:0 max(12px, env(safe-area-inset-right,0px)) 6px max(12px, env(safe-area-inset-left,0px)); pointer-events:none}
.player-inner{pointer-events:auto; max-width:560px; margin:0 auto; display:flex; align-items:center; gap:10px; padding:7px 8px 7px 10px; border-radius:14px; background:var(--card); border:2px solid var(--panel); box-shadow:3px 3px 0 var(--panel)}
.mp-btn{flex:none; width:38px; height:38px; border-radius:50%; border:2px solid var(--panel); background:var(--chakra); color:var(--on-chakra); display:grid; place-items:center}
.mp-btn.plain{background:transparent; color:var(--ink); border-color:transparent; width:34px}
.mp-title{flex:1; min-width:0}
.mp-title b{display:block; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.mp-title span{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--muted)}
.eq{display:inline-flex; gap:2px; align-items:flex-end; height:11px}
.eq i{width:3px; height:100%; border-radius:1px; background:var(--chakra); transform-origin:bottom; animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.3s} .eq i:nth-child(3){animation-delay:-.6s}
.eq.paused i{animation:none; transform:scaleY(.3)}
@keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
body.has-player .wrap{padding-bottom:178px}

/* tabs */
.tabs{position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--card); border-top:2px solid var(--panel);
  padding:6px max(16px, env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px))}
.tabs-inner{max-width:560px; margin:0 auto; display:grid; grid-template-columns:repeat(5,1fr)}
.tabs a{display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 0; text-decoration:none; color:var(--muted); font-size:11.5px; font-weight:700; letter-spacing:.04em; border-radius:10px}
.tabs a svg{width:24px; height:24px}
.tabs a[aria-current="page"]{color:var(--chakra-ink)}
.tabs[hidden]{display:none!important}

/* overlay */
.overlay{position:fixed; inset:0; z-index:40; background:var(--scrim); display:grid; place-items:center;
  padding:calc(20px + env(safe-area-inset-top,0px)) max(20px, env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px, env(safe-area-inset-left,0px))}
.promo{position:relative; width:min(420px,100%); max-height:100%; overflow-y:auto; background:var(--card); border-radius:22px; text-align:center; display:flex; flex-direction:column; overflow-x:hidden; animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.promo-scene{display:block; width:100%; aspect-ratio:16/9; object-fit:cover; border-bottom:3px solid var(--rk)}
.promo-scene.locked{filter:grayscale(1) brightness(.75)}
.promo-body{display:flex; flex-direction:column; align-items:center; gap:10px; padding:18px 22px 22px}
.viewer::before{display:none}
.promo::before{content:""; position:absolute; inset:-40%; background:repeating-conic-gradient(from 0deg, var(--chakra-soft) 0 10deg, transparent 10deg 20deg); animation:spin 18s linear infinite; z-index:0}
.promo > *{position:relative; z-index:1}
.promo .eyebrow{color:var(--chakra-ink)}
.promo h2{font-size:30px}
@keyframes pop{from{transform:scale(.7); opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); z-index:30; background:var(--ink); color:var(--paper); padding:10px 16px; border-radius:12px; font-size:14px; font-weight:500; max-width:calc(100% - 32px); box-shadow:0 8px 24px rgba(0,0,0,.25)}
.loading{padding:60px 0; text-align:center; color:var(--muted)}
.loading b{display:block; font-family:var(--f-display); font-size:22px; color:var(--ink); font-weight:400; margin-bottom:6px}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important; transition:none!important}
}
@media (max-width:380px){
  .mission-title{font-size:23px}
  .stepper .val b{font-size:38px}
  .scrolls{grid-template-columns:1fr}
}
.alarm-list{list-style:none; margin:4px 0 0; padding:0; display:grid; gap:8px}
.alarm-list li{display:flex; gap:12px; align-items:baseline; font-size:14px}
.alarm-list b{font-family:var(--f-data); min-width:74px}
.alarm-list span{color:var(--muted)}
.import-panel{display:grid; gap:10px; margin-top:12px; padding:12px; border:1px solid var(--line); border-radius:12px; background:var(--paper-glass)}
.import-panel p{margin:0; font-size:14px}
/* mini ninja bar: shows the character and XP when the big stage is scrolled away */
.minibar{position:fixed; left:50%; top:calc(8px + env(safe-area-inset-top,0px)); z-index:25; width:min(720px,calc(100% - 24px)); display:flex; align-items:center; gap:12px; padding:7px 14px 7px 7px; border-radius:18px; background:var(--card-glass); -webkit-backdrop-filter:blur(12px) saturate(1.2); backdrop-filter:blur(12px) saturate(1.2); border:2px solid var(--panel); box-shadow:3px 3px 0 var(--panel); transform:translate(-50%,-140%); opacity:0; transition:transform .35s cubic-bezier(.2,1.2,.4,1),opacity .25s; pointer-events:none}
.minibar.show{transform:translate(-50%,0); opacity:1; pointer-events:auto}
.mb-face{position:relative; flex:none; width:52px; height:52px; border-radius:14px; overflow:hidden; background:var(--ink)}
.mb-face img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.mb-face::after{content:""; position:absolute; inset:0; border-radius:14px; box-shadow:inset 0 0 0 2px var(--aura,#ffd27a); opacity:.7}
.mb-mid{flex:1; min-width:0; display:grid; gap:5px}
.mb-top{display:flex; justify-content:space-between; gap:8px; font-size:13px; white-space:nowrap}
.mb-top b{font-family:var(--f-display); font-size:15px; overflow:hidden; text-overflow:ellipsis}
.mb-top span{font-family:var(--f-data); color:var(--muted)}
.mb-track{height:9px; border-radius:99px; background:var(--paper); border:1.5px solid var(--panel); overflow:hidden}
.mb-fill{height:100%; background:linear-gradient(90deg,var(--primary),var(--chakra)); transition:width .8s cubic-bezier(.2,1,.3,1)}
.mb-streaks{flex:none; display:flex; gap:6px; font-family:var(--f-data); font-weight:700; font-size:14px}
.mb-streaks span{display:inline-flex; align-items:center; gap:3px; padding:3px 8px; border-radius:99px; background:var(--paper-glass)}
.mb-streaks svg{width:14px; height:14px}
.minibar.pulse{animation:mbpulse .9s ease-out}
@keyframes mbpulse{0%{box-shadow:3px 3px 0 var(--panel),0 0 0 0 var(--aura,#ffd27a)}30%{box-shadow:3px 3px 0 var(--panel),0 0 26px 6px var(--aura,#ffd27a)}100%{box-shadow:3px 3px 0 var(--panel),0 0 0 0 transparent}}
.minibar.pulse .mb-face img{animation:flexface .7s cubic-bezier(.2,1.5,.4,1)}
@keyframes flexface{0%{transform:scale(1); filter:none}35%{transform:scale(1.15); filter:brightness(1.4)}100%{transform:scale(1)}}
.tap-xp{position:fixed; z-index:45; transform:translate(-50%,-50%); font-family:var(--f-display); font-size:22px; line-height:1; color:var(--chakra-ink); text-shadow:0 0 12px var(--glow),0 1px 0 var(--card); pointer-events:none; white-space:nowrap; animation:tapxp 1.15s ease-out forwards}
@keyframes tapxp{0%{opacity:0; transform:translate(-50%,-30%) scale(.7)}18%{opacity:1; transform:translate(-50%,-80%) scale(1.12)}100%{opacity:0; transform:translate(-50%,-260%) scale(1)}}
.mb-xp{position:absolute; left:70px; top:-6px; font-family:var(--f-display); font-size:20px; color:var(--chakra-ink); text-shadow:0 0 10px var(--glow); pointer-events:none; animation:tapxp 1.15s ease-out forwards}
/* story scenes: streak broken, comeback */
.scene{position:relative; width:min(560px,100%); border-radius:22px; overflow:hidden; background:#0d0d10; color:#f2efe9; box-shadow:0 30px 80px rgba(0,0,0,.6)}
.scene img{display:block; width:100%; aspect-ratio:16/9; object-fit:cover}
.scene .scene-body{padding:18px 20px 20px; display:grid; gap:10px; text-align:center}
.scene .eyebrow{color:#c9c3b8}
.scene h2{margin:0; font-size:28px; color:#fff}
.scene p{margin:0; font-size:14.5px; line-height:1.5; color:#ddd6cb}
.scene.funeral img{filter:saturate(.7)}
.scene.comeback{box-shadow:0 0 0 2px #8fd0ff,0 0 60px rgba(120,190,255,.55),0 30px 80px rgba(0,0,0,.6)}
.scene.comeback img{animation:revive 2.4s ease-out}
@keyframes revive{0%{filter:grayscale(1) brightness(.4) blur(3px); transform:scale(1.08)}60%{filter:grayscale(.3) brightness(1.1)}100%{filter:none; transform:scale(1)}}
</style>
</head>

const hex2rgb = h => { h=h.replace('#',''); return [0,2,4].map(i=>parseInt(h.substr(i,2),16)); };
const rgb2hex = a => '#'+a.map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('');
const mixHex = (a,b,t) => { const A=hex2rgb(a), B=hex2rgb(b); return rgb2hex(A.map((v,i)=>v+(B[i]-v)*t)); };
const lumHex = h => { const [r,g,b]=hex2rgb(h).map(v=>{ v/=255; return v<=.03928 ? v/12.92 : Math.pow((v+.055)/1.055,2.4); }); return .2126*r+.7152*g+.0722*b; };
const contrastHex = (a,b) => { const x=lumHex(a), y=lumHex(b); return (Math.max(x,y)+.05)/(Math.min(x,y)+.05); };
const rgbaHex = (h,al) => { const [r,g,b]=hex2rgb(h); return `rgba(${r},${g},${b},${al})`; };

    `--paper:${p.paper}`, `--card:${card}`, `--ink:${p.ink}`, `--muted:${mixHex(p.ink,p.paper,dark?.36:.37)}`, `--line:${mixHex(p.paper,p.ink,dark?.17:.15)}`,

const queues = {};
function persist(path, data, onDrain){
  let q = queues[path] || (queues[path]={running:false,has:false,data:null,onDrain:null});
  q.data=data; q.has=true; q.onDrain=onDrain;
  if(!q.running) drain(path);
}
async function drain(path){
  const q=queues[path]; q.running=true;
  while(q.has){
    q.has=false; const data=q.data;
    for(let attempt=0; attempt<2; attempt++){
      try{ await db.doc(path).set(data); break; }
      catch(e){
        if(e && e.code==='unavailable' && attempt===0){ await sleep(400+Math.random()*700); continue; }
        writeError(e); break;
      }
    }
  }
  q.running=false; if(q.onDrain) q.onDrain(); render();
}
function writeError(e){
  const code = e && e.code;
  if(code==='invalid_argument'){ state.readOnly=true; state.error='Only the owner of this village can log here. You are viewing a read-only copy.'; }
  else if(code==='quota_exceeded'){ state.error='Storage for this page is full, so that entry was not saved.'; }
  else { state.error='That entry could not be saved. Check your connection and log it again.'; }
}
function save(kind, key, data){
  if(state.readOnly) return;
  if(state.mode==='db'){
    const single = SINGLE_DOCS.includes(kind);
    const path = single ? PATH[kind] : `${PATH[kind]}/${key}`;
    if(single) pending[kind]=data; else pending[kind][key]=data;
    persist(path, data, ()=>{ if(single) pending[kind]=null; else delete pending[kind][key]; });
  } else {
    if(SINGLE_DOCS.includes(kind)) state[kind]=data; else state[kind][key]=data;
    saveLocal();
  }
  render();
}

/* ---------- schedule ---------- */
function sortedHistory(s){ return (s.scheduleHistory||[]).slice().sort((a,b)=>a.from<b.from?-1:a.from>b.from?1:0); }
function entryFor(s, date){ const h=sortedHistory(s); let e=h[0]; for(const x of h){ if(x.from<=date) e=x; } return e; }
function planFor(s, date){
  const e = entryFor(s, date) || {plan:DEFAULT_PLAN, gtg:{sets:6,minSets:5,pct:50}, test:{sets:2,ex:['pullups','dips']}};
  const p = (e.plan && e.plan[parse(date).getDay()]) || {type:'rest'};
  const plan = Object.assign({}, p, {gtg:e.gtg, test:e.test, combo:Object.assign({sets:3}, e.combo||{})});
  if(plan.type==='gtg' && !(s.exercises||{})[plan.ex]) return Object.assign(plan,{type:'rest'});
  if(plan.type==='combo'){ const exs=(plan.exs||[]).filter(id=>(s.exercises||{})[id]); if(!exs.length) return Object.assign(plan,{type:'rest'}); plan.exs=exs; }
  return plan;
}
const gtgTarget = (max, pct) => Math.max(1, Math.round((max||1)*pct/100));

/* ---------- study: rules ---------- */
const STUDY = {halfXp:20, minBonus:50, fullBonus:30, combo:10, comboWindow:60*60000, weekGoal:1800, weekXp:400, capMs:3*3600000, offFull:480};
const STUDY_DEFAULT = {week:{min:240, full:360}, end:{min:360, full:480}};
const studyPlanOf = e => { const st=(e&&e.study)||{}; return {week:Object.assign({}, STUDY_DEFAULT.week, st.week), end:Object.assign({}, STUDY_DEFAULT.end, st.end)}; };
const studyTarget = d => { const w=parse(d).getDay(); if(w===4) return null; const sp=studyPlanOf(entryFor(S()||{}, d)); const t=(w===5||w===6)?sp.end:sp.week; return {min:t.min, full:t.full}; };
const isExam = d => ((S()||{}).examWeeks||[]).some(e=>e && e.start<=d && d<=e.end);
const examFor = d => ((S()||{}).examWeeks||[]).find(e=>e && e.start<=d && d<=e.end) || null;
const getStudy = d => pending.study[d] || state.study[d];
const timerDoc = () => pending.timer || state.timer || {state:'idle'};
const fmtH = m => { m=Math.max(0,Math.round(m)); const h=Math.floor(m/60), r=m%60; return h ? (r?`${h}h ${r}m`:`${h}h`) : `${r}m`; };
const dayStartMs = d => parse(d).getTime();
/* split a time span into per-day pieces (local midnight boundaries) */
function splitByDay(a, b){
  const out=[]; let s=a;
  while(s<b){ const d=ymd(new Date(s)); const e=Math.min(b, dayStartMs(addDays(d,1))); out.push({date:d, start:s, end:e}); s=e; }
  return out;
}
function provisionalPieces(){
  const T=timerDoc(); if(T.state!=='running' || !T.segStart) return [];
  const end=Math.min(Date.now(), T.checkAt||Infinity); if(end<=T.segStart) return [];
  return splitByDay(T.segStart, end).map(p=>({date:p.date, start:p.start, end:p.end, min:(p.end-p.start)/60000, src:'live'}));
}
/* times at which each full study hour of the day was completed */
function hourTimes(segs){
  const out=[]; let cum=0, next=1;
  segs.slice().sort((a,b)=>a.end-b.end).forEach(g=>{
    if(g.src==='manual'){ cum+=g.min; while(cum>=next*60-1e-9){ out.push(g.end); next++; } return; }
    while(cum+g.min>=next*60-1e-9){ out.push(g.start+(next*60-cum)*60000); next++; }
    cum+=g.min;
  });
  return out;
}
function computeStudy(s, today){
  const res={days:{}, list:[], streak:0, best:0, weeks:{}, awards:[], start:s.studyStart||null};
  if(!s.studyStart || s.studyStart>today) return res;
  const live={}; provisionalPieces().forEach(p=>{ (live[p.date]=live[p.date]||[]).push(p); });
  for(let d=s.studyStart, g=0; d<=today && g<4000; d=addDays(d,1), g++){
    const doc=getStudy(d)||{}, entries=(doc.entries||[]).map(e=>({start:+new Date(e.start||e.end), end:+new Date(e.end), min:+e.min||0, src:e.src||'manual'}));
    const segs=entries.concat(live[d]||[]);
    const mins=segs.reduce((m,x)=>m+x.min,0), committed=entries.reduce((m,x)=>m+x.min,0);
    const base=studyTarget(d), off=!base && parse(d).getDay()===4 && (doc.offday || mins>0);
    const tgt= off ? {min:0, full:STUDY.offFull, off:true} : base, exam=isExam(d), wk=weekStart(d);
    const W=res.weeks[wk]||(res.weeks[wk]={start:wk, mins:0, shields:0, won:false});
    let xp=Math.floor(mins/30)*STUDY.halfXp, status;
    if(tgt){ if(mins>=tgt.min && !tgt.off) xp+=STUDY.minBonus; if(mins>=tgt.full) xp+=STUDY.fullBonus; }
    if(!tgt) status='rest';
    else if(tgt.off) status = mins>0 ? 'done' : 'rest';
    else if(mins>=tgt.min) status='done';
    else if(exam) status='exam';
    else if(doc.shield && W.shields<1){ status='shield'; W.shields++; }
    else status = d<today ? 'missed' : 'open';
    const before=res.streak;
    if(status==='done'){ res.streak++; res.best=Math.max(res.best,res.streak); }
    else if(status==='missed') res.streak=0;
    const prevWk=W.mins; W.mins+=mins;
    let award=0;
    if(!W.won && prevWk<STUDY.weekGoal && W.mins>=STUDY.weekGoal){ W.won=true; award=STUDY.weekXp; res.awards.push({key:'study', sensei:'hiruzen', date:d, week:wk, xp:STUDY.weekXp, title:'Scholar\'s week'}); }
    const rec={date:d, mins, committed, tgt, exam, status, xp:xp+award, award, hours:hourTimes(segs), shield:!!doc.shield, broke:status==='missed' && before>0, entries:doc.entries||[]};
    res.days[d]=rec; res.list.push(rec);
  }
  return res;
}
/* match each completed study hour to one workout set logged within the next 60 minutes */
function comboMatches(hours, sets){
  const ts=sets.map(x=>+new Date(x.t)).filter(n=>!isNaN(n)).sort((a,b)=>a-b), used=new Set(); let n=0; const free=[];
  hours.forEach(h=>{ const i=ts.findIndex((t,k)=>!used.has(k) && t>=h && t<=h+STUDY.comboWindow); if(i>=0){ used.add(i); n++; } else free.push(h); });
  return {n, free};
}

/* ---------- the engine: everything is derived from the logs ---------- */
function compute(){
  const s=S(), today=todayStr();
  const exIds = Object.keys(s.exercises||{});
  const maxes={}, best={}, maxHist={}, totalReps={};
  exIds.forEach(id=>{ const b=(s.baseline||{})[id]||{max:0,date:s.startDate}; maxes[id]=b.max; best[id]=b.max; maxHist[id]=[{date:b.date, v:b.max, start:true}]; totalReps[id]=0; });
  const days=[], prs=[], weeks={}, awards=[];
  const bodyDates=new Set(allBody().map(b=>b.date));
  let total=0, peak=0, streak=0, bestStreak=0, doneCount=0, missedCount=0;
  const study=computeStudy(s, today); let readyUntil=0;
  if(s.startDate && s.startDate<=today){
    let guard=0;
    for(let d=s.startDate; d<=today && guard<4000; d=addDays(d,1), guard++){
      const plan = planFor(s,d);
      const sets = ((getDay(d)||{}).sets)||[];
      const wk = weekStart(d);
      const W = weeks[wk] || (weeks[wk]={start:wk, reps:{}, missed:0, days:0, done:0, qual:0, weigh:0, prDone:false, open:false});
      sets.forEach(x=>{ totalReps[x.ex]=(totalReps[x.ex]||0)+x.reps; W.reps[x.ex]=(W.reps[x.ex]||0)+x.reps; });
      let base=0, complete=false, info={};
      if(plan.type==='gtg'){
        const ex=plan.ex, g=plan.gtg, target=gtgTarget(maxes[ex], g.pct);
        const exSets=sets.filter(x=>x.ex===ex).slice(0,10);
        let q=0;
        exSets.forEach(x=>{ if(x.reps>=target){ q++; base+=XP.gtgSet+x.reps; } else base+=x.reps; });
        complete = q>=g.minSets;
        if(complete) base+=XP.gtgComplete;
        if(q>=g.sets) base+=XP.gtgFull;
        info={ex, target, q, need:g.minSets, goal:g.sets, logged:exSets.length, exSets};
      } else if(plan.type==='combo'){
        const g=plan.gtg, per=plan.combo.sets;
        const parts=plan.exs.map(ex=>{
          const target=gtgTarget(maxes[ex], g.pct), exSets=sets.filter(x=>x.ex===ex).slice(0,10);
          let q=0;
          exSets.forEach(x=>{ if(x.reps>=target){ q++; base+=XP.gtgSet+x.reps; } else base+=x.reps; });
          return {ex, target, q, need:per, logged:exSets.length, exSets};
        });
        complete = parts.every(pt=>pt.q>=per);
        if(complete) base+=XP.gtgComplete+XP.gtgFull;
        info={parts, q:parts.reduce((m,pt)=>m+Math.min(pt.q,per),0), qAll:parts.reduce((m,pt)=>m+pt.q,0), need:per*parts.length, goal:per*parts.length};
      } else if(plan.type==='test'){
        const t=plan.test;
        const tex=(t.ex||[]).filter(id=>(s.exercises||{})[id]);
        const per=tex.map(id=>{ const xs=sets.filter(x=>x.ex===id).slice(0,t.sets); return {ex:id, sets:xs, top:xs.reduce((m,x)=>Math.max(m,x.reps),0), prev:maxes[id], prBefore:best[id], pr:false}; });
        per.forEach(p=>p.sets.forEach(x=>{ base+=XP.testRep*x.reps; }));
        complete = per.length>0 && per.every(p=>p.sets.length>=t.sets);
        if(complete) base+=XP.testComplete;
        per.forEach(p=>{ if(p.sets.length && p.top>best[p.ex]){ p.pr=true; base+=XP.pr; prs.push({date:d, ex:p.ex, v:p.top}); best[p.ex]=p.top; } });
        info={per, sets:t.sets};
      }
      let status;
      if(plan.type==='rest'){ status='rest'; base=XP.rest; }
      else if(complete) status='done';
      else status = d<today ? 'missed' : 'open';
      if(isExam(d) && status!=='done'){ status='exam'; if(plan.type==='rest') base=0; }
      let xp;
      if(status==='done'||status==='rest'){ streak++; bestStreak=Math.max(bestStreak,streak); xp=Math.round(base*mult(streak)); if(status==='done'){ doneCount++; W.done++; } }
      else if(status==='missed'){ streak=0; xp=base-(plan.type==='test'?XP.missTest:XP.missGtg); missedCount++; W.missed++; }
      else xp=base;
      W.days++;
      if(plan.type==='test' && (status==='done' || status==='missed')){
        info.per.forEach(p=>{ if(p.sets.length){ maxes[p.ex]=p.top; maxHist[p.ex].push({date:d, v:p.top}); } });
      }
      const bonus=[];
      if(plan.type==='gtg' || plan.type==='combo'){ const before=W.qual; W.qual+=(plan.type==='combo'?info.qAll:info.q)||0; if(before<SENSEIS.kakashi.challenge.goal && W.qual>=SENSEIS.kakashi.challenge.goal) bonus.push('kakashi'); }
      if(plan.type==='test' && !W.prDone && info.per && info.per.some(p=>p.pr)){ W.prDone=true; bonus.push('guy'); }
      if(bodyDates.has(d)){ W.weigh++; if(W.weigh===SENSEIS.jiraiya.challenge.goal) bonus.push('jiraiya'); }
      W.open = status==='open';
      if(status==='exam') W.exam=(W.exam||0)+1;
      if(parse(d).getDay()===6 && W.days===7 && W.missed===0 && status!=='open') bonus.push('hiruzen');
      bonus.forEach(id=>{ xp+=SENSEIS[id].challenge.xp; awards.push({key:id, sensei:id, date:d, week:wk, xp:SENSEIS[id].challenge.xp, title:SENSEIS[id].challenge.title}); });
      const srec=study.days[d];
      const cm=comboMatches(srec?srec.hours:[], sets); info.combo=cm.n; xp+=cm.n*STUDY.combo;
      if(d===today && plan.type!=='rest'){ const nowMs=Date.now(); cm.free.forEach(h=>{ if(nowMs>=h && nowMs<=h+STUDY.comboWindow) readyUntil=Math.max(readyUntil, h+STUDY.comboWindow); }); }
      if(srec){ total=Math.max(0,total+srec.xp); if(srec.award) awards.push(study.awards.find(a=>a.date===d)); }
      total=Math.max(0,total+xp);
      peak=Math.max(peak, rankFor(total));
      days.push({date:d, plan, sets, status, xp, base, info, streak, bonus});
    }
  }
  const todayRec = days.find(x=>x.date===today) || null;
  const weekList = Object.values(weeks).sort((a,b)=>a.start<b.start?-1:1);
  const cleanWeeks = weekList.filter(w=>w.days===7 && w.missed===0 && w.done>0 && addDays(w.start,6)<today).length;
  const body = allBody();
  const weight = body.length ? body[body.length-1].weight : null;
  const power = weight ? Math.round(((maxes.pullups||0)*3 + (maxes.dips||0)) * weight / 10) : null;
  const weekNow = weeks[weekStart(today)] || {qual:0, weigh:0, prDone:false, days:0, missed:0};
  const startedMidWeek = weekStart(s.startDate||today)===weekStart(today) && parse(s.startDate||today).getDay()!==0;
  return { study, readyUntil, awards, weekNow, startedMidWeek, today, todayRec, days, total, peak, rankNow:rankFor(total), streak, bestStreak, doneCount, missedCount, maxes, best, maxHist, prs, totalReps, weekList, cleanWeeks, body, weight, power, exIds };
}

/* ---------- views ---------- */
function todayPower(C){
  const t=C.todayRec; if(!t) return 0;
  if(t.plan.type==='rest') return .3;
  if(t.status==='done') return 1;
  if(t.plan.type==='gtg' || t.plan.type==='combo') return clamp(t.info.q/Math.max(1,t.info.goal),0,1);
  const tot=t.info.per.length*t.info.sets, got=t.info.per.reduce((m,p)=>m+p.sets.length,0);
  return tot ? clamp(got/tot,0,1) : 0;
}

function updateMinibar(C){
  const mb=document.getElementById('minibar'); if(!mb) return;
  if(!C || ui.tab!=='mission' || !S()){ mb.classList.remove('show'); return; }
  const r=RANKS[C.peak], nx=RANKS[C.peak+1];
  const pct = nx ? clamp((C.total-r.xp)/(nx.xp-r.xp)*100,0,100) : 100;
  const key=[C.peak,C.total,C.streak,C.study.streak,!!C.study.start].join('|');
  if(mb.dataset.key!==key){
    mb.dataset.key=key; mb.style.setProperty('--aura', r.aura);
    const fill=mb.querySelector('.mb-fill');
    if(fill && mb.dataset.rank===String(C.peak)){
      fill.style.width=pct+'%';

function weekStrip(C){
  const s=S(), ws=weekStart(C.today), byDate={};
  C.days.forEach(d=>byDate[d.date]=d);
  const cells = Array.from({length:7},(_,k)=>{
    const d=addDays(ws,k), rec=byDate[d];
    let cls='future', inner='', lab='';
    const plan = d>=s.startDate ? planFor(s,d) : null;
    if(plan) lab = plan.type==='rest' ? 'REST' : plan.type==='test' ? 'TEST' : plan.type==='combo' ? (plan.exs||[]).map(id=>String(exName(id)).slice(0,1).toUpperCase()).join('+') : (exName(plan.ex).slice(0,4).toUpperCase());
    if(d<s.startDate){ cls='future'; lab='—'; }
    else if(rec){ cls=rec.status; inner = rec.status==='done'?ico.check : rec.status==='missed'?ico.x : rec.status==='rest'?ico.rest : ''; }
    return `<div class="wd${d===C.today?' is-today':''}"><span>${DOW[k].slice(0,3)}</span><b>${parse(d).getDate()}</b><span class="dot ${cls}">${inner}</span><small>${lab}</small></div>`;
  }).join('');
  return `<section class="card"><div class="section-head"><h2>This week</h2><span class="eyebrow">${esc(shortDate(ws))} – ${esc(shortDate(addDays(ws,6)))}</span></div><div class="week">${cells}</div></section>`;
}

function studyLine(C){
  const st=C.study, rec=st.days[C.today]; if(!rec) return '';
  const hour=new Date().getHours(), y=st.days[addDays(C.today,-1)];
  const v={name:(S().name||'ninja'), done:fmtH(rec.mins), min:rec.tgt?fmtH(rec.tgt.min):'', full:rec.tgt?fmtH(rec.tgt.full):'', left:rec.tgt?fmtH(Math.max(0,rec.tgt.min-rec.mins)):''};
  let key;
  if(rec.tgt && rec.tgt.off && rec.mins<=0) key='offday';
  else if(rec.status==='rest') key='rest';
  else if(rec.exam && rec.status!=='done') key='exam';
  else if(rec.status==='shield') key='shield';
  else if(rec.status==='done') key = rec.mins>=rec.tgt.full ? 'full' : 'done';
  else if(hour>=20) key='late';
  else if(rec.mins<=0) key = (y && y.status==='missed') ? 'lost' : 'fresh';
  else key = (rec.tgt.min-rec.mins<=60) ? 'close' : 'progress';
  const arr=STUDY_LINES[key];
  return fillLine(arr[hashStr(`${C.today}|s|${key}|${ui.lineNonce||0}`)%arr.length], v);
}
const shieldUsedThisWeek = C => { const st=C.study, ws=weekStart(C.today); return st.list.some(r=>r.date>=ws && r.status==='shield'); };

function studyWeekChart(C){

  const step=hi>8?4:2, top=Math.ceil(hi/step)*step, Y=h=>T+(1-h/top)*(H-T-B), slot=(W-L-R)/7, bw=slot*.56;
  let g='';
  for(let h=0; h<=top; h+=step){ const y=Y(h).toFixed(1); g+=`<line class="gridline" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text class="ax" x="${L-6}" y="${(+y+3.5).toFixed(1)}" text-anchor="end">${h}h</text>`; }
  days.forEach((d,k)=>{
    const rec=C.study.days[d], tgt=studyTarget(d), x=L+slot*k+(slot-bw)/2, h=((rec&&rec.mins)||0)/60, y=Y(h);
    const col = !rec ? 'var(--line)' : rec.status==='done' ? 'var(--study)' : rec.status==='missed' ? 'var(--danger)' : rec.status==='shield' ? 'var(--study-soft-ink)' : rec.status==='exam' ? 'var(--exam)' : 'var(--study-soft-ink)';
    g+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0,Y(0)-y).toFixed(1)}" rx="3" style="fill:${col}"><title>${esc(shortDate(d))}: ${fmtH((rec&&rec.mins)||0)}</title></rect>`;
    if(tgt){ const ym=Y(tgt.min/60).toFixed(1); g+=`<line x1="${(x-3).toFixed(1)}" x2="${(x+bw+3).toFixed(1)}" y1="${ym}" y2="${ym}" style="stroke:var(--ink)" stroke-width="1.6" stroke-dasharray="3 2"/>`; }
    if(!tgt) g=`<rect x="${(L+slot*k+2).toFixed(1)}" y="${T}" width="${(slot-4).toFixed(1)}" height="${(Y(0)-T).toFixed(1)}" rx="4" style="fill:var(--rest-soft)" opacity=".7"/>`+g;

function niceStep(x){ if(x<=0) return 1; const p=Math.pow(10,Math.floor(Math.log10(x))); const n=x/p; return (n<=1?1:n<=2?2:n<=5?5:10)*p; }
function lineChart(series, o){
  o=o||{}; const W=340, H=o.h||170, L=34, R=30, T=14, B=24;
  const pts=series.flatMap(s=>s.points); if(!pts.length) return '';
  const dates=pts.map(p=>p.date).sort(); const first=dates[0];
  let x0=dnum(first), x1=dnum(dates[dates.length-1]); if(x1-x0<6) x1=x0+6;
  const vals=pts.map(p=>p.v); let ymin=Math.min(...vals), ymax=Math.max(...vals);
  let lo, hi;
  if(o.tight){ lo=ymin-1; hi=ymax+1; } else { lo=0; hi=ymax*1.2||1; }
  const step=niceStep((hi-lo)/4); lo=Math.floor(lo/step)*step; hi=Math.ceil(hi/step)*step; if(hi<=lo) hi=lo+step;
  const X=d=>L+(dnum(d)-x0)/(x1-x0)*(W-L-R), Y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
  let g='';
  for(let v=lo; v<=hi+1e-9; v+=step){ const y=Y(v).toFixed(1); g+=`<line class="gridline" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text class="ax" x="${L-6}" y="${(+y+3.5).toFixed(1)}" text-anchor="end">${+v.toFixed(1)}</text>`; }
  g+=`<text class="ax" x="${L}" y="${H-6}">${esc(shortDate(first))}</text><text class="ax" x="${W-R}" y="${H-6}" text-anchor="end">${esc(shortDate(addDays(first,x1-x0)))}</text>`;
  const lines = series.map(s=>{
    const ps=s.points.slice().sort((a,b)=>a.date<b.date?-1:1); if(!ps.length) return '';
    const d=ps.map((p,i)=>`${i?'L':'M'}${X(p.date).toFixed(1)} ${Y(p.v).toFixed(1)}`).join(' ');
    const area = series.length===1 && ps.length>1 ? `<path d="${d} L${X(ps[ps.length-1].date).toFixed(1)} ${Y(lo).toFixed(1)} L${X(ps[0].date).toFixed(1)} ${Y(lo).toFixed(1)}Z" style="fill:${s.color}" fill-opacity=".12"/>` : '';
    const dots = ps.map((p,i)=>`<circle cx="${X(p.date).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="${i===ps.length-1?4.5:3}" style="fill:${i===ps.length-1?s.color:'var(--card)'};stroke:${s.color}" stroke-width="2"/>`).join('');
    const lp=ps[ps.length-1];
    return `${area}<path d="${d}" style="fill:none;stroke:${s.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}<text class="ax" x="${(X(lp.date)+7).toFixed(1)}" y="${(Y(lp.v)+3.5).toFixed(1)}" style="fill:${s.color};font-weight:700">${+lp.v.toFixed(1)}</text>`;
  }).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'Chart')}">${g}${lines}</svg></div>`;
}
function barChart(weeks, exIds){
  const W=340, H=180, L=34, R=8, T=12, B=24;
  const vals=weeks.flatMap(w=>exIds.map(id=>w.reps[id]||0)); const mx=Math.max(1,...vals);

  for(let v=0; v<=hi+1e-9; v+=step){ const y=Y(v).toFixed(1); g+=`<line class="gridline" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text class="ax" x="${L-6}" y="${(+y+3.5).toFixed(1)}" text-anchor="end">${fmt(v)}</text>`; }
  const n=Math.max(weeks.length,1), slot=(W-L-R)/Math.max(n,4), gw=Math.min(slot*0.7, 44), bw=gw/exIds.length;
  const bars=weeks.map((w,i)=>{

}
function heatmap(C){
