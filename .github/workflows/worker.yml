# Deploys the sync + reminders Worker (worker/) to Cloudflare whenever it changes on main.
# Needs three repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, LEAF_SYNC_KEY.
name: Deploy sync worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'leaf-merge.js'
      - '.github/workflows/worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      LEAF_SYNC_KEY: ${{ secrets.LEAF_SYNC_KEY }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the three secrets are there
        run: |
          ok=1
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::CLOUDFLARE_API_TOKEN is missing"; ok=0; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::CLOUDFLARE_ACCOUNT_ID is missing"; ok=0; }
          [ -n "$LEAF_SYNC_KEY" ] || { echo "::error::LEAF_SYNC_KEY is missing"; ok=0; }
          [ "$ok" = 1 ] || exit 1
          if [ "${#LEAF_SYNC_KEY}" -lt 16 ]; then echo "::warning::LEAF_SYNC_KEY is shorter than 16 characters. A longer one is safer."; else echo "Sync key length is fine."; fi

      - name: Unit tests (merge rules, reminders, push, sync endpoint)
        run: node --test "tests/unit/*.test.mjs"

      - name: Install Wrangler
        working-directory: worker
        run: npm ci --no-audit --no-fund

      - name: Create the database the first time
        working-directory: worker
        run: |
          set -euo pipefail
          find_id() { npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const l=JSON.parse(s);const d=l.find(x=>x.name==="leaf-village");process.stdout.write(d?d.uuid:"")})'; }
          ID="$(find_id)"
          if [ -z "$ID" ]; then
            echo "No database yet: creating leaf-village"
            npx wrangler d1 create leaf-village > /dev/null
            ID="$(find_id)"
          fi
          [ -n "$ID" ] || { echo "::error::Could not create or find the D1 database. Does the API token include D1 Edit?"; exit 1; }
          sed -i "s/00000000-0000-0000-0000-000000000000/$ID/" wrangler.toml
          echo "Database ready."

      - name: Apply database migrations
        working-directory: worker
        run: npx wrangler d1 migrations apply leaf-village --remote

      - name: Make sure the account has a workers.dev address
        id: sub
        run: |
          set -euo pipefail
          api() { curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "$@"; }
          read_sub() { node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);process.stdout.write((j.result&&j.result.subdomain)||"")}catch(e){}})'; }
          BASE="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          SUB="$(api "$BASE" | read_sub)"
          if [ -z "$SUB" ]; then
            NAME="leaf-village-$(openssl rand -hex 3)"
            echo "No workers.dev address yet: registering $NAME"
            SUB="$(api -X PUT "$BASE" -d "{\"subdomain\":\"$NAME\"}" | read_sub)"
          fi
          [ -n "$SUB" ] || { echo "::error::Could not read or create the workers.dev subdomain."; exit 1; }
          echo "url=https://leaf-village-sync.$SUB.workers.dev" >> "$GITHUB_OUTPUT"
          echo "Worker address: https://leaf-village-sync.$SUB.workers.dev"

      - name: Deploy the Worker
        working-directory: worker
        run: npx wrangler deploy

      - name: Give the Worker its sync key
        working-directory: worker
        run: printf '%s' "$LEAF_SYNC_KEY" | npx wrangler secret put LEAF_SYNC_KEY > /dev/null && echo "Sync key stored as a Worker secret."

      - name: Smoke test the live Worker
        env:
          WORKER_URL: ${{ steps.sub.outputs.url }}
        run: node worker/smoke.mjs

      - name: Summary
        env:
          WORKER_URL: ${{ steps.sub.outputs.url }}
        run: echo "Worker live at $WORKER_URL" >> "$GITHUB_STEP_SUMMARY"
